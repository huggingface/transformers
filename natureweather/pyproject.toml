[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "naturev1"
version = "0.1.0"
description = "Probabilistic weather and hurricane-track model over geolocated fields, with live GOES ingest"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Nathan" }]
keywords = ["weather", "hurricane", "forecasting", "goes", "satellite", "geometric-deep-learning", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["torch>=2.5", "ihelix>=0.1.0", "numpy>=1.24"]

[project.optional-dependencies]
satellite = ["xarray>=2023.1", "netCDF4>=1.6"]
hub = ["huggingface_hub>=0.20"]
all = ["xarray>=2023.1", "netCDF4>=1.6", "huggingface_hub>=0.20"]

[project.urls]
Source = "https://github.com/Wisk-inc/transformers/tree/main/natureweather"

[tool.hatch.build.targets.wheel]
packages = ["naturev1"]
