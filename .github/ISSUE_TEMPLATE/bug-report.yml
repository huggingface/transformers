name: "\U0001F41B Bug Report"
description: Submit a bug report to help us improve transformers
labels: [ "bug" ]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! 🤗

  - type: textarea
    id: system-info
    attributes:
      label: System Info
      description: Please share your system info with us. You can run the command `transformers env` and copy-paste its output below.
      placeholder: transformers version, platform, python version, ...
    validations:
      required: true

  - type: textarea
    id: who-can-help
    attributes:
      label: Who can help?
      description: |
        Your issue will be replied to more quickly if you can figure out the right person to tag with @
        If you know how to use git blame, that is the easiest way, otherwise, here is a rough guide of **who to tag**.

        All issues are read by one of the core maintainers, so if you don't know who to tag, just leave this blank and
        a core maintainer will ping the right person.

        Please tag fewer than 3 people.

        Models:

          - text models: @ArthurZucker @Cyrilvallez @vasqu
          - vision models: @molbap @guarin
          - audio models: @eustlb @ebezzam @vasqu
          - multimodal models: @zucchini-nlp

        Library:

          - generate: @zucchini-nlp (visual-language models) or @Cyrilvallez (all others)
          - continuous batching: @remi-or @ArthurZucker @McPatate
          - pipelines: @Rocketknight1
          - tokenizers: @ArthurZucker and @itazap
          - trainer: @SunMarc
          - attention: @vasqu @ArthurZucker @CyrilVallez
          - model loading (from pretrained, etc): @CyrilVallez
          - distributed: @3outeille @ArthurZucker
          - CIs: @ydshieh

        Integrations:

          - ray/raytune: @richardliaw, @amogkam
          - Big Model Inference: @SunMarc
          - quantization: @SunMarc @MekkCyber
          - kernels: @vasqu @drbh
          - peft: @BenjaminBossan @githubnemo
        
        Devices/Backends:
        
          - AMD ROCm: @Abdennacer-Badaoui
          - MPS: @isalia20
          - Intel XPU: @IlyasMoutawwakil
          - Ascend NPU: @IlyasMoutawwakil

        Documentation: @stevhliu

        Model hub:

          - for issues with a model, report at https://discuss.huggingface.co/ and tag the model's creator.

      placeholder: "@Username ..."

  - type: textarea
    id: reproduction
    validations:
      required: true
    attributes:
      label: Reproduction
      description: |
        Please provide a short, self-contained script that reproduces the problem on the latest release or `main`. It can be a Colab link or a code snippet.
        It should use a published checkpoint, a default config, or a documented workflow. Bug reports without a runnable reproducer won't be triaged.
        Please include relevant config information with your code, for example your Trainers, TRL, Peft, and DeepSpeed configs.
        If you have error messages or stack traces, please provide them here as well.
        Important! Use code tags to correctly format your code. See https://help.github.com/en/github/writing-on-github/creating-and-highlighting-code-blocks#syntax-highlighting
        Do not use screenshots, as they are hard to read and (more importantly) don't allow others to copy-and-paste your code.

      placeholder: |
        Steps to reproduce the behavior:

          1.
          2.
          3.


  - type: textarea
    id: expected-behavior
    validations:
      required: true
    attributes:
      label: Expected behavior
      description: "A clear and concise description of what you would expect to happen."
