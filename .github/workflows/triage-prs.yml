name: Triage PRs

# Closes PRs that don't link an issue their author may work on; see scripts/triage_prs.py.
# Scheduled runs only log what they would do until the rules are enforced. Run it manually with
# `dry_run` unchecked to apply the decisions.

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Log decisions without labeling, commenting on, or closing PRs
        type: boolean
        default: true

permissions: {}

concurrency:
  group: triage-prs
  cancel-in-progress: false

jobs:
  triage:
    name: Triage open PRs
    if: github.repository == 'huggingface/transformers'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      issues: read
      pull-requests: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DRY_RUN: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run }}
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false

    - name: Setup Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version-file: .python-version

    - name: Install requirements
      run: |
        pip install PyGithub
    - name: Triage open PRs
      run: |
        python scripts/triage_prs.py
