name: MIC native CPU references

on:
  workflow_dispatch:
    inputs:
      model_select:
        description: "Space-separated prototypes (empty defaults to Whisper)"
        type: string
        default: "whisper"
      torch_index:
        description: "Pinned PyTorch 2.11 wheel index for CPU execution (cpu or cu128)"
        type: choice
        options: [cpu, cu128]
        default: cpu
      framework_ref:
        description: "Exact framework source for diagnostic recording"
        type: string
        default: "1111c102092739070a59f8eb41f8008fc9709213"
      diagnostic_generation_fix:
        description: "Overlay the fixed generation config file on the older source for source comparison only"
        type: boolean
        default: false
      cpu_threads:
        description: "CPU thread profile for diagnostic recording"
        type: choice
        options: ['4', '8']
        default: '4'

permissions:
  contents: read

jobs:
  record:
    runs-on:
      group: aws-m8i-l-cache
    timeout-minutes: 120
    container:
      image: huggingface/transformers-torch-light
      options: --shm-size=16gb
    env:
      # Record the already-tested fixed PR build without merging upstream into
      # contracts-proof. References remain candidates until source-specific review.
      TRANSFORMERS_SHA: ${{ inputs.framework_ref || '1111c102092739070a59f8eb41f8008fc9709213' }}
      DIAGNOSTIC_GENERATION_FIX: ${{ inputs.diagnostic_generation_fix || 'false' }}
      TORCH_INDEX: ${{ inputs.torch_index || 'cpu' }}
      TMIC_SHA: 03500b0c365087d17ae048b3e00e11a9657a2982
      MIC_MODELS: ${{ inputs.model_select || 'whisper' }}
      DOC_BUILDER_SHA: c69e96c087165ba49b1788e0c3464654dd60253c
      HF_HOME: /tmp/hf_home
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: ${{ inputs.cpu_threads || '4' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TRANSFORMERS_SHA }}
      - name: Isolate the generation fix on the older source
        if: env.DIAGNOSTIC_GENERATION_FIX == 'true'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$TRANSFORMERS_SHA" = 11c4611c0f9826e452d5cdaae9afdd22cc5d5fe5
          git fetch --depth 1 origin 1111c102092739070a59f8eb41f8008fc9709213
          git show 1111c102092739070a59f8eb41f8008fc9709213:src/transformers/configuration_utils.py > src/transformers/configuration_utils.py
          git diff --check
          git diff --stat
      - name: Install the package and pinned CPU runtime
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git init /tmp/tmic-source
          git -C /tmp/tmic-source fetch --depth 1 https://github.com/huggingface/transformers-mic "$TMIC_SHA"
          git -C /tmp/tmic-source checkout FETCH_HEAD
          uv pip install torch==2.11.0 torchvision==0.26.0 torchaudio==2.11.0 --index-url "https://download.pytorch.org/whl/$TORCH_INDEX"
          uv pip install -e .
          uv pip install /tmp/tmic-source timm jsonschema "git+https://github.com/huggingface/doc-builder@$DOC_BUILDER_SHA"
          python - <<'PY_PINS'
          import json, subprocess
          pins = json.load(open('/tmp/tmic-source/example/transformers/tests/contracts/fleet.lock'))['environment']
          packages = [f'{name}=={version}' for name, version in pins.items() if name not in {'python', 'torch', 'torchvision', 'torchaudio'}]
          subprocess.run(['uv', 'pip', 'install', *packages], check=True)
          PY_PINS
      - name: Verify framework source from both working directories
        run: |
          test "$(git rev-parse HEAD)" = "$TRANSFORMERS_SHA"
          for directory in "$GITHUB_WORKSPACE" /tmp; do
            cd "$directory"
            python - <<'PY_SOURCE'
          import hashlib, inspect, os
          import transformers
          from transformers import PreTrainedConfig, WhisperConfig
          import transformers.configuration_utils as configuration
          assert os.path.realpath(transformers.__file__) == os.path.join(os.environ["GITHUB_WORKSPACE"], "src/transformers/__init__.py")
          print("cwd", os.getcwd(), "transformers", transformers.__file__)
          print("configuration", configuration.__file__, hashlib.sha256(open(configuration.__file__, "rb").read()).hexdigest())
          print("generation_parameters", inspect.getsource(PreTrainedConfig._get_generation_parameters))
          print("suppress_tokens_is_default", "suppress_tokens" in WhisperConfig.default_config_fields())
          PY_SOURCE
          done
      - name: Record unpatched native candidates without approval or export
        run: |
          export PYTHONPATH="$PWD/src"
          cp -R /tmp/tmic-source/experiments/published-prototypes /tmp/tmic-cpu
          cd /tmp
          python - <<'PY_RECORD'
          import json, os, pathlib, subprocess, sys
          root = pathlib.Path('/tmp/tmic-cpu')
          models = {item['name'] for item in json.loads((root / 'models.json').read_text())['models']}
          selected = os.environ['MIC_MODELS'].split()
          assert selected and set(selected) <= models, selected
          report = {'transformers_sha': os.environ['TRANSFORMERS_SHA'], 'package_sha': os.environ['TMIC_SHA'], 'torch_index': os.environ['TORCH_INDEX'], 'diagnostic_generation_fix': os.environ['DIAGNOSTIC_GENERATION_FIX'], 'cpu_threads': int(os.environ['OMP_NUM_THREADS']), 'models': {}}
          for name in selected:
              workspace = root / 'projects' / name
              lock_path = workspace / 'example/transformers/tests/contracts/fleet.lock'
              lock = json.loads(lock_path.read_text())
              lock.pop('local_patches', None)
              lock_path.write_text(json.dumps(lock, indent=2) + '\n')
              log = root / 'logs' / f'{name}-record.log'
              log.parent.mkdir(parents=True, exist_ok=True)
              with log.open('w') as handle:
                  result = subprocess.run(['tmic', '--workspace', str(workspace), 'record', '--variant', 'bfloat16'], env={**os.environ, 'CUDA_VISIBLE_DEVICES': ''}, stdout=handle, stderr=subprocess.STDOUT)
              print(log.read_text(), flush=True)
              report['models'][name] = {'record': result.returncode, 'approved': False, 'exported': False}
              (root / 'cpu-report.json').write_text(json.dumps(report, indent=2) + '\n')
          sys.exit(int(any(row['record'] for row in report['models'].values())))
          PY_RECORD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mic-cpu-record
          path: /tmp/tmic-cpu
          include-hidden-files: true
