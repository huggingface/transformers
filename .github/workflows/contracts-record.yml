name: MIC Mistral3 cause investigation
on:
  workflow_dispatch:
    inputs:
      framework_ref:
        type: string
        required: true
      before_revision:
        type: string
        required: true
      candidate_revision:
        type: string
        required: true
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        framework: ['6b75aeeab91d98bd3872b3f2382cfb4a8ce810d4']
    runs-on:
      group: aws-m8i-l-cache
    timeout-minutes: 30
    container:
      image: huggingface/transformers-torch-light
      options: --shm-size=16gb
    env:
      HF_HOME: /tmp/hf_home
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '4'
      BEFORE_REVISION: ${{ inputs.before_revision }}
      CANDIDATE_REVISION: ${{ inputs.candidate_revision }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.framework }}
          path: framework
      - name: Install the production runner and framework
        working-directory: framework
        run: |
          git config --global --add safe.directory "$PWD"
          uv pip install -e .
          uv pip install "transformers-ci[contracts] @ git+https://github.com/huggingface/transformers-ci@c87ccbe2d3c15f996857f707e4c1f1c4a79838d8" timm jsonschema "git+https://github.com/huggingface/doc-builder@c69e96c087165ba49b1788e0c3464654dd60253c"
          mkdir -p /tmp/mic-cause
          uv pip freeze > /tmp/mic-cause/pip-freeze.txt
          lscpu > /tmp/mic-cause/cpu.txt
          git rev-parse HEAD > /tmp/mic-cause/framework-sha.txt
      - name: Compare standalone, isolated and full-fleet execution
        working-directory: framework
        run: python ../.github/scripts/prove_mistral3_date.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mic-mistral3-date-proof
          path: /tmp/mic-date-proof
