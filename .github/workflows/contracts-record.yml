name: MIC canonical target validation
on:
  workflow_dispatch:
    inputs:
      framework_ref:
        type: string
        required: true
      before_revision:
        type: string
        required: true
      candidate_revision:
        type: string
        required: true
permissions:
  contents: read
jobs:
  validate:
    runs-on:
      group: aws-m8i-l-cache
    timeout-minutes: 30
    container:
      image: huggingface/transformers-torch-light
      options: --shm-size=16gb
    env:
      HF_HOME: /tmp/hf_home
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '4'
      BEFORE_REVISION: ${{ inputs.before_revision }}
      CANDIDATE_REVISION: ${{ inputs.candidate_revision }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.framework_ref }}
          path: framework
      - name: Install the production runner and framework
        working-directory: framework
        run: |
          git config --global --add safe.directory "$PWD"
          uv pip install -e .
          uv pip install "transformers-ci[contracts] @ git+https://github.com/huggingface/transformers-ci@c87ccbe2d3c15f996857f707e4c1f1c4a79838d8" timm jsonschema "git+https://github.com/huggingface/doc-builder@c69e96c087165ba49b1788e0c3464654dd60253c"
          mkdir -p /tmp/mic-target-validation
          uv pip freeze > /tmp/mic-target-validation/pip-freeze.txt
          lscpu > /tmp/mic-target-validation/cpu.txt
          git rev-parse HEAD > /tmp/mic-target-validation/framework-sha.txt
      - name: Validate both fleets before and after the target rename
        working-directory: framework
        run: python ../.github/scripts/validate_canonical_targets.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mic-canonical-target-validation
          path: /tmp/mic-target-validation
