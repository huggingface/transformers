on:
  push:

name: Secret Leaks

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compute base commit
        id: base-commit
        run: |
          if [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "base=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          else
            echo "base=$(git merge-base origin/${{ github.event.repository.default_branch }} HEAD)" >> "$GITHUB_OUTPUT"
          fi
      - name: Secret Scanning
        uses: trufflesecurity/trufflehog@d411fff7b8879a62509f3fa98c07f247ac089a51  # main
        with:
          # Always scan a DIFF, never the whole history.
          base: ${{ steps.base-commit.outputs.base }}
          head: HEAD
          # Lob's detector matches `(live|test)_<35 hex>` and "verifies" a hit by
          # POSTing to api.lob.com, where a 422 counts as a valid key — that
          # endpoint 422s on a bad body whatever the key, so every candidate came
          # back "verified" (397 of them on a full-history scan, all false).
          extra_args: --results=verified,unknown --exclude-detectors=lob --fail-on-scan-errors
