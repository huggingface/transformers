name: SGLang Integration Tests

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - sglang_ci

env:
  SGLANG_USE_CPU_ENGINE: "1"
  HF_TOKEN: ${{ secrets.HF_HUB_READ_TOKEN }}
  HF_HOME: /mnt/cache

permissions: {}

jobs:
  sglang:
    permissions:
      contents: read
    name: SGLang Transformers loader compatibility
    # aws-m8i-8xl-cache (128 GiB): needed for sufficient RAM and for the writable
    # shared cache mount (/mnt/cache). The 2xl runner has the same mount read-only.
    runs-on:
      group: aws-m8i-8xl-cache
    container:
      image: huggingface/transformers-torch-light
      options: "--shm-size=16gb -v /mnt/cache/.cache/huggingface:/mnt/cache/"
    env:
      HF_HUB_OFFLINE: "1"

    steps:
      - name: Checkout Transformers under test
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
          path: transformers

      - name: Checkout SGLang
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: sgl-project/sglang
          # Includes sgl-project/sglang#38336. Keep code and tests at the same
          # revision so unrelated SGLang changes do not break Transformers CI.
          ref: 55b4f4f19506c5571d7c4b04b1b47e85790b6db3
          persist-credentials: false
          path: sglang

      - name: Set up Python 3.12 environment
        run: |
          uv venv /opt/venv312 --python 3.12
          echo "VIRTUAL_ENV=/opt/venv312" >> $GITHUB_ENV
          echo "/opt/venv312/bin" >> $GITHUB_PATH
          echo "UV_PYTHON=" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          uv pip install 'torch<=2.13.0' torchvision --index-url https://download.pytorch.org/whl/cpu
          # Import SGLang from source: its full install pulls in CUDA packages
          # and pins Transformers/tokenizers to releases instead of this checkout.
          uv pip install -e ./transformers pytest triton \
            aiohttp dill fastapi ipython msgspec orjson psutil pybase64 pyzmq requests sentencepiece
          cp sglang/python/pyproject_cpu.toml sglang/python/pyproject.toml
          SGLANG_BUILD_RUST_EXTS=none uv pip install --no-deps --no-build-isolation -e ./sglang/python

      - name: Pip freeze
        run: pip freeze

      - name: Test SGLang Transformers loaders
        env:
          PYTHONPATH: ${{ github.workspace }}/sglang/python
        working-directory: sglang
        run: |
          python -m pytest -v test/registered/unit/utils/test_hf_transformers_loading.py

  sglang-inference:
    permissions:
      contents: read
    name: SGLang integration (${{ matrix.suite }})
    runs-on:
      group: aws-m8i-8xl-cache
    container:
      # v0.5.19-xeon supplies the Intel CPU build environment and runtime dependencies.
      image: lmsysorg/sglang@sha256:dec15decb555242b67471b984e51bd44e3faa44fc5c2b5258d46e5fa926e7cde
      options: --shm-size=16gb -v /mnt/cache/.cache/huggingface:/mnt/cache/
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}/sglang
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: model-loading
            tests: >-
              test/registered/model_loading/test_external_models.py
              test/registered/model_loading/test_weight_loader_v2_e2e.py
          - suite: transformers-backend
            tests: >-
              test/registered/e2e/models/test_transformers_backend_eval.py
              test/registered/e2e/models/test_transformers_models.py::TestTransformersFallbackEngine::test_ci_models
          - suite: processors-and-mappings
            tests: >-
              test/registered/unit/utils/test_hf_transformers.py
              test/registered/unit/utils/test_patch_tokenizer.py
              test/registered/unit/model_loader/test_transformers_fallback.py
          - suite: chat
            tests: >-
              test/registered/openai_server/basic/test_openai_server.py::TestOpenAIServer::test_chat_completion
              test/registered/openai_server/basic/test_openai_server.py::TestOpenAIServer::test_chat_completion_stream
          - suite: vision-language
            tests: test/registered/vlm/test_vlm_input_format.py::TestQwenVLUnderstandsImage
          - suite: audio
            tests: >-
              test/registered/openai_server/basic/test_serving_transcription.py::TestServingTranscription::test_basic_transcription
              test/registered/openai_server/basic/test_serving_transcription.py::TestServingTranscription::test_transcription_content_quality
    env:
      SGLANG_IS_IN_CI: "true"
      SGLANG_USE_CPU_ENGINE: "1"
      VIRTUAL_ENV: /opt/.venv
      CMAKE_BUILD_PARALLEL_LEVEL: "8"
      PYTHONPATH: ${{ github.workspace }}/sglang/python
      REPORT_DIR: ${{ github.workspace }}/reports
      TRANSFORMERS_SOURCE: ${{ github.workspace }}/transformers
      TEST_TARGETS: ${{ matrix.tests }}

    steps:
      - name: Checkout Transformers under test
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
          path: transformers

      - name: Checkout SGLang
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: sgl-project/sglang
          ref: 55b4f4f19506c5571d7c4b04b1b47e85790b6db3
          persist-credentials: false
          path: sglang

      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends ffmpeg
          uv pip install setuptools setuptools-scm wheel scikit-build-core ninja cmake
          uv pip install pytest pytest-asyncio accelerate expecttest parameterized sentence-transformers psutil
          # Keep the image's PyTorch; compile this revision's CPU kernels against it.
          cp python/pyproject_cpu.toml python/pyproject.toml
          SGLANG_BUILD_RUST_EXTS=none uv pip install --no-deps --no-build-isolation -e ./python
          cp python/sglang/kernels/aot/pyproject_cpu.toml python/sglang/kernels/aot/pyproject.toml
          uv pip install --no-deps --no-build-isolation ./python/sglang/kernels/aot
          uv pip install --no-deps torchcodec==0.12.0
          # Install the candidate last so the SGLang release pin cannot replace it.
          uv pip install -e "${TRANSFORMERS_SOURCE}"

      - name: Pip freeze
        run: uv pip freeze

      - name: System info
        run: |
          echo "=== CPU ===" && lscpu | grep -E "^CPU\(s\)|^Model name|^Socket"
          echo "=== Memory ===" && free -h
          echo "=== Disk ===" && df -h

      - name: Patch SGLang for memory debug logging
        run: |
          python3 - << 'PATCHEOF'
          import re, pathlib, sys

          def patch(path, old, new, label):
              p = pathlib.Path(path)
              src = p.read_text()
              if old not in src:
                  print(f"[PATCH] WARNING: marker not found in {label}", flush=True)
                  sys.exit(1)
              p.write_text(src.replace(old, new, 1))
              print(f"[PATCH] OK: {label}", flush=True)

          # ── 1. get_available_gpu_memory – CPU branch ─────────────────────
          patch(
              "python/sglang/srt/utils/common.py",
              old=(
                  '    elif device == "cpu":\n'
                  '        # TODO: rename the variables in the current function to be not GPU specific\n'
                  '        total_free_memory = psutil.virtual_memory().available\n'
                  '        n_numa_node: int = len(get_cpu_ids_by_node())\n'
                  '        free_gpu_memory = round(total_free_memory / n_numa_node, 3)\n'
              ),
              new=(
                  '    elif device == "cpu":\n'
                  '        # TODO: rename the variables in the current function to be not GPU specific\n'
                  '        total_free_memory = psutil.virtual_memory().available\n'
                  '        n_numa_node: int = len(get_cpu_ids_by_node())\n'
                  '        free_gpu_memory = round(total_free_memory / n_numa_node, 3)\n'
                  '        print(f"[SGLANG-DEBUG] get_available_gpu_memory(cpu): '
                  'sys_avail={total_free_memory/(1024**3):.2f}GB '
                  'n_numa={n_numa_node} per_numa={free_gpu_memory/(1024**3):.2f}GB", flush=True)\n'
              ),
              label="get_available_gpu_memory CPU branch",
          )

          # ── 2. handle_gpu_memory_settings – mem_fraction_static resolution ──
          patch(
              "python/sglang/srt/arg_groups/memory_hook.py",
              old=(
                  '        mem_fraction_static = (\n'
                  '            round((gpu_mem - reserved_mem) / gpu_mem, 3)\n'
                  '            if gpu_mem is not None\n'
                  '            else 0.95\n'
                  '        )\n'
              ),
              new=(
                  '        mem_fraction_static = (\n'
                  '            round((gpu_mem - reserved_mem) / gpu_mem, 3)\n'
                  '            if gpu_mem is not None\n'
                  '            else 0.95\n'
                  '        )\n'
                  '        print(f"[SGLANG-DEBUG] mem_fraction_static resolved: '
                  'gpu_mem={gpu_mem} reserved_mem={reserved_mem} '
                  'mem_fraction_static={mem_fraction_static}", flush=True)\n'
              ),
              label="mem_fraction_static resolution",
          )

          # ── 3. KVCacheConfigurator.configure – available_bytes + config ───
          patch(
              "python/sglang/srt/mem_cache/kv_cache_configurator.py",
              old=(
                  '        available_bytes = self._profile_available_bytes(pre_model_load_memory)\n'
                  '        config = self.config_from_budget(available_bytes)\n'
              ),
              new=(
                  '        available_bytes = self._profile_available_bytes(pre_model_load_memory)\n'
                  '        print(f"[SGLANG-DEBUG] KV cache budget: '
                  'available_bytes={available_bytes/(1024**3):.2f}GB '
                  'pre_model_load_memory={pre_model_load_memory:.2f}GB", flush=True)\n'
                  '        config = self.config_from_budget(available_bytes)\n'
                  '        print(f"[SGLANG-DEBUG] KV cache config: '
                  'max_total_num_tokens={config.max_total_num_tokens}", flush=True)\n'
              ),
              label="KVCacheConfigurator.configure available_bytes",
          )

          print("[PATCH] All patches applied.", flush=True)
          PATCHEOF

      - name: Write memory-monitor conftest
        run: |
          cat > test/conftest.py << 'CONFTEST'
          import logging
          import os
          import threading
          import psutil

          _logger = logging.getLogger("mem_monitor")
          _stop = threading.Event()


          def _monitor():
              proc = psutil.Process(os.getpid())
              while not _stop.wait(timeout=1.0):
                  vm = psutil.virtual_memory()
                  rss = proc.memory_info().rss / (1024 ** 3)
                  _logger.warning(
                      "[MEM] sys used=%.1fGB / %.1fGB (%.0f%% used, %.1fGB avail) | proc RSS=%.2fGB",
                      vm.used / (1024 ** 3),
                      vm.total / (1024 ** 3),
                      vm.percent,
                      vm.available / (1024 ** 3),
                      rss,
                  )


          def pytest_sessionstart(session):
              _stop.clear()
              t = threading.Thread(target=_monitor, daemon=True, name="mem_monitor")
              t.start()
              session._mem_monitor_thread = t


          def pytest_sessionfinish(session, exitstatus):
              _stop.set()
          CONFTEST

      - name: Run canonical SGLang integration tests
        run: |
          mkdir -p "${REPORT_DIR}"
          read -r -a targets <<< "${TEST_TARGETS}"
          python3 -m pytest -v -s --log-cli-level=WARNING "${targets[@]}" --junitxml="${REPORT_DIR}/results.xml"

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sglang-${{ matrix.suite }}-results
          path: ${{ github.workspace }}/reports/
          if-no-files-found: ignore
