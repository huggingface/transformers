name: SGLang Integration Tests

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - sglang_ci*

env:
  SGLANG_USE_CPU_ENGINE: "1"
  HF_TOKEN: ${{ secrets.HF_HUB_READ_TOKEN }}
  HF_HOME: /mnt/cache

permissions: {}

jobs:
  # Test against the latest published SGLang CPU release: the newest `lmsysorg/sglang:vX.Y.Z-xeon` image
  # (pinned by digest) and the SGLang commit it was built from (its `VER_SGLANG` build arg).
  find-sglang-image:
    permissions:
      contents: read
    name: Find latest SGLang CPU image
    runs-on: ubuntu-22.04
    outputs:
      image: ${{ steps.find.outputs.image }}
      sglang_sha: ${{ steps.find.outputs.sglang_sha }}
    steps:
      - name: Find latest SGLang xeon image and its commit
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'EOF'
          import json
          import os
          import re
          import urllib.request


          def get(url, headers=None):
              req = urllib.request.Request(url, headers=headers or {})
              with urllib.request.urlopen(req, timeout=60) as resp:
                  return json.loads(resp.read()), resp.headers


          # 1. Newest published release image: lmsysorg/sglang:vX.Y.Z[.postN]-xeon
          tag_re = re.compile(r"v(\d+)\.(\d+)\.(\d+)(?:\.post(\d+))?-xeon")
          tags = []
          url = "https://hub.docker.com/v2/repositories/lmsysorg/sglang/tags?page_size=100&name=xeon"
          while url:
              data, _ = get(url)
              tags += [t["name"] for t in data["results"] if tag_re.fullmatch(t["name"])]
              url = data.get("next")
          tag = max(tags, key=lambda t: tuple(int(x or 0) for x in tag_re.fullmatch(t).groups()))

          # 2. Its manifest digest (to pin the image) and the SGLang ref it was built from (`VER_SGLANG` build arg)
          token, _ = get("https://auth.docker.io/token?service=registry.docker.io&scope=repository:lmsysorg/sglang:pull")
          auth = {"Authorization": f"Bearer {token['token']}"}
          manifest, headers = get(
              f"https://registry-1.docker.io/v2/lmsysorg/sglang/manifests/{tag}",
              {**auth, "Accept": "application/vnd.docker.distribution.manifest.v2+json"},
          )
          digest = headers["Docker-Content-Digest"]
          config, _ = get(f"https://registry-1.docker.io/v2/lmsysorg/sglang/blobs/{manifest['config']['digest']}", auth)
          history = " ".join(h.get("created_by", "") for h in config["history"])
          sglang_ref = re.search(r"VER_SGLANG=(\S+)", history).group(1)

          # 3. The commit of that ref
          gh_headers = {"Accept": "application/vnd.github+json", "Authorization": f"Bearer {os.environ['GH_TOKEN']}"}
          commit, _ = get(f"https://api.github.com/repos/sgl-project/sglang/commits/{sglang_ref}", gh_headers)
          sha = commit["sha"]

          # Validate everything before it is used as a container image / checkout ref
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
              raise SystemExit(f"Unexpected image digest: {digest!r}")
          if sglang_ref != tag.removesuffix("-xeon"):
              raise SystemExit(f"Image {tag} was built from VER_SGLANG={sglang_ref!r}, expected {tag.removesuffix('-xeon')!r}")
          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              raise SystemExit(f"Unexpected commit SHA: {sha!r}")

          print(f"SGLang image : lmsysorg/sglang:{tag} ({digest})")
          print(f"SGLang commit: {sha} ({sglang_ref})")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"image=lmsysorg/sglang@{digest}\n")
              f.write(f"sglang_sha={sha}\n")
          EOF

  sglang-inference:
    needs: find-sglang-image
    permissions:
      contents: read
    name: SGLang integration (${{ matrix.suite }})
    runs-on:
      group: aws-m8i-8xl-cache
    container:
      # The latest SGLang xeon release image: the Intel CPU build environment and runtime dependencies.
      image: ${{ needs.find-sglang-image.outputs.image }}
      options: --shm-size=16gb -v /mnt/cache/.cache/huggingface:/mnt/cache/
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}/sglang
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: loader-compat
            tests: test/registered/unit/utils/test_hf_transformers_loading.py
          - suite: model-loading
            tests: >-
              test/registered/model_loading/test_external_models.py
              test/registered/model_loading/test_weight_loader_v2_e2e.py
          # TODO: model-loading and transformers-backend fail with
          # "Unsupported TP style 'embedding_rowwise'" because transformers
          # introduced this style (PR #49570) after the pinned SGLang commit.
          # Fix needed in SGLang: sglang/srt/models/transformers.py
          # _normalize_tp_style() should handle embedding_rowwise/colwise.
          - suite: transformers-backend
            tests: >-
              test/registered/e2e/models/test_transformers_backend_eval.py
              test/registered/e2e/models/test_transformers_models.py::TestTransformersFallbackEngine::test_ci_models
          - suite: processors-and-mappings
            tests: >-
              test/registered/unit/utils/test_hf_transformers.py
              test/registered/unit/utils/test_patch_tokenizer.py
              test/registered/unit/model_loader/test_transformers_fallback.py
          - suite: chat
            tests: >-
              test/registered/openai_server/basic/test_openai_server.py::TestOpenAIServer::test_chat_completion
              test/registered/openai_server/basic/test_openai_server.py::TestOpenAIServer::test_chat_completion_stream
          # TODO: vision-language fails with "Qwen2_5_VLVisionRotaryEmbedding supports only
          # axial rope, but requested default" (modeling_qwen2_5_vl.py:134).
          # This is a regression in transformers' Qwen2.5-VL RoPE initialisation — fix
          # needed in transformers, not in the workflow.
          - suite: vision-language
            tests: test/registered/vlm/test_vlm_input_format.py::TestQwenVLUnderstandsImage
          - suite: audio
            tests: >-
              test/registered/openai_server/basic/test_serving_transcription.py::TestServingTranscription::test_basic_transcription
              test/registered/openai_server/basic/test_serving_transcription.py::TestServingTranscription::test_transcription_content_quality
    env:
      SGLANG_IS_IN_CI: "true"
      VIRTUAL_ENV: /opt/.venv
      CMAKE_BUILD_PARALLEL_LEVEL: "8"
      PYTHONPATH: ${{ github.workspace }}/sglang/python
      REPORT_DIR: ${{ github.workspace }}/reports
      TRANSFORMERS_SOURCE: ${{ github.workspace }}/transformers
      TEST_TARGETS: ${{ matrix.tests }}

    steps:
      - name: Checkout Transformers under test
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
          path: transformers

      - name: Checkout SGLang
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: sgl-project/sglang
          ref: ${{ needs.find-sglang-image.outputs.sglang_sha }}
          persist-credentials: false
          path: sglang

      - name: Check SGLang commit matches the image
        env:
          EXPECTED_SHA: ${{ needs.find-sglang-image.outputs.sglang_sha }}
        run: |
          image_sha=$(git -c safe.directory='*' -C /sgl-workspace/sglang rev-parse HEAD)
          echo "SGLang commit: ${EXPECTED_SHA} (image: ${image_sha})"
          if [ "${image_sha}" != "${EXPECTED_SHA}" ]; then
            echo "ERROR: the image's SGLang checkout (${image_sha}) differs from ${EXPECTED_SHA}" >&2
            exit 1
          fi

      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends ffmpeg
          uv pip install setuptools setuptools-scm wheel scikit-build-core ninja cmake
          uv pip install pytest pytest-asyncio accelerate expecttest parameterized sentence-transformers psutil
          # Keep the image's PyTorch; compile this revision's CPU kernels against it.
          cp python/pyproject_cpu.toml python/pyproject.toml
          SGLANG_BUILD_RUST_EXTS=none uv pip install --no-deps --no-build-isolation -e ./python
          cp python/sglang/kernels/aot/pyproject_cpu.toml python/sglang/kernels/aot/pyproject.toml
          uv pip install --no-deps --no-build-isolation ./python/sglang/kernels/aot
          uv pip install --no-deps torchcodec==0.12.0
          # Install the candidate last so the SGLang release pin cannot replace it.
          uv pip install -e "${TRANSFORMERS_SOURCE}"

      - name: Pip freeze
        run: uv pip freeze

      - name: System info
        run: |
          echo "=== CPU ===" && lscpu | grep -E "^CPU\(s\)|^Model name|^Socket"
          echo "=== Memory ===" && free -h
          echo "=== Disk ===" && df -h

      - name: Cap SGLang server KV-cache for CPU CI
        # SGLang's CPU engine reads total NUMA RAM (~126 GB) as "GPU memory" and
        # pre-allocates ~102 GB of KV cache at server startup, OOM-killing the runner.
        # Inject --max-total-tokens 4096 into every server launch that doesn't already
        # cap it.  4096 tokens keeps the KV cache well under 1 GB.
        # Applied to both sglang.test.test_utils and sglang.test.runners because
        # SRTRunner imports popen_launch_server directly into its own namespace.
        run: |
          cat > test/conftest.py << 'CONFTEST'
          def pytest_configure(config):
              try:
                  import sglang.test.test_utils as _tu
              except ImportError:
                  return

              _orig = _tu.popen_launch_server

              def _patched(model, base_url, timeout, *args, other_args=None, **kwargs):
                  other_args = list(other_args or [])
                  if "--max-total-tokens" not in other_args:
                      other_args += ["--max-total-tokens", "4096"]
                  return _orig(model, base_url, timeout, *args, other_args=other_args, **kwargs)

              _tu.popen_launch_server = _patched

              try:
                  import sglang.test.runners as _runners
                  if hasattr(_runners, "popen_launch_server"):
                      _runners.popen_launch_server = _patched
              except ImportError:
                  pass
          CONFTEST

      - name: Run canonical SGLang integration tests
        run: |
          mkdir -p "${REPORT_DIR}"
          read -r -a targets <<< "${TEST_TARGETS}"
          python3 -m pytest -v "${targets[@]}" --junitxml="${REPORT_DIR}/results.xml"

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sglang-${{ matrix.suite }}-results
          path: ${{ github.workspace }}/reports/
          if-no-files-found: ignore
