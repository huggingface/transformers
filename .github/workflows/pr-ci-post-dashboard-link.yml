name: Post CI Dashboard Link

on:
  workflow_run:
    workflows: ["PR CI"]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  post-link:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - name: Download PR CI recap script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCRIPT_REF: ${{ github.workflow_sha }}
        run: |
          gh api \
            -H "Accept: application/vnd.github.raw" \
            "/repos/${GITHUB_REPOSITORY}/contents/utils/update_pr_ci_dashboard_recap.py?ref=${SCRIPT_REF}" \
            > update_pr_ci_dashboard_recap.py
          gh api \
            -H "Accept: application/vnd.github.raw" \
            "/repos/${GITHUB_REPOSITORY}/contents/utils/github_utils.py?ref=${SCRIPT_REF}" \
            > github_utils.py

      - name: Update PR CI recap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 update_pr_ci_dashboard_recap.py

  post-mlinter-review:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - name: Download mlinter findings artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${{ github.event.workflow_run.id }}/artifacts" \
            --jq '.artifacts[] | select(.name == "mlinter-findings") | .id' \
            > artifact_id.txt
          ARTIFACT_ID=$(cat artifact_id.txt)
          if [ -z "$ARTIFACT_ID" ]; then
            echo "No mlinter-findings artifact found, skipping."
            exit 0
          fi
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > mlinter-findings.zip
          unzip -o mlinter-findings.zip

      - name: Show mlinter findings
        run: |
          echo "=== mlinter-pr-number.txt ==="
          cat mlinter-pr-number.txt || echo "(not found)"
          echo "=== mlinter-findings.json ==="
          cat mlinter-findings.json || echo "(not found)"
