name: Build docker images (scheduled)

on:
  push:
    branches:
      - build_ci_docker_image_amd_fa_pin
  repository_dispatch:
  workflow_dispatch:
  workflow_call:
    inputs:
      image_postfix:
        required: true
        type: string
  schedule:
    - cron: "17 0 * * *"

concurrency:
  group: docker-images-builds
  cancel-in-progress: false


permissions: {}

jobs:
  latest-pytorch-amd:
    permissions:
      contents: read
    name: "Latest PyTorch (AMD) [dev]"
    runs-on:
      group: aws-highcpu-32-priv
    steps:
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      -
        name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      -
        name: Login to DockerHub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      -
        name: Build, scan and push (test tag only)
        uses: huggingface/wiz-image-action/build-push@53a5b4af184193adf1773753f29b3f903445e31b # v1.3.0
        with:
          image: huggingface/transformers-pytorch-amd-gpu:rocm101-fa-pin
          context: ./docker/transformers-pytorch-amd-gpu
          build-args: |
            REF=${{ github.sha }}
          clientId: ${{ vars.WIZ_CLI_CLIENT_ID }}
          clientSecret: ${{ secrets.WIZ_CLI_CLIENT_SECRET }}
          enforcement: audit
