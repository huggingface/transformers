name: Docs check

# Adds a `docs-check` status to each PR. It's green if the PR doesn't need docs,
# red if it does, and pending until a maintainer approves the PR. The rules for
# what needs docs are in `.ai/docs-check-rules.md`. The code is in
# transformers-ci. This file only calls it.
#
# There are two jobs:
# - `approval` runs after a maintainer approves a PR. It asks Serge whether the
#   PR needs docs, comments if it does, and sets the status. Runs for the same
#   PR wait for each other, so Serge isn't asked about one PR twice at once.
# - `push` runs when a PR is opened or updated. It reuses the last answer
#   instead of asking again, so editing `docs/source/en` turns the status green.
#
# The status doesn't block merging. None of the jobs runs code from the PR.

on:
  workflow_run:
    workflows: ["Docs check trigger"]
    types: [completed]
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions: {}

jobs:
  approval:
    if: |
      github.repository == 'huggingface/transformers' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request_review' &&
      github.event.workflow_run.conclusion == 'success'
    concurrency:
      group: docs-check-approval-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      pull-requests: write
      statuses: write
    uses: huggingface/transformers-ci/.github/workflows/docs-check.yml@main # main
    with:
      mode: approval
      llm_model: ${{ vars.DOCS_CHECK_LLM_MODEL }}
      llm_bill_to: huggingface
    secrets:
      llm_api_key: ${{ secrets.DOCS_CHECK_LLM_API_KEY }}

  push:
    if: |
      github.repository == 'huggingface/transformers' &&
      github.event_name == 'pull_request_target'
    concurrency:
      group: docs-check-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      actions: read
      contents: read
      pull-requests: write
      statuses: write
    uses: huggingface/transformers-ci/.github/workflows/docs-check.yml@main # main
    with:
      mode: push
      pr_number: ${{ github.event.pull_request.number }}
