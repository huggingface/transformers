name: Docs check

# Adds a `docs-check` status to each PR. It's green if the PR doesn't need docs,
# red if it does, and pending until a maintainer approves the PR. The rules for
# what needs docs are in `.ai/docs-check-rules.md`. The code is in
# transformers-ci. This file only calls it.
#
# There are three jobs:
# - `approval` runs after a maintainer approves a PR. It asks Serge whether the
#   PR needs docs, comments if it does, and sets the status. Runs for the same
#   PR wait for each other, so Serge isn't asked about one PR twice at once.
# - `push` runs when a PR is opened or updated. It reuses the last answer
#   instead of asking again, so editing `docs/source/en` turns the status green.
# - `sweep` runs once a day. It checks approved PRs the `approval` job missed,
#   like fork PRs and failed runs. It looks at PRs updated in the last 26 hours,
#   a little over a day because scheduled runs often start late. You can also
#   run it by hand with a longer window to catch up on older PRs. It only runs
#   once the model is set, and it needs `docs-check-sweep.yml` on the main
#   branch of transformers-ci.
#
# The status doesn't block merging. None of the jobs runs code from the PR.

on:
  workflow_run:
    workflows: ["Docs check trigger"]
    types: [completed]
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      since_hours:
        description: "Sweep PRs updated in this many hours. Raise it for a one-off backfill."
        type: string
        default: "26"

permissions: {}

jobs:
  approval:
    if: |
      github.repository == 'huggingface/transformers' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request_review' &&
      github.event.workflow_run.conclusion == 'success'
    concurrency:
      group: docs-check-approval-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      pull-requests: write
      statuses: write
    uses: huggingface/transformers-ci/.github/workflows/docs-check.yml@main # main
    with:
      mode: approval
      llm_model: ${{ vars.DOCS_CHECK_LLM_MODEL }}
      llm_bill_to: huggingface
    secrets:
      llm_api_key: ${{ secrets.DOCS_CHECK_LLM_API_KEY }}

  push:
    if: |
      github.repository == 'huggingface/transformers' &&
      github.event_name == 'pull_request_target'
    concurrency:
      group: docs-check-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      actions: read
      contents: read
      pull-requests: write
      statuses: write
    uses: huggingface/transformers-ci/.github/workflows/docs-check.yml@main # main
    with:
      mode: push
      pr_number: ${{ github.event.pull_request.number }}

  sweep:
    if: |
      github.repository == 'huggingface/transformers' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      vars.DOCS_CHECK_LLM_MODEL != ''
    concurrency:
      group: docs-check-sweep
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      pull-requests: write
      statuses: write
    uses: huggingface/transformers-ci/.github/workflows/docs-check-sweep.yml@main # main
    with:
      since_hours: ${{ inputs.since_hours || '26' }}
      llm_model: ${{ vars.DOCS_CHECK_LLM_MODEL }}
      llm_bill_to: huggingface
    secrets:
      llm_api_key: ${{ secrets.DOCS_CHECK_LLM_API_KEY }}
