name: PR comment GitHub CI (AMD)

on:
  issue_comment:
    types:
      - created
    branches-ignore:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}-${{ startsWith(github.event.comment.body, 'run-slow') || startsWith(github.event.comment.body, 'run slow') || startsWith(github.event.comment.body, 'run_slow') }}
  cancel-in-progress: true
permissions:
  contents: read

env:
  HF_HOME: /mnt/cache
  TRANSFORMERS_IS_CI: yes
  OMP_NUM_THREADS: 8
  MKL_NUM_THREADS: 8
  RUN_SLOW: yes
  # For gated repositories, we still need to agree to share information on the Hub repo. page in order to get access.
  # This token is created under the bot `hf-transformers-bot`.
  HF_TOKEN: ${{ secrets.HF_HUB_READ_TOKEN }}


jobs:
  get-pr-number:
    name: Get PR number
    if: ${{ github.event.issue.state == 'open' && contains(fromJSON('["MEMBER", "OWNER", "COLLABORATOR"]'), github.event.comment.author_association) && (startsWith(github.event.comment.body, 'run-slow') || startsWith(github.event.comment.body, 'run slow') || startsWith(github.event.comment.body, 'run_slow')) }}
    uses: ./.github/workflows/get-pr-number.yml

  get-pr-info:
    name: Get PR commit SHA
    needs: get-pr-number
    if: ${{ needs.get-pr-number.outputs.PR_NUMBER != ''}}
    uses: ./.github/workflows/get-pr-info.yml
    with:
      pr_number: ${{ needs.get-pr-number.outputs.PR_NUMBER }}

  check-timestamps:
    permissions: {}
    name: Check timestamps (security check)
    runs-on: ubuntu-22.04
    needs: get-pr-info
    outputs:
      PR_HEAD_SHA: ${{ needs.get-pr-info.outputs.PR_HEAD_SHA }}
      PR_MERGE_SHA: ${{ needs.get-pr-info.outputs.PR_MERGE_COMMIT_SHA }}
    steps:
      - name: Verify `merge_commit` timestamp is older than the issue comment timestamp
        env:
          COMMENT_DATE: ${{ github.event.comment.created_at }}
          PR_MERGE_COMMIT_TIMESTAMP: ${{ needs.get-pr-info.outputs.PR_MERGE_COMMIT_TIMESTAMP }}
        run: |
            COMMENT_TIMESTAMP=$(date -d "${COMMENT_DATE}" +"%s")
            echo "COMMENT_DATE: $COMMENT_DATE"
            echo "COMMENT_TIMESTAMP: $COMMENT_TIMESTAMP"
            if [ $COMMENT_TIMESTAMP -le $PR_MERGE_COMMIT_TIMESTAMP ]; then
              echo "Last commit on the pull request is newer than the issue comment triggering this run! Abort!";
              exit -1;
            fi

  # use a python script to handle this complex logic.
  get-tests:
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    needs: [get-pr-number, check-timestamps]
    outputs:
      models: ${{ steps.models_to_run.outputs.models }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: "0"
          ref: "refs/pull/${{ needs.get-pr-number.outputs.PR_NUMBER }}/merge"
          persist-credentials: false

      - name: Verify merge commit SHA
        env:
          VERIFIED_PR_MERGE_SHA: ${{ needs.check-timestamps.outputs.PR_MERGE_SHA }}
        run: |
            PR_MERGE_SHA=$(git log -1 --format=%H)
            if [ $PR_MERGE_SHA != $VERIFIED_PR_MERGE_SHA ]; then
              echo "The merged commit SHA is not the same as the verified one! Security issue detected, abort the workflow!";
              exit -1;
            fi

      - name: Get models to test
        env:
          PR_COMMENT: ${{ github.event.comment.body }}
        run: |
          python -m pip install GitPython
          python utils/pr_slow_ci_models.py --message "$PR_COMMENT" | tee output.txt
          echo "models=$(tail -n 1 output.txt)" >> $GITHUB_ENV

      - name: Show models to test
        id: models_to_run
        run: |
          echo "$models"
          echo "models=$models" >> $GITHUB_OUTPUT

  # Report back if we are not able to get the tests (for example, security check is failing)
  report_error_earlier:
    name: Report error earlier
    if: ${{ always() && needs.get-pr-info.result == 'success' && needs.get-tests.result != 'success' }}
    needs: [get-pr-number, get-pr-info, get-tests]
    permissions:
      pull-requests: write
    runs-on: ubuntu-22.04
    steps:
      - name: Reply to the comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PREFIX: '[Workflow Run ⚙️](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\n\n'
          github_repository: ${{ github.repository }}
          pr_number: ${{ needs.get-pr-number.outputs.PR_NUMBER }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${github_repository}/issues/${pr_number}/comments" \
            -f body="$(echo -e "$PREFIX")💔 This comment contains \`run-slow\`, but unknown error occurred and [the workflow run]($GITHUB_RUN_URL) aborted! (AMD CI)"

  reply_to_comment:
    name: Reply to the comment
    if: ${{ needs.get-tests.outputs.models != '[]' }}
    needs: [get-pr-number, get-tests]
    permissions:
      pull-requests: write
    runs-on: ubuntu-22.04
    steps:
      - name: Post or update combined CI comment (AMD trigger)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AMD_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          github_repository: ${{ github.repository }}
          pr_number: ${{ needs.get-pr-number.outputs.PR_NUMBER }}
          models: ${{ needs.get-tests.outputs.models }}
        run: |
          sleep 30
          python3 << 'PYTHON_SCRIPT'
          import json, os, re, urllib.request, urllib.error

          token = os.environ['GH_TOKEN']
          repo = os.environ['github_repository']
          pr_number = os.environ['pr_number']
          run_url = os.environ['AMD_RUN_URL']
          models = os.environ['models']
          COMMENT_HEADER = '## CI (Nvidia + AMD)'
          AMD_START = '<!-- amd-section-start -->'
          AMD_END = '<!-- amd-section-end -->'
          NV_PLACEHOLDER = '<!-- nvidia-section-start -->\n**Nvidia** · ⏳ Starting...\n<!-- nvidia-section-end -->'
          base_url = f'https://api.github.com/repos/{repo}'
          headers = {
              'Authorization': f'token {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
          }

          def api(method, url, data=None):
              body_bytes = json.dumps(data).encode() if data else None
              req = urllib.request.Request(url, data=body_bytes, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req) as r:
                      return json.loads(r.read()) if r.status != 204 else {}
              except urllib.error.HTTPError as e:
                  print(f'HTTP {e.code}: {e.read().decode()}')
                  raise

          comments = []
          page = 1
          while True:
              page_comments = api('GET', f'{base_url}/issues/{pr_number}/comments?per_page=100&page={page}')
              comments.extend(page_comments)
              if len(page_comments) < 100:
                  break
              page += 1

          ci_comment = None
          for c in comments:
              if c['body'].startswith(COMMENT_HEADER):
                  ci_comment = c

          amd_section = (
              f'**AMD** · ⏳ Running... (models: {models})'
              f' · ⚙️ [Workflow]({run_url})'
          )

          if ci_comment:
              body = ci_comment['body']
              pattern = re.escape(AMD_START) + r'.*?' + re.escape(AMD_END)
              replacement = f'{AMD_START}\n{amd_section}\n{AMD_END}'
              new_body, n = re.subn(pattern, replacement, body, flags=re.DOTALL)
              if n == 0:
                  new_body = f'{body}\n\n{replacement}'
              api('PATCH', f'{base_url}/issues/comments/{ci_comment["id"]}', {'body': new_body})
          else:
              new_body = (
                  f'{COMMENT_HEADER}\n\n'
                  f'{NV_PLACEHOLDER}\n\n'
                  f'{AMD_START}\n{amd_section}\n{AMD_END}'
              )
              api('POST', f'{base_url}/issues/{pr_number}/comments', {'body': new_body})
          PYTHON_SCRIPT

  create_run:
    name: Create run
    needs: [check-timestamps, reply_to_comment]
    permissions:
      statuses: write
    runs-on: ubuntu-22.04
    steps:
      - name: Create Run
        id: create_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Create a commit status (pending) for a run of this workflow. The status has to be updated later in `update_run_status`.
          # See https://docs.github.com/en/rest/commits/statuses?apiVersion=2022-11-28#create-a-commit-status
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          github_repository: ${{ github.repository }}
          pr_head_sha: ${{ needs.check-timestamps.outputs.PR_HEAD_SHA }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${github_repository}/statuses/${pr_head_sha}" \
            -f "target_url=$GITHUB_RUN_URL" -f "state=pending" -f "description=Slow CI job (AMD)" -f "context=pytest/custom-tests-amd"

  # Workaround for a known issue in the official actions/download-artifact action:
  # when only one artifact exists in a workflow run, it extracts files directly to
  # the workspace root instead of into a named subdirectory (artifacts.length === 1
  # branch in the source). This breaks notification_service.py's
  # retrieve_available_artifacts(), which scans for *_test_reports directories.
  # Note: this is NOT a bug introduced by our ydshieh/download-artifact fork —
  # the same behavior exists in the upstream actions/download-artifact action.
  # The Nvidia PR comment CI avoids this because daily-ci_reusable.yml always runs
  # run_extract_warnings (which uploads warnings_in_ci), ensuring 2+ artifacts exist.
  # AMD has no equivalent yet, so we upload a dummy artifact here as a temporary
  # workaround until a proper solution is implemented on the reusable workflow side.
  upload_dummy_artifact:
    permissions: {}
    name: Upload dummy artifact
    if: ${{ needs.get-tests.outputs.models != '[]' }}
    needs: [create_run, get-tests]
    runs-on: ubuntu-22.04
    steps:
      - run: mkdir dummy_artifact && echo "placeholder" > dummy_artifact/placeholder.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dummy_artifact
          path: dummy_artifact

  model-ci:
    name: Model CI
    if: ${{ needs.get-tests.outputs.models != '[]' }}
    uses: huggingface/hf-workflows/.github/workflows/transformers_amd_ci_scheduled_arc_scale_set.yaml@main
    needs: [upload_dummy_artifact, get-pr-number, check-timestamps, get-tests, create_run]
    with:
      job: run_models_gpu
      slack_report_channel: "#amd-transformers-pr-ci"
      docker: huggingface/transformers-pytorch-amd-gpu
      ci_event: PR Comment CI (AMD)
      report_repo_id: optimum-amd/transformers_pr_ci
      runner_group: hfc-amd-mi300
      env_file: /etc/podinfo/gha-gpu-isolation-settings
      commit_sha: ${{ needs.check-timestamps.outputs.PR_MERGE_SHA }}
      subdirs: ${{ needs.get-tests.outputs.models }}
      pr_number: ${{ needs.get-pr-number.outputs.PR_NUMBER }}
      pytest_marker: slow
    secrets: inherit

  report:
    name: Check & Report
    needs: [get-pr-number, get-pr-info, check-timestamps, create_run, model-ci]
    permissions:
      pull-requests: write
      statuses: write
    if: ${{ always() && needs.create_run.result == 'success' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Download model CI new failures artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: new_failures_with_bad_commit_run_models_gpu
          path: ./new_failures/new_failures_with_bad_commit_run_models_gpu
        continue-on-error: true

      - name: List downloaded artifacts
        run: |
          echo "Downloaded artifact files:"
          if [ -d "./new_failures/" ]; then
            find ./new_failures/ -type f
          else
            echo "No artifacts downloaded (directory doesn't exist)"
          fi

      - name: Show reports from jobs
        run: |
          echo "=== Model CI Report ==="
          if [ -f "./new_failures/new_failures_with_bad_commit_run_models_gpu/new_failures_with_bad_commit.json" ]; then
            cat ./new_failures/new_failures_with_bad_commit_run_models_gpu/new_failures_with_bad_commit.json
          else
            echo "No model CI report found"
          fi

      - name: Process and filter reports
        run: |
          # Preprocess with Python
          python3 << 'PYTHON_SCRIPT'
          import json
          import os
          from pathlib import Path

          def count_failures(data):
            """
            Count total number of failures (excluding None commits)
            """
            total = 0
            for model, model_result in data.items():
                for device, failures in model_result.items():
                    # Count failures where commit is not None
                    total += sum(
                        1 for failure in failures
                        if isinstance(failure, dict) and failure.get('bad_commit') is not None
                    )
            return total

          def filter_and_format_report(data):
            """
            Filter out entries where commit is `None` (failing tests who status is not certain) and format as text
            """
            lines = []

            for model, model_result in data.items():
                model_lines = []
                for device, failures in model_result.items():

                    filtered_failures = [
                        failure for failure in failures
                        if isinstance(failure, dict) and failure.get('bad_commit') is not None
                    ]

                    # Add tests to model lines
                    for idx, failure in enumerate(filtered_failures):
                        if idx == 0:
                            job_link = failure['job_link']
                            model_lines.append(f"- [{model}]({job_link}):")

                        test_name = failure['test']
                        status = failure.get('status', '')
                        if "DIFFERENT error message" in status:
                            indicator = "(❌ ⟹ ❌)"
                        else:
                            indicator = "(✅ ⟹ ❌)"

                        model_lines.append(f"    {test_name} {indicator}")

                if len(model_lines) > 0:
                    lines.extend(model_lines)
                    lines.append("")  # Empty line between models

            return "\n".join(lines).strip()

          # Read report from downloaded artifact file
          model_report_path = Path('./new_failures/new_failures_with_bad_commit_run_models_gpu/new_failures_with_bad_commit.json')
          model_url_path = Path('./new_failures/new_failures_with_bad_commit_run_models_gpu/new_failures_with_bad_commit_url.txt')

          model_url = None
          if model_url_path.exists():
              with open(model_url_path, 'r') as f:
                  model_url = f.read().strip()

          model_report = {}
          if model_report_path.exists():
              with open(model_report_path, 'r') as f:
                  model_report = json.load(f)

          # Count failures and format
          model_count = count_failures(model_report)
          formatted_model = filter_and_format_report(model_report)

          # Write to files
          if formatted_model:
              header = f"❌ [{model_count} new failing tests]({model_url}) 😭" if model_url else f"❌ {model_count} new failing tests 😭"
              with open('model_ci_header.txt', 'w') as f:
                  f.write(header)
              with open('model_ci_details.txt', 'w') as f:
                  f.write("<details>\n<summary>Failure details</summary>\n\n")
                  f.write(formatted_model)
                  f.write('\n\n</details>\n')
          PYTHON_SCRIPT

      - name: Post results as PR comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          github_repository: ${{ github.repository }}
          pr_number: ${{ needs.get-pr-number.outputs.PR_NUMBER }}
          model_ci_result: ${{ needs.model-ci.result }}
          model_infrastructure_ok: ${{ needs.model-ci.outputs.is_infrastructure_ok }}
        run: |
          DASHBOARD_URL="https://transformers-ci.huggingface.cool/d/pytest-observability-by-pr/branch?var-pr=${pr_number}"

          # Check infrastructure health
          infrastructure_error=false
          if [[ "$model_ci_result" != "skipped" && "$model_ci_result" != "cancelled" ]]; then
            [[ "$model_infrastructure_ok" == "false" ]] && infrastructure_error=true
          fi

          amd_failure_status=""
          if [ -s model_ci_header.txt ]; then
            amd_failure_status="$(cat model_ci_header.txt)"
          fi

          {
            if [[ "$infrastructure_error" == "true" ]]; then
              echo "STATUS=error" >> $GITHUB_ENV
              echo "**AMD** · ⚠️ CI failed to report results · ⚙️ [Workflow]($GITHUB_RUN_URL) · 📊 [Dashboard]($DASHBOARD_URL)"
            elif [[ "$model_ci_result" == "skipped" || "$model_ci_result" == "cancelled" ]]; then
              echo "STATUS=error" >> $GITHUB_ENV
              echo "**AMD** · ⚠️ No tests reported (job skipped or cancelled) · ⚙️ [Workflow]($GITHUB_RUN_URL) · 📊 [Dashboard]($DASHBOARD_URL)"
            elif [ -n "$amd_failure_status" ]; then
              echo "STATUS=failure" >> $GITHUB_ENV
              echo "**AMD** · ${amd_failure_status} · ⚙️ [Workflow]($GITHUB_RUN_URL) · 📊 [Dashboard]($DASHBOARD_URL)"
              if [ -s model_ci_details.txt ]; then
                echo ''
                cat model_ci_details.txt
              fi
            else
              echo "STATUS=success" >> $GITHUB_ENV
              echo "**AMD** · ✅ No new failures 🎉👏 · ⚙️ [Workflow]($GITHUB_RUN_URL) · 📊 [Dashboard]($DASHBOARD_URL)"
            fi
          } > comment_body.txt

          python3 << 'PYTHON_SCRIPT'
          import json, os, re, urllib.request, urllib.error

          token = os.environ['GH_TOKEN']
          repo = os.environ['github_repository']
          pr_number = os.environ['pr_number']
          run_url = os.environ['GITHUB_RUN_URL']

          COMMENT_HEADER = '## CI (Nvidia + AMD)'
          AMD_START = '<!-- amd-section-start -->'
          AMD_END = '<!-- amd-section-end -->'
          NV_START = '<!-- nvidia-section-start -->'
          NV_END = '<!-- nvidia-section-end -->'
          NV_PLACEHOLDER = '<!-- nvidia-section-start -->\n**Nvidia** · ⏳ Starting...\n<!-- nvidia-section-end -->'
          base_url = f'https://api.github.com/repos/{repo}'
          headers = {
              'Authorization': f'token {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
          }

          def api(method, url, data=None):
              body_bytes = json.dumps(data).encode() if data else None
              req = urllib.request.Request(url, data=body_bytes, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req) as r:
                      return json.loads(r.read()) if r.status != 204 else {}
              except urllib.error.HTTPError as e:
                  print(f'HTTP {e.code}: {e.read().decode()}')
                  raise

          with open('comment_body.txt') as f:
              amd_section = f.read().strip()

          comments = []
          page = 1
          while True:
              page_comments = api('GET', f'{base_url}/issues/{pr_number}/comments?per_page=100&page={page}')
              comments.extend(page_comments)
              if len(page_comments) < 100:
                  break
              page += 1

          ci_comment = None
          for c in comments:
              if c['body'].startswith(COMMENT_HEADER):
                  ci_comment = c

          if ci_comment:
              body = ci_comment['body']
              pattern = re.escape(AMD_START) + r'.*?' + re.escape(AMD_END)
              replacement = f'{AMD_START}\n{amd_section}\n{AMD_END}'
              new_body, n = re.subn(pattern, replacement, body, flags=re.DOTALL)
              if n == 0:
                  new_body = f'{body}\n\n{replacement}'
              nv_match = re.search(re.escape(NV_START) + r'(.*?)' + re.escape(NV_END), new_body, re.DOTALL)
              nv_still_running = nv_match and '\u23f3' in nv_match.group(1)
              if nv_still_running:
                  api('PATCH', f'{base_url}/issues/comments/{ci_comment["id"]}', {'body': new_body})
              else:
                  api('DELETE', f'{base_url}/issues/comments/{ci_comment["id"]}')
                  api('POST', f'{base_url}/issues/{pr_number}/comments', {'body': new_body})
          else:
              new_body = (
                  f'{COMMENT_HEADER}\n\n'
                  f'{NV_PLACEHOLDER}\n\n'
                  f'{AMD_START}\n{amd_section}\n{AMD_END}'
              )
              api('POST', f'{base_url}/issues/{pr_number}/comments', {'body': new_body})
          PYTHON_SCRIPT

      - name: Update PR commit statuses
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          github_repository: ${{ github.repository }}
          pr_head_sha: ${{ needs.check-timestamps.outputs.PR_HEAD_SHA }}
        # The env. variable `STATUS` used here is set in the previous step
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${github_repository}/statuses/${pr_head_sha}" \
            -f "target_url=$GITHUB_RUN_URL" -f "state=$STATUS" -f "description=Slow CI job (AMD)" -f "context=pytest/custom-tests-amd"
