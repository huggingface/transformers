# AMD Ryzen "Strix Halo" (gfx1151) CI on the DevLab Dispatch ephemeral pool.
#
# This file keeps its name on purpose: the pool's runner group allows this
# workflow path, so we iterate here rather than adding new workflow files.
#
# The gfx1151 image is built + pushed separately by build-amd-gfx1151-image.yml;
# the jobs here just PULL it via a job-level `container:`.
#
#  * default push  -> quick smoke test (`test` job)
#  * push w/ [models] in the commit msg -> full ALL-MODELS run, ONE JOB PER MODEL
#
# One-job-per-model, like the MI300/MI355 CIs: GitHub caps a matrix at 256 jobs,
# and there are >256 models, so `models-setup` splits tests/models/* into 3
# slices (~172 each, <=256) and there is one models-ci job group per slice, each
# a matrix over its slice's folders. Total = one job per model in a single run.
#
# Timeouts: each job wraps pytest in coreutils `timeout` so a hang ends as a
# FAILED job with the partial -v log visible (SIGINT -> pytest prints its
# summary; SIGKILL 2 min later if a stuck GPU call ignores it). We deliberately
# do NOT rely on GitHub's job timeout, which marks the job `cancelled` and hides
# the logs; `timeout-minutes` here is only a loose outer safety net.
name: AMD Strix Halo probe

on:
  workflow_dispatch:
  push:
    branches:
      - run_amd_strix_halo*

permissions:
  contents: read
  packages: read   # pull the image from GHCR with the built-in GITHUB_TOKEN

jobs:
  models-setup:
    name: Split models into slices
    if: ${{ contains(github.event.head_commit.message, '[models]') }}
    runs-on: ubuntu-latest
    outputs:
      slice0: ${{ steps.split.outputs.slice0 }}
      slice1: ${{ steps.split.outputs.slice1 }}
      slice2: ${{ steps.split.outputs.slice2 }}
    steps:
      - uses: actions/checkout@v4
      - id: split
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, json, math
          base = "tests/models"
          dirs = sorted(d for d in os.listdir(base)
                        if os.path.isdir(os.path.join(base, d)) and not d.startswith("__"))
          N = 3                                          # 3 slices keeps each <=256 (514 -> ~172)
          per = math.ceil(len(dirs) / N)
          for i in range(N):
              print(f"slice{i}=" + json.dumps(dirs[i * per:(i + 1) * per]))
          PY

  # One job per model. Three near-identical job groups, one per slice, so each
  # matrix stays under GitHub's 256-job cap. Anchors aren't supported in Actions
  # YAML, hence the repetition. To change the test command, edit all three.
  models-ci-0:
    name: "${{ matrix.model }}"
    needs: models-setup
    runs-on: [self-hosted, Linux, devlab-dispatch, strix-halo]
    timeout-minutes: 150   # loose outer net; the `timeout` in the step is the real limit
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJson(needs.models-setup.outputs.slice0) }}
    container:
      image: ghcr.io/huggingface/transformers-pytorch-amd-gpu-gfx1151:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device=/dev/kfd --device=/dev/dri --group-add 992
    env:
      HF_HOME: /tmp/hf_home
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      RUN_SLOW: "1"
    steps:
      - name: Test ${{ matrix.model }}
        run: |
          cd /transformers
          # `timeout` kills pytest itself on a hang so the job FAILS with the
          # partial log (SIGINT -> summary; SIGKILL 2 min later if it's stuck in a
          # GPU call). xdist --max-worker-restart survives a segfault; pytest's
          # --timeout is the per-test cap. (xdist + pytest-timeout are in the image.)
          timeout -s INT --kill-after=120 120m \
            python3 -m pytest -v -rsfE -n 1 --max-worker-restart=1000 --dist=loadscope \
              --timeout=1200 --timeout-method=signal tests/models/${{ matrix.model }}

  models-ci-1:
    name: "${{ matrix.model }}"
    needs: models-setup
    runs-on: [self-hosted, Linux, devlab-dispatch, strix-halo]
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJson(needs.models-setup.outputs.slice1) }}
    container:
      image: ghcr.io/huggingface/transformers-pytorch-amd-gpu-gfx1151:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device=/dev/kfd --device=/dev/dri --group-add 992
    env:
      HF_HOME: /tmp/hf_home
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      RUN_SLOW: "1"
    steps:
      - name: Test ${{ matrix.model }}
        run: |
          cd /transformers
          timeout -s INT --kill-after=120 120m \
            python3 -m pytest -v -rsfE -n 1 --max-worker-restart=1000 --dist=loadscope \
              --timeout=1200 --timeout-method=signal tests/models/${{ matrix.model }}

  models-ci-2:
    name: "${{ matrix.model }}"
    needs: models-setup
    runs-on: [self-hosted, Linux, devlab-dispatch, strix-halo]
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJson(needs.models-setup.outputs.slice2) }}
    container:
      image: ghcr.io/huggingface/transformers-pytorch-amd-gpu-gfx1151:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device=/dev/kfd --device=/dev/dri --group-add 992
    env:
      HF_HOME: /tmp/hf_home
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      RUN_SLOW: "1"
    steps:
      - name: Test ${{ matrix.model }}
        run: |
          cd /transformers
          timeout -s INT --kill-after=120 120m \
            python3 -m pytest -v -rsfE -n 1 --max-worker-restart=1000 --dist=loadscope \
              --timeout=1200 --timeout-method=signal tests/models/${{ matrix.model }}

  test:
    name: Smoke + tests (prebuilt gfx1151 image)
    # Skip the quick smoke job on a [models] run.
    if: ${{ !contains(github.event.head_commit.message, '[models]') }}
    runs-on: [self-hosted, Linux, devlab-dispatch, strix-halo]
    timeout-minutes: 120
    container:
      image: ghcr.io/huggingface/transformers-pytorch-amd-gpu-gfx1151:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device=/dev/kfd --device=/dev/dri --group-add 992
    steps:
      - name: Smoke-test torch + Flash-Attention on the GPU
        run: |
          python3 -u - <<'PY'
          print("[1] python up", flush=True)
          import torch
          print("[2] torch imported:", torch.__version__, "hip:", torch.version.hip, flush=True)
          print("[3] cuda available:", torch.cuda.is_available(), flush=True)
          assert torch.cuda.is_available(), "no ROCm GPU visible inside the container"
          print("[4] device:", torch.cuda.get_device_name(0), flush=True)

          t = torch.ones(8, device="cuda"); torch.cuda.synchronize()
          print("[5] tiny cuda tensor ok, sum:", float(t.sum()), flush=True)

          x = (torch.rand(2048, 2048, device="cuda", dtype=torch.float16) - 0.5) * 0.1
          torch.cuda.synchronize()
          print("[6] matmul sum:", float((x @ x).sum()), flush=True)

          import flash_attn
          from flash_attn import flash_attn_func
          print("[7] flash_attn:", flash_attn.__version__, flush=True)
          q = torch.randn(1, 256, 8, 64, device="cuda", dtype=torch.float16)
          out = flash_attn_func(q, q, q)
          torch.cuda.synchronize()
          print("[8] FA out:", tuple(out.shape), flush=True)
          print("ALL GOOD", flush=True)
          PY

      - name: Run a tiny transformers test slice (optional signal)
        continue-on-error: true
        run: |
          cd /transformers && python3 -m pytest -q tests/utils/test_modeling_utils.py -x
