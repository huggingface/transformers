# AMD Ryzen "Strix Halo" (gfx1151) CI on the DevLab Dispatch ephemeral pool.
#
# This file keeps its name on purpose: the pool's runner group allows this
# workflow path, so we iterate here rather than adding new workflow files.
#
# Shape (mirrors the MI300 CI): build the gfx1151 image ONCE, push it to a
# registry, and have the test job PULL it via a job-level `container:` instead
# of building inline. Here build + push + pull all happen in one run so we can
# validate the whole round-trip on a branch; later the build moves to the
# scheduled build-docker-images flow and only the test job remains.
name: AMD Strix Halo probe

on:
  workflow_dispatch:
  push:
    branches:
      - run_amd_strix_halo*

permissions:
  contents: read
  packages: write   # push the image to GHCR with the built-in GITHUB_TOKEN

jobs:
  build-image:
    name: Build & push gfx1151 image
    # Built on the pool: the ROCm 7.2.1-complete base + torch wheels are tens of
    # GB and do not fit a GitHub-hosted runner's disk; the pool has 1.6T.
    runs-on: [self-hosted, Linux, devlab-dispatch, strix-halo]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push
        run: |
          IMAGE=ghcr.io/huggingface/transformers-pytorch-amd-gpu-gfx1151
          docker build \
            -f docker/transformers-pytorch-amd-gpu-gfx1151/Dockerfile \
            -t "${IMAGE}:${GITHUB_SHA}" \
            docker/transformers-pytorch-amd-gpu-gfx1151
          docker push "${IMAGE}:${GITHUB_SHA}"
          echo "Pushed ${IMAGE}:${GITHUB_SHA}"

  test:
    name: Smoke + tests (pull prebuilt image)
    needs: build-image
    runs-on: [self-hosted, Linux, devlab-dispatch, strix-halo]
    timeout-minutes: 120
    # GitHub pulls this image and runs every step inside it. `options` passes the
    # GPU devices and the host render group (gid 992 on the pool) into the
    # container -- the same flags the inline `docker run` used.
    container:
      image: ghcr.io/huggingface/transformers-pytorch-amd-gpu-gfx1151:${{ github.sha }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device=/dev/kfd --device=/dev/dri --group-add 992
    steps:
      - name: Smoke-test torch + Flash-Attention on the GPU
        run: |
          python3 -u - <<'PY'
          print("[1] python up", flush=True)
          import torch
          print("[2] torch imported:", torch.__version__, "hip:", torch.version.hip, flush=True)
          print("[3] cuda available:", torch.cuda.is_available(), flush=True)
          assert torch.cuda.is_available(), "no ROCm GPU visible inside the container"
          print("[4] device:", torch.cuda.get_device_name(0), flush=True)

          t = torch.ones(8, device="cuda"); torch.cuda.synchronize()
          print("[5] tiny cuda tensor ok, sum:", float(t.sum()), flush=True)

          x = torch.randn(2048, 2048, device="cuda", dtype=torch.float16)
          torch.cuda.synchronize()
          print("[6] matmul sum:", float((x @ x).sum()), flush=True)

          import flash_attn
          from flash_attn import flash_attn_func
          print("[7] flash_attn:", flash_attn.__version__, flush=True)
          q = torch.randn(1, 256, 8, 64, device="cuda", dtype=torch.float16)
          out = flash_attn_func(q, q, q)
          torch.cuda.synchronize()
          print("[8] FA out:", tuple(out.shape), flush=True)
          print("ALL GOOD", flush=True)
          PY

      - name: Run a tiny transformers test slice (optional signal)
        continue-on-error: true
        run: |
          cd /transformers && python3 -m pytest -q tests/utils/test_modeling_utils.py -x
