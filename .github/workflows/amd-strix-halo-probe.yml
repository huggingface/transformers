# Connectivity probe for the AMD Ryzen "Strix Halo" DevLab Dispatch ephemeral
# runner pool (Radeon 8060S / gfx1151, plus an NPU on every machine).
#
# This is deliberately the smallest thing that proves the route works. It is
# dispatch-only: nothing here fires on push or pull_request, so it cannot run
# on untrusted code and costs nothing until someone asks for it. Once we have
# confirmed jobs land on the pool, real test jobs can be added alongside this
# one (see the commented `test-strix-halo` sketch at the bottom).
name: AMD Strix Halo probe

on:
  workflow_dispatch:
  # Lets us exercise the pool on a branch without merging to `main`: push to a
  # branch named `run_amd_strix_halo*` on huggingface/transformers and this runs.
  # (Same convention the AMD scheduled-CI callers use.) The glob never matches
  # `main`, so carrying this trigger into `main` later is harmless.
  push:
    branches:
      - run_amd_strix_halo*

permissions:
  contents: read

jobs:
  probe:
    name: Hello from the DevLab pool
    # `devlab-dispatch` is the opt-in token that reaches the AMD Ryzen pool. A
    # fresh ephemeral runner is built for this job alone and destroyed when it
    # finishes, so nothing persists between runs. `strix-halo` narrows which
    # machine answers; the orchestrator picks whichever one is free.
    runs-on: [self-hosted, Linux, devlab-dispatch, strix-halo]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Report the machine
        run: |
          echo "runner   : ${RUNNER_NAME:-unknown}"
          echo "kernel   : $(uname -srm)"
          echo "distro   : $(. /etc/os-release && echo "$PRETTY_NAME")"
          echo "cpu      : $(grep -m1 '^model name' /proc/cpuinfo | cut -d: -f2- | xargs)"
          echo "cores    : $(nproc)"
          echo "memory   : $(free -h | awk '/^Mem:/ {print $2}')"
          echo "disk free: $(df -h . | awk 'NR==2 {print $4}')"

      - name: Report the AMD stack
        # Informational only. A missing tool prints a line and does not fail the
        # job -- the point of this run is the route, not the toolchain.
        run: |
          command -v rocminfo >/dev/null && rocminfo | grep -m1 'Marketing Name' || echo "rocminfo : not installed"
          command -v amd-smi >/dev/null && amd-smi list || echo "amd-smi  : not installed"
          command -v xrt-smi >/dev/null && xrt-smi examine | head -20 || echo "xrt-smi  : not installed"
          command -v python3 >/dev/null && python3 -VV || echo "python3  : not installed"

      - name: Report the Torch stack
        # Also informational -- confirms whether a usable PyTorch/ROCm runtime is
        # present on the bare pool before we commit to a container-based job.
        run: |
          python3 - <<'PY' || echo "torch    : not importable on the bare runner"
          import torch
          print("torch      :", torch.__version__)
          print("hip        :", getattr(torch.version, "hip", None))
          print("cuda avail :", torch.cuda.is_available())
          if torch.cuda.is_available():
              print("device     :", torch.cuda.get_device_name(0))
          PY

      - name: Done
        run: echo "Job ran on the DevLab Dispatch pool (AMD Strix Halo)."

