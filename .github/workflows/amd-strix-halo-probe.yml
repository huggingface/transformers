# AMD Ryzen "Strix Halo" (gfx1151) and Radeon AI Pro R9700 (gfx1201) CI on the
# DevLab Dispatch ephemeral pool.
#
# This file keeps its name on purpose: the pool's runner group allows this
# workflow path, so we iterate here rather than adding new workflow files.
#
# The images are built + pushed separately by build-amd-gfx1151-image.yml (one
# per GPU_ARCH, from docker/transformers-pytorch-amd-gpu-gfx1151/Dockerfile);
# the jobs here just PULL them via a job-level `container:`.
#
#  * default push  -> quick smoke test (`test` job), gfx1151
#  * push w/ [models] in the commit msg -> full ALL-MODELS run, ONE JOB PER MODEL
#  * workflow_dispatch -> either, on the GPU chosen by `arch`
#
# One-job-per-model, like the MI300/MI355 CIs: GitHub caps a matrix at 256 jobs,
# and there are >256 models, so `models-setup` splits tests/models/* into 3
# slices (<=256 each) and there is one models-ci job group per slice, each a
# matrix over its slice's folders. Total = one job per model in a single run.
#
# Timeouts: each job wraps pytest in coreutils `timeout` so a hang ends as a
# FAILED job with the partial -v log visible (SIGINT -> pytest prints its
# summary; SIGKILL 2 min later if a stuck GPU call ignores it). We deliberately
# do NOT rely on GitHub's job timeout, which marks the job `cancelled` and hides
# the logs; `timeout-minutes` here is only a loose outer safety net.
name: AMD Strix Halo probe

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "GPU: gfx1151 (Strix Halo) or gfx1201 (Radeon AI Pro R9700)"
        type: choice
        default: gfx1151
        options: [gfx1151, gfx1201]
      all_models:
        description: "Run every model folder (otherwise the smoke test only)"
        type: boolean
        default: false
  push:
    branches:
      - run_amd_strix_halo*

permissions:
  contents: read
  packages: read   # pull the image from GHCR with the built-in GITHUB_TOKEN

env:
  ARCH: ${{ inputs.arch || 'gfx1151' }}
  # Integration tests whose checkpoint (over ~60 GB) neither GPU can hold. They
  # do not fail cleanly: the load is killed, and the next GPU wait in the
  # replacement xdist worker never returns, so the job sits until its timeout
  # and the host is lost to the pool for hours (phimoe 84 GB and exaone4 64 GB
  # did this on gfx1151, whose GPU may map 62 GiB; gfx1201 has 32 GB). Classes
  # from per-folder checkpoint sizes; the *Small*/*Tiny*/*Processor*
  # integration classes use small models and still run.
  BIG_MODEL_SKIP: >-
    and not Exaone4IntegrationTest and not Exaone4_5_IntegrationTest
    and not Glm4MoeIntegrationTest and not HyperCLOVAXVisionV2IntegrationTest
    and not KimiLinearIntegrationTest and not NemotronH_Omni_Reasoning_V3IntegrationTest
    and not PhimoeIntegrationTest and not Qwen3MoeIntegrationTest
    and not Qwen3OmniModelIntegrationTest and not Qwen3VLMoeIntegrationTest
    and not SeedOssIntegrationTest
  # gfx1201 only: torch.compile(mode="reduce-overhead") hits hipErrorIllegalState
  # ("CUDA driver error: 401") during HIP graph warmup; passes on gfx1151 with the
  # same image. A ROCm issue, skipped so the lane can go green.
  KNOWN_FAIL_GFX1201: >-
    and not test_generate_compilation_all_outputs
    and not test_generate_compile_model_forward_fullgraph
    and not test_generate_from_inputs_embeds_with_static_cache
    and not test_generate_with_static_cache
    and not test_static_cache_no_recompile_with_smaller_length
    and not test_torch_export_generate_dynamic_static_cache
    and not test_torch_export_generate_static_static_cache
    and not test_sdpa_can_compile_dynamic

jobs:
  models-setup:
    name: Split models into slices
    if: ${{ contains(github.event.head_commit.message, '[models]') || inputs.all_models }}
    runs-on: ubuntu-latest
    outputs:
      slice0: ${{ steps.split.outputs.slice0 }}
      slice1: ${{ steps.split.outputs.slice1 }}
      slice2: ${{ steps.split.outputs.slice2 }}
      skip: ${{ steps.split.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - id: split
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, json, math
          base = "tests/models"
          dirs = sorted(d for d in os.listdir(base)
                        if os.path.isdir(os.path.join(base, d)) and not d.startswith("__"))
          N = 3                                          # 3 slices keeps each <=256
          per = math.ceil(len(dirs) / N)
          for i in range(N):
              print(f"slice{i}=" + json.dumps(dirs[i * per:(i + 1) * per]))
          PY
          # The -k expression for this GPU, computed once for all three groups.
          skip="not test_flex_attention_with_grads ${BIG_MODEL_SKIP}"
          [ "$ARCH" = gfx1201 ] && skip="${skip} ${KNOWN_FAIL_GFX1201}"
          echo "skip=${skip}" >> "$GITHUB_OUTPUT"

  # One job per model. Three near-identical job groups, one per slice, so each
  # matrix stays under GitHub's 256-job cap. Anchors aren't supported in Actions
  # YAML, hence the repetition. To change the test command, edit all three.
  models-ci-0:
    name: "${{ matrix.model }}"
    needs: models-setup
    runs-on: [self-hosted, Linux, devlab-dispatch, "${{ (inputs.arch || 'gfx1151') == 'gfx1201' && 'radeon-r9700' || 'strix-halo' }}"]
    timeout-minutes: 380   # loose outer net; the `timeout` in the step is the real limit
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJson(needs.models-setup.outputs.slice0) }}
    container:
      image: ghcr.io/huggingface/transformers-pytorch-amd-gpu-${{ inputs.arch || 'gfx1151' }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device=/dev/kfd --device=/dev/dri --group-add 992
      volumes:
        - /mnt/scratch/cache/hf:/mnt/cache
    env:
      HF_HOME: /mnt/cache
      HF_TOKEN: ${{ secrets.HF_HUB_READ_TOKEN }}
      RUN_SLOW: "1"
      OMP_NUM_THREADS: "4"
    steps:
      - name: Test ${{ matrix.model }}
        env:
          SKIP: ${{ needs.models-setup.outputs.skip }}
        run: |
          cd /transformers
          # `timeout` kills pytest itself on a hang so the job FAILS with the
          # partial log (SIGINT -> summary; SIGKILL 2 min later if it's stuck in a
          # GPU call). xdist --max-worker-restart survives a segfault; pytest's
          # --timeout is the per-test cap. One worker: at RUN_SLOW=1, -n 8 was
          # only 8-22% faster for twice the memory, and big checkpoints need the
          # memory. (xdist + pytest-timeout are in the image.)
          timeout -s INT --kill-after=120 360m \
            python3 -m pytest -v -rsfE -n 1 --max-worker-restart=3 --dist=loadscope \
              --timeout=1200 --timeout-method=signal \
              -k "$SKIP" \
              tests/models/${{ matrix.model }}

  models-ci-1:
    name: "${{ matrix.model }}"
    needs: models-setup
    runs-on: [self-hosted, Linux, devlab-dispatch, "${{ (inputs.arch || 'gfx1151') == 'gfx1201' && 'radeon-r9700' || 'strix-halo' }}"]
    timeout-minutes: 380
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJson(needs.models-setup.outputs.slice1) }}
    container:
      image: ghcr.io/huggingface/transformers-pytorch-amd-gpu-${{ inputs.arch || 'gfx1151' }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device=/dev/kfd --device=/dev/dri --group-add 992
      volumes:
        - /mnt/scratch/cache/hf:/mnt/cache
    env:
      HF_HOME: /mnt/cache
      HF_TOKEN: ${{ secrets.HF_HUB_READ_TOKEN }}
      RUN_SLOW: "1"
      OMP_NUM_THREADS: "4"
    steps:
      - name: Test ${{ matrix.model }}
        env:
          SKIP: ${{ needs.models-setup.outputs.skip }}
        run: |
          cd /transformers
          timeout -s INT --kill-after=120 360m \
            python3 -m pytest -v -rsfE -n 1 --max-worker-restart=3 --dist=loadscope \
              --timeout=1200 --timeout-method=signal \
              -k "$SKIP" \
              tests/models/${{ matrix.model }}

  models-ci-2:
    name: "${{ matrix.model }}"
    needs: models-setup
    runs-on: [self-hosted, Linux, devlab-dispatch, "${{ (inputs.arch || 'gfx1151') == 'gfx1201' && 'radeon-r9700' || 'strix-halo' }}"]
    timeout-minutes: 380
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJson(needs.models-setup.outputs.slice2) }}
    container:
      image: ghcr.io/huggingface/transformers-pytorch-amd-gpu-${{ inputs.arch || 'gfx1151' }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device=/dev/kfd --device=/dev/dri --group-add 992
      volumes:
        - /mnt/scratch/cache/hf:/mnt/cache
    env:
      HF_HOME: /mnt/cache
      HF_TOKEN: ${{ secrets.HF_HUB_READ_TOKEN }}
      RUN_SLOW: "1"
      OMP_NUM_THREADS: "4"
    steps:
      - name: Test ${{ matrix.model }}
        env:
          SKIP: ${{ needs.models-setup.outputs.skip }}
        run: |
          cd /transformers
          timeout -s INT --kill-after=120 360m \
            python3 -m pytest -v -rsfE -n 1 --max-worker-restart=3 --dist=loadscope \
              --timeout=1200 --timeout-method=signal \
              -k "$SKIP" \
              tests/models/${{ matrix.model }}

  test:
    name: Smoke + tests (prebuilt image)
    # Skip the quick smoke job on an all-models run.
    if: ${{ !contains(github.event.head_commit.message, '[models]') && !inputs.all_models }}
    runs-on: [self-hosted, Linux, devlab-dispatch, "${{ (inputs.arch || 'gfx1151') == 'gfx1201' && 'radeon-r9700' || 'strix-halo' }}"]
    timeout-minutes: 120
    container:
      image: ghcr.io/huggingface/transformers-pytorch-amd-gpu-${{ inputs.arch || 'gfx1151' }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device=/dev/kfd --device=/dev/dri --group-add 992
    steps:
      - name: Smoke-test torch and the flash-attention hub kernel on the GPU
        run: |
          python3 -u - <<'PY'
          print("[1] python up", flush=True)
          import torch
          print("[2] torch imported:", torch.__version__, "hip:", torch.version.hip, flush=True)
          print("[3] cuda available:", torch.cuda.is_available(), flush=True)
          assert torch.cuda.is_available(), "no ROCm GPU visible inside the container"
          print("[4] device:", torch.cuda.get_device_name(0),
                torch.cuda.get_device_properties(0).gcnArchName, flush=True)

          t = torch.ones(8, device="cuda"); torch.cuda.synchronize()
          print("[5] tiny cuda tensor ok, sum:", float(t.sum()), flush=True)

          x = (torch.rand(2048, 2048, device="cuda", dtype=torch.float16) - 0.5) * 0.1
          torch.cuda.synchronize()
          print("[6] matmul sum:", float((x @ x).sum()), flush=True)

          # The image has no flash_attn package: transformers serves
          # flash_attention_2 from the aiter-flash-attn hub kernel, which the
          # image ships locally (LOCAL_KERNELS). Load it the way transformers does.
          from kernels import get_kernel
          fa = get_kernel("kernels-community/aiter-flash-attn", version=2)
          q = torch.randn(1, 256, 8, 64, device="cuda", dtype=torch.float16)
          out = fa.flash_attn_func(q, q, q)
          out = out[0] if isinstance(out, tuple) else out
          torch.cuda.synchronize()
          print("[7] aiter-flash-attn out:", tuple(out.shape), flush=True)
          ref = torch.nn.functional.scaled_dot_product_attention(
              q.transpose(1, 2), q.transpose(1, 2), q.transpose(1, 2)).transpose(1, 2)
          print("[8] max diff vs SDPA:", float((out - ref).abs().max()), flush=True)
          print("ALL GOOD", flush=True)
          PY

      - name: Run a tiny transformers test slice (optional signal)
        continue-on-error: true
        run: |
          cd /transformers && python3 -m pytest -q tests/utils/test_modeling_utils.py -x
