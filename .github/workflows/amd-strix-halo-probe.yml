# AMD Ryzen "Strix Halo" (gfx1151) CI on the DevLab Dispatch ephemeral pool.
#
# This file keeps its name on purpose: the pool's runner group allows this
# workflow path, so we iterate here rather than adding new workflow files.
#
# Test-only: the gfx1151 image is built and pushed separately by
# build-amd-gfx1151-image.yml. This job just PULLS it via a job-level
# `container:` and runs the tests on a pool runner -- so the per-run cost is a
# pull, not a build. Refresh the image (Dockerfile change) by running that build
# workflow first.
name: AMD Strix Halo probe

on:
  workflow_dispatch:
  push:
    branches:
      - run_amd_strix_halo*

permissions:
  contents: read
  packages: read   # pull the image from GHCR with the built-in GITHUB_TOKEN

jobs:
  # --- Full all-models run (gated) -------------------------------------------
  # Sharded run of every tests/models/* folder, sized to the pool's ~7 usable
  # concurrency. Runs ONLY when the pushed commit message contains "[models]".
  # `setup` (on a hosted runner) splits the 514 model folders into N groups; the
  # matrix then runs each group on the pool inside the prebuilt image.
  models-setup:
    name: Split model folders into shards
    if: ${{ contains(github.event.head_commit.message, '[models]') }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.split.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: split
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, json
          base = "tests/models"
          dirs = sorted(d for d in os.listdir(base)
                        if os.path.isdir(os.path.join(base, d)) and not d.startswith("__"))
          # GitHub caps a matrix at 256 jobs/run, and we have >256 models, so we
          # use the max granularity: 256 groups (~2 models each), each job NAMED
          # by its model(s) so the UI shows model names rather than "shard N".
          N = min(256, len(dirs))
          groups = [dirs[i::N] for i in range(N)]           # round-robin balance
          include = [{"name": ", ".join(g),
                      "dirs": " ".join(f"tests/models/{d}" for d in g)}
                     for g in groups if g]
          print("matrix=" + json.dumps({"include": include}))
          PY

  models-ci:
    name: "${{ matrix.name }}"
    needs: models-setup
    runs-on: [self-hosted, Linux, devlab-dispatch, strix-halo]
    timeout-minutes: 240
    strategy:
      fail-fast: false
      # Throttle dispatch: the pool serves ~7 concurrently. Without this, all 256
      # jobs hit the runner queue at once; a previous run drained ~78 then stalled
      # with 178 stuck queued. max-parallel keeps only ~7 in flight at a time.
      max-parallel: 7
      matrix: ${{ fromJson(needs.models-setup.outputs.matrix) }}
    container:
      image: ghcr.io/huggingface/transformers-pytorch-amd-gpu-gfx1151:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device=/dev/kfd --device=/dev/dri --group-add 992
    env:
      HF_HOME: /tmp/hf_home
      HF_TOKEN: ${{ secrets.HF_TOKEN }}   # empty if unset -> unauthenticated
      # Flip to "1" for the full slow suite (real checkpoints) once non-slow is understood.
      RUN_SLOW: "0"
    steps:
      - name: Run model tests for this shard
        run: |
          cd /transformers
          echo "models -> ${{ matrix.dirs }}"
          # Run under xdist with worker restart: some attention tests hard-crash
          # (segfault) the process on gfx1151, which would otherwise abort the
          # whole shard and skip every model after it. With a worker subprocess,
          # a crash is reported as a failed test and the worker restarts to finish
          # the remaining models -- so the shard always runs to completion.
          python3 -m pip install -q pytest-xdist || true
          python3 -m pytest -v -rsfE -n 1 --max-worker-restart=1000 --dist=loadscope ${{ matrix.dirs }}

  test:
    name: Smoke + tests (prebuilt gfx1151 image)
    # Skip the quick smoke job on a [models] run.
    if: ${{ !contains(github.event.head_commit.message, '[models]') }}
    runs-on: [self-hosted, Linux, devlab-dispatch, strix-halo]
    timeout-minutes: 120
    # GitHub pulls this image and runs every step inside it. `options` passes the
    # GPU devices and the host render group (gid 992 on the pool) into it.
    container:
      image: ghcr.io/huggingface/transformers-pytorch-amd-gpu-gfx1151:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device=/dev/kfd --device=/dev/dri --group-add 992
    steps:
      - name: Smoke-test torch + Flash-Attention on the GPU
        run: |
          python3 -u - <<'PY'
          print("[1] python up", flush=True)
          import torch
          print("[2] torch imported:", torch.__version__, "hip:", torch.version.hip, flush=True)
          print("[3] cuda available:", torch.cuda.is_available(), flush=True)
          assert torch.cuda.is_available(), "no ROCm GPU visible inside the container"
          print("[4] device:", torch.cuda.get_device_name(0), flush=True)

          t = torch.ones(8, device="cuda"); torch.cuda.synchronize()
          print("[5] tiny cuda tensor ok, sum:", float(t.sum()), flush=True)

          # bounded values so the fp16 matmul does not overflow to inf
          x = (torch.rand(2048, 2048, device="cuda", dtype=torch.float16) - 0.5) * 0.1
          torch.cuda.synchronize()
          print("[6] matmul sum:", float((x @ x).sum()), flush=True)

          import flash_attn
          from flash_attn import flash_attn_func
          print("[7] flash_attn:", flash_attn.__version__, flush=True)
          q = torch.randn(1, 256, 8, 64, device="cuda", dtype=torch.float16)
          out = flash_attn_func(q, q, q)
          torch.cuda.synchronize()
          print("[8] FA out:", tuple(out.shape), flush=True)
          print("ALL GOOD", flush=True)
          PY

      - name: Run a tiny transformers test slice (optional signal)
        continue-on-error: true
        run: |
          cd /transformers && python3 -m pytest -q tests/utils/test_modeling_utils.py -x
