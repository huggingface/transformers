# AMD Ryzen "Strix Halo" (gfx1151) CI on the DevLab Dispatch ephemeral pool.
#
# This file keeps its name on purpose: the pool's runner group allows this
# workflow path, so we iterate here rather than adding new workflow files.
#
# It builds the gfx1151 CI image ON a pool runner and smoke-tests torch +
# Flash-Attention inside it -- the "does the Dockerfile build and run on the
# real hardware" check. It builds at job time on purpose; once it's green we
# move image building to the nightly build-docker-images flow (built once,
# pushed, cached) like the MI300 image, and test jobs just pull it.
name: AMD Strix Halo probe

on:
  workflow_dispatch:
  push:
    branches:
      - run_amd_strix_halo*

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build gfx1151 image, smoke-test torch + FA
    # `devlab-dispatch` reaches the AMD Ryzen pool; `strix-halo` narrows to the
    # Strix Halo machines. A fresh ephemeral runner is built per job.
    runs-on: [self-hosted, Linux, devlab-dispatch, strix-halo]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Report the machine + container runtime
        run: |
          echo "runner : ${RUNNER_NAME:-unknown}"
          echo "kernel : $(uname -srm)"
          echo "disk   : $(df -h . | awk 'NR==2 {print $4" free"}')"
          command -v rocminfo >/dev/null && rocminfo | grep -m1 'Marketing Name' || echo "rocminfo : not installed"
          command -v docker >/dev/null && docker version || echo "docker : not available"
          command -v podman >/dev/null && podman version || echo "podman : not available"

      - name: Build the gfx1151 image
        run: |
          docker build \
            -f docker/transformers-pytorch-amd-gpu-gfx1151/Dockerfile \
            -t transformers-gfx1151:ci \
            docker/transformers-pytorch-amd-gpu-gfx1151

      - name: Smoke-test torch + Flash-Attention on the GPU
        run: |
          mkdir -p "${RUNNER_TEMP}/scratch"
          # Grant the container the host's `render` group so it can reach the GPU
          # devices. Resolve the GID on the host (the container image has no such
          # group by name, which is why `--group-add render` failed before).
          RENDER_GID=$(getent group render | cut -d: -f3)
          # -i is REQUIRED: without it docker does not attach stdin, so the
          # heredoc never reaches `python3 -` and the test silently no-ops.
          # -u + flush so we see exactly which stage crashes (a segfault drops
          # buffered stdout); AMD_SERIALIZE_KERNEL=3 makes HIP errors synchronous.
          docker run --rm -i \
            --device=/dev/kfd --device=/dev/dri \
            --group-add "${RENDER_GID}" \
            --security-opt seccomp=unconfined \
            -e AMD_SERIALIZE_KERNEL=3 \
            -v "${RUNNER_TEMP}/scratch:/scratch" \
            transformers-gfx1151:ci \
            python3 -u - <<'PY'
          print("[1] python up", flush=True)
          import torch
          print("[2] torch imported:", torch.__version__, "hip:", torch.version.hip, flush=True)
          print("[3] cuda available:", torch.cuda.is_available(), flush=True)
          assert torch.cuda.is_available(), "no ROCm GPU visible inside the container"
          print("[4] device:", torch.cuda.get_device_name(0), flush=True)

          t = torch.ones(8, device="cuda"); torch.cuda.synchronize()
          print("[5] tiny cuda tensor ok, sum:", float(t.sum()), flush=True)

          x = torch.randn(2048, 2048, device="cuda", dtype=torch.float16)
          torch.cuda.synchronize()
          print("[6] matmul sum:", float((x @ x).sum()), flush=True)

          import flash_attn
          from flash_attn import flash_attn_func
          print("[7] flash_attn:", flash_attn.__version__, flush=True)
          q = torch.randn(1, 256, 8, 64, device="cuda", dtype=torch.float16)
          out = flash_attn_func(q, q, q)
          torch.cuda.synchronize()
          print("[8] FA out:", tuple(out.shape), flush=True)
          print("ALL GOOD", flush=True)
          PY

      - name: Run a tiny transformers test slice (optional signal)
        continue-on-error: true
        run: |
          RENDER_GID=$(getent group render | cut -d: -f3)
          docker run --rm \
            --device=/dev/kfd --device=/dev/dri \
            --group-add "${RENDER_GID}" \
            --security-opt seccomp=unconfined \
            -v "${RUNNER_TEMP}/scratch:/scratch" \
            transformers-gfx1151:ci \
            bash -c "cd /transformers && python3 -m pytest -q tests/utils/test_modeling_utils.py -x"
