name: PR CI

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
      - ci-*
      - v*-release

concurrency:
  # Group by PR number, commit SHA (main) to avoid cross-branch cancellation, or branch ref for cancellation within each branch
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.ref == 'refs/heads/main' && github.sha) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Read job logs, to report OOM-killed test shards to the CI dashboards.
  actions: read

jobs:
  # For `merge_group` events, `github.ref` is `refs/heads/gh-readonly-queue/main/pr-<N>-<base_sha>`, so the workflow-level
  # group above differs each time the merge queue rebuilds a PR's merge group (e.g. another PR landed on `main`) and the
  # previous run of the same PR is not cancelled. No context exposes `<N>` alone and expressions can't extract it, so we
  # compute it here and use it in a job-level concurrency group below.
  concurrency-key:
    if: github.event_name == 'merge_group'
    permissions: {}
    runs-on: ubuntu-slim
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - id: key
        env:
          REF: ${{ github.ref }}
        run: |
          if [[ "$REF" =~ ^refs/heads/gh-readonly-queue/(.+)/pr-([0-9]+)-[0-9a-f]+$ ]]; then
            echo "key=merge-queue-${BASH_REMATCH[1]}-pr-${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          fi

  pr-ci:
    needs: concurrency-key
    # `concurrency-key` is skipped for non-merge-queue events: without a status function here, `pr-ci` would be skipped too.
    if: ${{ !cancelled() && needs.concurrency-key.result != 'failure' }}
    concurrency:
      # Without a key (non-merge-queue events, or an unexpected ref), the group is unique per run, so there is no
      # job-level cancellation; the workflow-level group above still handles those events.
      group: ${{ github.workflow }}-${{ needs.concurrency-key.outputs.key || format('run-{0}', github.run_id) }}
      cancel-in-progress: true
    # DON'T use commit sha here before the CI migration is finished
    uses: huggingface/transformers-ci/.github/workflows/pr-ci_dynamic_caller_example.yml@ci-mic-input-cases  # TEMP: main
