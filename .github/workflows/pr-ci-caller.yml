name: PR CI

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
      - ci-*
      - v*-release

concurrency:
  # Group by PR number, commit SHA (main) to avoid cross-branch cancellation, or branch ref for cancellation within each branch
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.ref == 'refs/heads/main' && github.sha) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Read job logs, to report OOM-killed test shards to the CI dashboards.
  actions: read

jobs:
  pr-ci:
    # Validate the consolidated MIC layout with its matching runner.
    # Restore @main after the transformers-ci runner dependency is merged.
    uses: huggingface/transformers-ci/.github/workflows/pr-ci_dynamic_caller_example.yml@6c6dc94f1790e207e8a7f755820ea11356248718

