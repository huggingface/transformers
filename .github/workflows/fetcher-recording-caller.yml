name: Fetcher Recording CI

# CI caller to validate the import-chain dep recording pipeline.
# Runs models relevant to the test fetcher (backbone edges, cross-model deps,
# dynamic image-processor loading) on single GPU only.
#
# Models chosen from tests/repo_utils/test_tests_fetcher.py assertions:
#   - models/bert       — basic baseline
#   - models/clip       — dynamic image-processor loading (image_processing_clip.py
#                         loaded via importlib, not static imports)
#   - models/llava, models/llava_next, models/vipllava, models/video_llava
#                       — composite models using CLIP as backbone (backbone edges)
#   - models/qwen2      — text backbone
#   - models/qwen2_audio, models/got_ocr2 — use qwen2 as backbone
#
# Single GPU only (multi-GPU removed in daily-ci_reusable.yml@fetcher-recording).

on:
  push:
    branches:
      - fetcher-recording

env:
  prev_workflow_run_id: ""
  other_workflow_run_id: ""

permissions:
  contents: read

jobs:
  setup:
    permissions: {}
    name: Setup
    runs-on: ubuntu-22.04
    steps:
      - name: Setup
        env:
          prev_workflow_run_id: ${{ inputs.prev_workflow_run_id || env.prev_workflow_run_id }}
          other_workflow_run_id: ${{ inputs.other_workflow_run_id || env.other_workflow_run_id }}
        run: |
          mkdir "setup_values"
          echo "$prev_workflow_run_id" > "setup_values/prev_workflow_run_id.txt"
          echo "$other_workflow_run_id" > "setup_values/other_workflow_run_id.txt"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: setup_values
          path: setup_values

  model-ci:
    name: Model CI
    uses: huggingface/transformers-ci/.github/workflows/daily-ci_reusable.yml@fetcher-recording
    with:
      job: run_models_gpu
      slack_report_channel: "#transformers-ci-dummy"
      docker: huggingface/transformers-all-latest-gpu
      ci_event: Daily CI
      runner_type: "a10"
      subdirs: "['models/bert', 'models/clip', 'models/llava', 'models/llava_next', 'models/vipllava', 'models/video_llava', 'models/qwen2', 'models/qwen2_audio', 'models/got_ocr2']"
      report_repo_id: hf-internal-testing/transformers_daily_ci
      commit_sha: ${{ github.sha }}
    secrets: inherit
