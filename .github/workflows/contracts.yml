name: Model integration contracts

# Proof of concept (huggingface/transformers-mic, docs/transformers-ci-proof.md).
# Runs the model integration contracts the changed files can affect, on slim
# fixtures pinned on the Hub, against the reviewed baselines in
# tests/contracts/expectations/. This first wave is observational: failures
# are reported in the summary and artifacts but do not block the PR.

on:
  pull_request:
  push:
    branches:
      - contracts-proof
      - proof-*  # demo changes on top of contracts-proof, selected as a PR would be

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    # This persistent self-hosted runner executes PR code. External fork PRs
    # need an isolated runner path before they can join the observational wave.
    if: github.event_name != 'pull_request' || contains(fromJSON('["MEMBER","OWNER","COLLABORATOR"]'), github.event.pull_request.author_association)
    # Infrastructure failures must not block PRs during the observational rollout.
    continue-on-error: true
    runs-on:
      group: aws-m8i-l-cache
    timeout-minutes: 90
    container:
      image: huggingface/transformers-torch-light
      options: "--shm-size=16gb"
    env:
      TMIC_SHA: 03500b0c365087d17ae048b3e00e11a9657a2982
      DOC_BUILDER_SHA: c69e96c087165ba49b1788e0c3464654dd60253c
      # Not the shared /mnt/cache: PR jobs mount it read-only, and fixtures and contracts are downloaded.
      HF_HOME: /tmp/hf_home
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "4"
      LOCK: tests/contracts/fleet-lock.json
      PROTOTYPE_LOCK: tests/contracts/prototype-fleet.lock
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install
        id: install
        continue-on-error: true
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          start=$SECONDS
          uv pip install -e .
          uv pip install "transformers-mic @ git+https://github.com/huggingface/transformers-mic@$TMIC_SHA"
          uv pip install timm jsonschema "git+https://github.com/huggingface/doc-builder@$DOC_BUILDER_SHA"
          echo "Installed in $((SECONDS - start)) s on $(lscpu | sed -n 's/^Model name: *//p'), $(nproc) cores"

      - uses: actions/cache@v4
        continue-on-error: true
        with:
          path: /tmp/hf_home/hub
          key: contracts-hf-${{ hashFiles('tests/contracts/fleet-lock.json') }}

      - name: Run the contracts
        id: run
        if: steps.install.outcome == 'success'
        continue-on-error: true
        env:
          REF_NAME: ${{ github.ref_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          export PYTHONPATH="$PWD/src"
          python - <<'PY_SOURCE'
          import os
          from pathlib import Path
          import transformers
          expected = Path.cwd() / "src/transformers/__init__.py"
          actual = Path(transformers.__file__).resolve()
          assert actual == expected.resolve(), (actual, expected)
          print("Framework under test:", actual)
          import torch
          assert torch.get_num_threads() == 4, torch.get_num_threads()
          print("CPU threads:", torch.get_num_threads())
          PY_SOURCE
          python - <<'PY_WHISPER_MATCH'
          import json
          from pathlib import Path
          from transformers import WhisperConfig

          issue = "https://github.com/huggingface/transformers/issues/49456"
          message = "You have modified the pretrained model configuration"
          fixed = "suppress_tokens" not in WhisperConfig(suppress_tokens=[1])._get_generation_parameters()
          for path, target in (
              (Path("tests/contracts/fleet-lock.json"), "Whisper/mic-whisper-tiny-slim"),
              (Path("tests/contracts/prototype-fleet.lock"), "mic-whisper/mic-whisper-slim"),
          ):
              lock = json.loads(path.read_text())
              entry = lock["known_failures"][target]
              assert entry == {"issue": issue, "match": message}, (path, entry)
              if fixed:
                  del lock["known_failures"][target]
                  path.write_text(json.dumps(lock, indent=2) + "\n")
          print("Whisper generation fix present:", fixed)
          PY_WHISPER_MATCH
          if [[ "$REF_NAME" == contracts-proof || "$HEAD_REF" == contracts-proof ]]; then
            selection=(--run-all)
          elif [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            git diff --name-only "origin/$BASE_REF...HEAD" > /tmp/changed-files.txt
            selection=(--changed-files /tmp/changed-files.txt)
          elif [[ "$REF_NAME" == proof-* ]]; then
            git diff --name-only origin/contracts-proof...HEAD > /tmp/changed-files.txt
            selection=(--changed-files /tmp/changed-files.txt)
          else
            selection=(--run-all)  # pushes to the proof branch run every contract
          fi
          if [[ -f /tmp/changed-files.txt ]]; then
            echo "Changed files: $(wc -l < /tmp/changed-files.txt)"; head -20 /tmp/changed-files.txt
          else
            echo "Changed files: all"
          fi
          start=$SECONDS
          # This SmolLM fixture has a reviewed native BF16 default.
          tmic check --fixtures-only --lock "$LOCK" --contract SmolLM --target mic-SmolLM-slim --variant default \
            "${selection[@]}" --output /tmp/results.jsonl 2> /tmp/run.log | python -c '
          import json, sys
          for line in sys.stdin:
              r = json.loads(line)
              print(r["status"].ljust(6), r["target"], r.get("platform", ""), flush=True)' || status=$?
          echo "$(tail -1 /tmp/run.log); $((SECONDS - start)) s"
          tmic check --fixtures-only --lock "$PROTOTYPE_LOCK" --variant bfloat16 \
            "${selection[@]}" --output /tmp/results.jsonl 2>> /tmp/run.log | python -c '
          import json, sys
          for line in sys.stdin:
              r = json.loads(line)
              print(r["status"].ljust(6), r["target"], r.get("variant", ""), r.get("platform", ""), flush=True)' || status=$?
          if [[ "$REF_NAME" == contracts-proof || "$HEAD_REF" == contracts-proof ]]; then
            python - <<'PY_COVERAGE'
          import json
          from pathlib import Path
          lock = json.loads(Path("tests/contracts/prototype-fleet.lock").read_text())
          rows = [json.loads(line) for line in Path("/tmp/results.jsonl").read_text().splitlines()]
          seen = {(row.get("contract_name"), row.get("variant")) for row in rows}
          required = {(name, "bfloat16") for name in lock["contracts"]}
          missing = required - seen
          assert not missing, f"Prototype cases did not execute: {sorted(missing)}"
          controls = [row for row in rows if row.get("contract_name") == "SmolLM"]
          assert len(controls) == 1 and controls[0].get("status") == "pass", controls
          assert len(rows) == len(required) + 1, f"unexpected proof case count: {len(rows)}"
          for row in rows:
              baseline = row.get("baseline")
              if row.get("status") == "xfail":
                  continue  # The older branch still has the exact Whisper generation bug.
              assert baseline, row
              dtype = json.loads(Path(baseline).read_text())["outputs"]["runtime"]["dtype"]
              assert dtype == "bfloat16", (row.get("contract_name"), dtype)
          print(f"Verified execution of {len(required)} prototype cases")
          PY_COVERAGE
          fi
          exit "${status:-0}"

      - name: Summary
        id: summary
        if: always()
        continue-on-error: true
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          RUN_OUTCOME: ${{ steps.run.outcome }}
        run: |
          touch /tmp/results.jsonl
          {
            echo "**Observational run:** failures do not block this PR."
            echo
            echo "Source: \`$GITHUB_SHA\`; event: \`$GITHUB_EVENT_NAME\`."
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          if command -v tmic >/dev/null 2>&1; then
            tmic report /tmp/results.jsonl --log /tmp/run.log \
              --lock "$LOCK" >> "$GITHUB_STEP_SUMMARY" || \
              echo "Could not render the contract report; see the artifact and job log." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Contract runner was not installed; see the job log." >> "$GITHUB_STEP_SUMMARY"
          fi
          python - <<'PY_RESULT'
          import json
          import os
          from collections import Counter
          from importlib.metadata import PackageNotFoundError, version
          from pathlib import Path
          from platform import python_version

          results = Path('/tmp/results.jsonl')
          rows = [json.loads(line) for line in results.read_text().splitlines() if line.strip()]
          log = Path('/tmp/run.log')
          selections = [json.loads(line) for line in log.read_text().splitlines() if line.startswith('{"selection"')] if log.exists() else []
          packages = ['torch', 'torchvision', 'torchaudio', 'numpy', 'tokenizers', 'transformers', 'transformers-mic']
          versions = {'python': python_version()}
          for package in packages:
              try:
                  versions[package] = version(package)
              except PackageNotFoundError:
                  versions[package] = None
          report = {
              'event': os.environ['GITHUB_EVENT_NAME'],
              'sha': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'pr': json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text()).get('pull_request', {}).get('number'),
              'install_outcome': os.environ['INSTALL_OUTCOME'],
              'run_outcome': os.environ['RUN_OUTCOME'],
              'versions': versions,
              'counts': dict(Counter(row['status'] for row in rows)),
              'selections': [item['selection'] for item in selections],
              'results': len(rows),
          }
          Path('/tmp/contracts-observation.json').write_text(json.dumps(report, indent=2) + '\n')
          print('Observation:', json.dumps(report))
          PY_RESULT

      - uses: actions/upload-artifact@v4
        id: artifact
        if: always()
        continue-on-error: true
        with:
          name: contracts
          path: |
            /tmp/results.jsonl
            /tmp/run.log
            /tmp/contracts-observation.json

      - name: Flag contract failures for review
        if: always() && (steps.install.outcome == 'failure' || steps.run.outcome == 'failure' || steps.summary.outcome == 'failure' || steps.artifact.outcome == 'failure')
        run: |
          echo "::warning::A model integration contract failed or could not run; see the job summary and artifact for details. This observation does not block the PR."
