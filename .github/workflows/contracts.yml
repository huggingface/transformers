name: Model integration contracts

# Proof of concept (huggingface/transformers-mic, docs/transformers-ci-proof.md).
# Runs the model integration contracts the changed files can affect, on slim
# fixtures pinned on the Hub, against the reviewed baselines in
# tests/contracts/expectations/. Not a required check: a failure here is a
# signal for review, with the reproduce command in the job summary.

on:
  pull_request:
  push:
    branches:
      - contracts-proof
      - proof-*  # demo changes on top of contracts-proof, selected as a PR would be

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on:
      group: aws-m8i-l-cache
    timeout-minutes: 90
    container:
      image: huggingface/transformers-torch-light
      options: "--shm-size=16gb"
    env:
      TMIC_SHA: 648524e
      DOC_BUILDER_SHA: c69e96c087165ba49b1788e0c3464654dd60253c
      # Not the shared /mnt/cache: PR jobs mount it read-only, and fixtures and contracts are downloaded.
      HF_HOME: /tmp/hf_home
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "8"
      LOCK: tests/contracts/fleet-lock.json
      PROTOTYPE_LOCK: tests/contracts/prototype-fleet.lock
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          start=$SECONDS
          uv pip install torch==2.11.0 torchvision==0.26.0 torchaudio==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          uv pip install -e .
          uv pip install "transformers-mic @ git+https://github.com/huggingface/transformers-mic@$TMIC_SHA"
          uv pip install timm jsonschema "git+https://github.com/huggingface/doc-builder@$DOC_BUILDER_SHA"
          python - <<'PY_PINS'
          import json, subprocess
          pins = json.load(open("tests/contracts/prototype-fleet.lock"))["environment"]
          packages = [f"{name}=={version}" for name, version in pins.items() if name not in {"python", "torch", "torchvision", "torchaudio"}]
          subprocess.run(["uv", "pip", "install", *packages], check=True)
          PY_PINS
          echo "Installed in $((SECONDS - start)) s on $(lscpu | sed -n 's/^Model name: *//p'), $(nproc) cores"

      - uses: actions/cache@v4
        with:
          path: /tmp/hf_home/hub
          key: contracts-hf-${{ hashFiles('tests/contracts/fleet-lock.json') }}

      - name: Run the contracts
        id: run
        continue-on-error: true
        run: |
          if [[ "${{ github.ref_name }}" == contracts-proof || "${{ github.head_ref }}" == contracts-proof ]]; then
            selection=(--run-all)
          elif [[ "${{ github.event_name }}" == pull_request ]]; then
            git diff --name-only "origin/${{ github.base_ref }}...HEAD" > /tmp/changed-files.txt
            selection=(--changed-files /tmp/changed-files.txt)
          elif [[ "${{ github.ref_name }}" == proof-* ]]; then
            git diff --name-only origin/contracts-proof...HEAD > /tmp/changed-files.txt
            selection=(--changed-files /tmp/changed-files.txt)
          else
            selection=(--run-all)  # pushes to the proof branch run every contract
          fi
          if [[ -f /tmp/changed-files.txt ]]; then
            echo "Changed files: $(wc -l < /tmp/changed-files.txt)"; head -20 /tmp/changed-files.txt
          else
            echo "Changed files: all"
          fi
          start=$SECONDS
          tmic check --fixtures-only --lock "$LOCK" \
            "${selection[@]}" --output /tmp/results.jsonl 2> /tmp/run.log | python -c '
          import json, sys
          for line in sys.stdin:
              r = json.loads(line)
              print(r["status"].ljust(6), r["target"], r.get("platform", ""), flush=True)' || status=$?
          echo "$(tail -1 /tmp/run.log); $((SECONDS - start)) s"
          tmic check --fixtures-only --lock "$PROTOTYPE_LOCK" --all-variants \
            "${selection[@]}" --output /tmp/results.jsonl 2>> /tmp/run.log | python -c '
          import json, sys
          for line in sys.stdin:
              r = json.loads(line)
              print(r["status"].ljust(6), r["target"], r.get("variant", ""), r.get("platform", ""), flush=True)' || status=$?
          if [[ "${{ github.ref_name }}" == contracts-proof || "${{ github.head_ref }}" == contracts-proof ]]; then
            python - <<'PY_COVERAGE'
          import json
          from pathlib import Path
          lock = json.loads(Path("tests/contracts/prototype-fleet.lock").read_text())
          rows = [json.loads(line) for line in Path("/tmp/results.jsonl").read_text().splitlines()]
          seen = {(row.get("contract_name"), row.get("variant")) for row in rows}
          required = {(name, variant) for name in lock["contracts"] for variant in ("default", "eager", "bfloat16")}
          missing = required - seen
          assert not missing, f"Prototype cases did not execute: {sorted(missing)}"
          print(f"Verified execution of {len(required)} prototype cases")
          PY_COVERAGE
          fi
          exit "${status:-0}"

      - name: Summary
        if: always()
        run: |
          touch /tmp/results.jsonl
          tmic report /tmp/results.jsonl --log /tmp/run.log \
            --lock "$LOCK" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contracts
          path: |
            /tmp/results.jsonl
            /tmp/run.log

      - name: Result
        if: steps.run.outcome == 'failure'
        run: |
          echo "::error::A model integration contract failed: see the job summary for the failing target and how to reproduce it."
          exit 1
