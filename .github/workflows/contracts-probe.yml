name: Contracts probe

# Phase 1 of the model integration contracts proof
# (huggingface/model-integration-contracts, docs/transformers-ci-proof.md):
# do the cpu-x86_64 fixture baselines hold on the PR CI runner group and image?
# Runs the eight fixture contracts on Transformers 8625785e (the build the
# baselines were recorded on) twice: with the image's packages as a PR job
# would have them, then with the fleet lock's pinned packages. Non-blocking,
# push to this branch only; nothing else in PR CI changes.

on:
  push:
    branches:
      - contracts-proof

permissions:
  contents: read

jobs:
  probe:
    runs-on:
      group: aws-m8i-l-cache
    timeout-minutes: 60
    container:
      image: huggingface/transformers-torch-light
      options: "--shm-size=16gb"
    env:
      TRANSFORMERS_SHA: 8625785e7e3e138a328ec2e678dc198e356e7c6c
      DOC_BUILDER_SHA: c69e96c087165ba49b1788e0c3464654dd60253c
      # Not the shared /mnt/cache: PR jobs mount it read-only, and fixtures and contracts are downloaded.
      HF_HOME: /tmp/hf_home
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      PYTHONUNBUFFERED: "1"
      OUT: /tmp/out
      LOCK: utils/contracts/transformers/tests/contracts/fleet.lock
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Host
        run: |
          mkdir -p "$OUT"
          {
            echo "cpu: $(lscpu | sed -n 's/^Model name: *//p')"
            echo "cores: $(nproc)"
            echo "flags: $(grep -o -w -E 'avx2|avx512f|avx512_bf16|amx_bf16|amx_tile' /proc/cpuinfo | sort -u | tr '\n' ' ')"
            echo "python: $(python --version 2>&1) at $(command -v python)"
            echo "uv: $(uv --version 2>&1)"
            free -g | sed -n 2p
          } | tee "$OUT/host.txt"
          uv pip freeze > "$OUT/image-freeze.txt" 2>/dev/null || python -m pip freeze > "$OUT/image-freeze.txt"

      - name: Install Transformers and runner deps (image packages)
        run: |
          start=$SECONDS
          git init --quiet /tmp/transformers
          git -C /tmp/transformers fetch --quiet --depth 1 https://github.com/huggingface/transformers "$TRANSFORMERS_SHA"
          git -C /tmp/transformers checkout --quiet FETCH_HEAD
          uv pip install /tmp/transformers
          uv pip install jsonschema "git+https://github.com/huggingface/doc-builder@$DOC_BUILDER_SHA"
          echo "install_as_is_seconds: $((SECONDS - start))" | tee -a "$OUT/host.txt"
          uv pip freeze > "$OUT/as-is-freeze.txt"

      - name: Run fixture contracts (image packages)
        continue-on-error: true
        run: |
          for variant in default eager; do
            start=$SECONDS
            python utils/contracts/run.py --framework transformers --fixtures-only --require-all --variant "$variant" \
              --output "$OUT/as-is-$variant.jsonl" > /dev/null 2> "$OUT/as-is-$variant.log" || true
            echo "as-is $variant: $(tail -1 "$OUT/as-is-$variant.log") wall $((SECONDS - start)) s" | tee -a "$OUT/host.txt"
          done

      - name: Install the fleet lock's pinned packages
        run: |
          start=$SECONDS
          pins() { python -c 'import json, sys
          env = json.load(open(sys.argv[1]))["environment"]
          torch = {"torch", "torchvision", "torchaudio"}
          print(" ".join(f"{n}=={v}" for n, v in env.items() if n != "python" and (n in torch) == (sys.argv[2] == "torch")))' "$LOCK" "$1"; }
          uv pip install $(pins torch) --index-url https://download.pytorch.org/whl/cpu
          uv pip install $(pins other)
          echo "install_pinned_seconds: $((SECONDS - start))" | tee -a "$OUT/host.txt"
          uv pip freeze > "$OUT/pinned-freeze.txt"

      - name: Run fixture contracts (pinned packages)
        continue-on-error: true
        run: |
          for variant in default eager; do
            start=$SECONDS
            python utils/contracts/run.py --framework transformers --fixtures-only --require-all --variant "$variant" \
              --output "$OUT/pinned-$variant.jsonl" > /dev/null 2> "$OUT/pinned-$variant.log" || true
            echo "pinned $variant: $(tail -1 "$OUT/pinned-$variant.log") wall $((SECONDS - start)) s" | tee -a "$OUT/host.txt"
          done

      - name: Summary
        if: always()
        run: |
          {
            echo "### Contracts probe on aws-m8i-l-cache"
            echo
            echo '```'
            cat "$OUT/host.txt"
            echo '```'
            echo
            python - <<'EOF'
          import json, os, pathlib
          print("| Mode | Variant | Target | Platform | Status | First failure |")
          print("| --- | --- | --- | --- | --- | --- |")
          for mode in ("as-is", "pinned"):
              for path in sorted(pathlib.Path(os.environ["OUT"]).glob(f"{mode}-*.jsonl")):
                  for line in path.read_text().splitlines():
                      r = json.loads(line)
                      first = (r.get("failures") or [""])[0].replace("|", "/").replace("\n", " ")[:160]
                      print(f"| {mode} | {r['variant']} | {r['target']} | {r.get('platform', '')} | {r['status']} | {first} |")
          EOF
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contracts-probe
          path: /tmp/out/
