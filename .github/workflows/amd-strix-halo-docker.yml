# Experimental: build the gfx1151 (Strix Halo) CI image ON a pool runner and
# smoke-test torch + Flash-Attention inside it. This is the "does the Dockerfile
# build and run on the real hardware" check. It builds at job time on purpose --
# once it's green we move image building to the nightly build-docker-images flow
# (built once, pushed, cached) exactly like the MI300 image, and the test jobs
# just pull it.
name: AMD Strix Halo docker build + smoke test

on:
  workflow_dispatch:
  push:
    branches:
      - run_amd_strix_halo*

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build gfx1151 image, smoke-test torch + FA
    runs-on: [self-hosted, Linux, devlab-dispatch, strix-halo]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Container runtime available?
        # We have not yet confirmed the pool runners expose docker/podman. This
        # step tells us; if neither is present that is the blocker to raise.
        run: |
          command -v docker >/dev/null && docker version || echo "docker : not available"
          command -v podman >/dev/null && podman version || echo "podman : not available"

      - name: Build the gfx1151 image
        run: |
          docker build \
            -f docker/transformers-pytorch-amd-gpu-gfx1151/Dockerfile \
            -t transformers-gfx1151:ci \
            docker/transformers-pytorch-amd-gpu-gfx1151

      - name: Smoke-test torch + Flash-Attention on the GPU
        run: |
          mkdir -p "${RUNNER_TEMP}/scratch"
          docker run --rm \
            --device=/dev/kfd --device=/dev/dri \
            --group-add video --group-add render \
            --security-opt seccomp=unconfined \
            -v "${RUNNER_TEMP}/scratch:/scratch" \
            transformers-gfx1151:ci \
            python3 - <<'PY'
          import torch
          print("torch      :", torch.__version__)
          print("torch.hip  :", torch.version.hip)
          assert torch.cuda.is_available(), "no ROCm GPU visible inside the container"
          print("device     :", torch.cuda.get_device_name(0))

          # A real GPU op -- proves the gfx1151 kernels are actually there.
          x = torch.randn(2048, 2048, device="cuda", dtype=torch.float16)
          torch.cuda.synchronize()
          print("matmul sum :", float((x @ x).sum()))

          import flash_attn
          from flash_attn import flash_attn_func
          print("flash_attn :", flash_attn.__version__)
          q = torch.randn(1, 256, 8, 64, device="cuda", dtype=torch.float16)
          out = flash_attn_func(q, q, q)
          torch.cuda.synchronize()
          print("FA out     :", tuple(out.shape))
          print("ALL GOOD")
          PY

      - name: Run a tiny transformers test slice (optional signal)
        continue-on-error: true
        run: |
          docker run --rm \
            --device=/dev/kfd --device=/dev/dri \
            --group-add video --group-add render \
            --security-opt seccomp=unconfined \
            -v "${RUNNER_TEMP}/scratch:/scratch" \
            transformers-gfx1151:ci \
            bash -c "cd /transformers && python3 -m pytest -q tests/utils/test_modeling_utils.py -x || true"
