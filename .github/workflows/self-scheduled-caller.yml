name: Nvidia CI

on:
  repository_dispatch:
  schedule:
    - cron: "17 2 * * *"
  push:
    branches:
      - default-kernels-ydshieh
  workflow_dispatch:
    inputs:
      prev_workflow_run_id:
        description: 'previous workflow run id to compare'
        type: string
        required: false
        default: ""
      other_workflow_run_id:
        description: 'other workflow run id to compare'
        type: string
        required: false
        default: ""


# Used for `push` to easily modify the target workflow runs to compare against
env:
    prev_workflow_run_id: "30972202198"
    other_workflow_run_id: ""


permissions:
  contents: read

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-22.04
    steps:
      - name: Setup
        env:
          prev_workflow_run_id: ${{ inputs.prev_workflow_run_id || env.prev_workflow_run_id }}
          other_workflow_run_id: ${{ inputs.other_workflow_run_id || env.other_workflow_run_id }}
        run: |
          mkdir "setup_values"
          echo "$prev_workflow_run_id" > "setup_values/prev_workflow_run_id.txt"
          echo "$other_workflow_run_id" > "setup_values/other_workflow_run_id.txt"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: setup_values
          path: setup_values

  model-ci:
    name: Model CI
    uses: huggingface/transformers-ci/.github/workflows/daily-ci_reusable.yml@main
    with:
      job: run_models_gpu
      slack_report_channel: "#transformers-ci-dummy"
      docker: huggingface/transformers-all-latest-gpu:dev
      ci_event: Daily CI
      runner_type: "a10"
      report_repo_id: hf-internal-testing/transformers_daily_ci
      commit_sha: ${{ github.sha }}
    secrets: inherit

  torch-pipeline:
    name: Torch pipeline CI
    uses: huggingface/transformers-ci/.github/workflows/daily-ci_reusable.yml@main
    with:
      job: run_pipelines_torch_gpu
      slack_report_channel: "#transformers-ci-dummy"
      docker: huggingface/transformers-all-latest-gpu:dev
      ci_event: Daily CI
      report_repo_id: hf-internal-testing/transformers_daily_ci
      commit_sha: ${{ github.sha }}
    secrets: inherit

  example-ci:
    name: Example CI
    uses: huggingface/transformers-ci/.github/workflows/daily-ci_reusable.yml@main
    with:
      job: run_examples_gpu
      slack_report_channel: "#transformers-ci-dummy"
      docker: huggingface/transformers-all-latest-gpu:dev
      ci_event: Daily CI
      report_repo_id: hf-internal-testing/transformers_daily_ci
      commit_sha: ${{ github.sha }}
    secrets: inherit

  trainer-fsdp-ci:
    name: Trainer/FSDP CI
    uses: huggingface/transformers-ci/.github/workflows/daily-ci_reusable.yml@main
    with:
      job: run_trainer_and_fsdp_gpu
      slack_report_channel: "#transformers-ci-dummy"
      docker: huggingface/transformers-all-latest-gpu:dev
      runner_type: "a10"
      ci_event: Daily CI
      report_repo_id: hf-internal-testing/transformers_daily_ci
      commit_sha: ${{ github.sha }}
    secrets: inherit

  quantization-ci:
    name: Quantization CI
    uses: huggingface/transformers-ci/.github/workflows/daily-ci_reusable.yml@main
    with:
      job: run_quantization_torch_gpu
      slack_report_channel: "#transformers-ci-dummy"
      docker: huggingface/transformers-quantization-latest-gpu:dev
      ci_event: Daily CI
      report_repo_id: hf-internal-testing/transformers_daily_ci
      commit_sha: ${{ github.sha }}
    secrets: inherit

  kernels-ci:
    name: Kernels CI
    uses: huggingface/transformers-ci/.github/workflows/daily-ci_reusable.yml@main
    with:
      job: run_kernels_gpu
      slack_report_channel: "#transformers-ci-dummy"
      docker: huggingface/transformers-all-latest-gpu:dev
      ci_event: Daily CI
      report_repo_id: hf-internal-testing/transformers_daily_ci
      commit_sha: ${{ github.sha }}
    secrets: inherit
