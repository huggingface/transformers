name: Nvidia CI

on:
  repository_dispatch:
  schedule:
    - cron: "17 2 * * *"
  push:
    branches:
      - re-run-2026-09-12-daily-ci-workflow-run-df04b012
  workflow_dispatch:
    inputs:
      prev_workflow_run_id:
        description: 'previous workflow run id to compare'
        type: string
        required: false
        default: ""
      other_workflow_run_id:
        description: 'other workflow run id to compare'
        type: string
        required: false
        default: ""


# Used for `push` to easily modify the target workflow runs to compare against
env:
    prev_workflow_run_id: "34799926086"
    other_workflow_run_id: ""


permissions:
  contents: read

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-22.04
    steps:
      - name: Setup
        env:
          prev_workflow_run_id: ${{ inputs.prev_workflow_run_id || env.prev_workflow_run_id }}
          other_workflow_run_id: ${{ inputs.other_workflow_run_id || env.other_workflow_run_id }}
        run: |
          mkdir "setup_values"
          echo "$prev_workflow_run_id" > "setup_values/prev_workflow_run_id.txt"
          echo "$other_workflow_run_id" > "setup_values/other_workflow_run_id.txt"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: setup_values
          path: setup_values

  model-ci:
    name: Model CI
    uses: huggingface/transformers-ci/.github/workflows/daily-ci_reusable.yml@main
    with:
      job: run_models_gpu
      slack_report_channel: "#transformers-ci-daily-models"
      docker: huggingface/transformers-all-latest-gpu
      ci_event: Daily CI
      runner_type: "a10"
      report_repo_id: hf-internal-testing/transformers_daily_ci
      commit_sha: ${{ github.sha }}
      subdirs: '["bert_generation", "cohere2_vision", "cohere_asr", "colpali", "glm4v_moe", "hunyuan_v1_moe", "hunyuan_vl", "hy_v3", "hy_v4", "hyperclovax", "hyperclovax_vision_v2", "lfm2_vl", "lighton_ocr", "llama", "qwen3_5", "qwen3_5_moe", "rf_detr", "rwkv"]'
    secrets: inherit

  # --- hf-mount bucket cache benchmark (test-only, not part of the real daily CI) ---
  # Same model list as model-ci above (one slice, no splitting needed at this size)
  # on 4 runner groups that differ only in HF_HOME's backing PVC, to isolate the
  # cache backend as the only variable:
  #   aws-g5-*-efs-test    -> EFS (today's hfCache, baseline)
  #   aws-g5-*-hf-test     -> hf-mount-mounted HF Storage Bucket (glegendre/hf-cache)
  # No runner_type/report_repo_id -> collated_reports/Slack/dataset upload are skipped,
  # so this doesn't touch real CI reporting. See infra/projects/kube-runners/06-eks-utils
  # (hf_csi_driver.tf, hf_bucket_cache_test.tf) and 10-github-runners/config/
  # 05-runners-ci-aws-use1-public-80.yaml for the runner-side setup.
  model-ci-cache-test-4xl-efs:
    name: Model CI (cache test, 4xlarge, EFS baseline)
    uses: huggingface/transformers-ci/.github/workflows/daily-ci_reusable_model_job.yml@main
    with:
      folder_slices: '[["models/bert_generation", "models/cohere2_vision", "models/cohere_asr", "models/colpali", "models/glm4v_moe", "models/hunyuan_v1_moe", "models/hunyuan_vl", "models/hy_v3", "models/hy_v4", "models/hyperclovax", "models/hyperclovax_vision_v2", "models/lfm2_vl", "models/lighton_ocr", "models/llama", "models/qwen3_5", "models/qwen3_5_moe", "models/rf_detr", "models/rwkv"]]'
      machine_type: aws-g5-4xl-efs-test
      slice_id: 0
      docker: huggingface/transformers-all-latest-gpu
      commit_sha: ${{ github.sha }}
      report_name_prefix: run_models_gpu_cache_test
    secrets: inherit

  model-ci-cache-test-4xl-hfmount:
    name: Model CI (cache test, 4xlarge, hf-mount bucket)
    uses: huggingface/transformers-ci/.github/workflows/daily-ci_reusable_model_job.yml@main
    with:
      folder_slices: '[["models/bert_generation", "models/cohere2_vision", "models/cohere_asr", "models/colpali", "models/glm4v_moe", "models/hunyuan_v1_moe", "models/hunyuan_vl", "models/hy_v3", "models/hy_v4", "models/hyperclovax", "models/hyperclovax_vision_v2", "models/lfm2_vl", "models/lighton_ocr", "models/llama", "models/qwen3_5", "models/qwen3_5_moe", "models/rf_detr", "models/rwkv"]]'
      machine_type: aws-g5-4xl-hf-test
      slice_id: 0
      docker: huggingface/transformers-all-latest-gpu
      commit_sha: ${{ github.sha }}
      report_name_prefix: run_models_gpu_cache_test
    secrets: inherit

  model-ci-cache-test-12xl-efs:
    name: Model CI (cache test, 12xlarge, EFS baseline)
    uses: huggingface/transformers-ci/.github/workflows/daily-ci_reusable_model_job.yml@main
    with:
      folder_slices: '[["models/bert_generation", "models/cohere2_vision", "models/cohere_asr", "models/colpali", "models/glm4v_moe", "models/hunyuan_v1_moe", "models/hunyuan_vl", "models/hy_v3", "models/hy_v4", "models/hyperclovax", "models/hyperclovax_vision_v2", "models/lfm2_vl", "models/lighton_ocr", "models/llama", "models/qwen3_5", "models/qwen3_5_moe", "models/rf_detr", "models/rwkv"]]'
      machine_type: aws-g5-12xl-efs-test
      slice_id: 0
      docker: huggingface/transformers-all-latest-gpu
      commit_sha: ${{ github.sha }}
      report_name_prefix: run_models_gpu_cache_test
    secrets: inherit

  model-ci-cache-test-12xl-hfmount:
    name: Model CI (cache test, 12xlarge, hf-mount bucket)
    uses: huggingface/transformers-ci/.github/workflows/daily-ci_reusable_model_job.yml@main
    with:
      folder_slices: '[["models/bert_generation", "models/cohere2_vision", "models/cohere_asr", "models/colpali", "models/glm4v_moe", "models/hunyuan_v1_moe", "models/hunyuan_vl", "models/hy_v3", "models/hy_v4", "models/hyperclovax", "models/hyperclovax_vision_v2", "models/lfm2_vl", "models/lighton_ocr", "models/llama", "models/qwen3_5", "models/qwen3_5_moe", "models/rf_detr", "models/rwkv"]]'
      machine_type: aws-g5-12xl-hf-test
      slice_id: 0
      docker: huggingface/transformers-all-latest-gpu
      commit_sha: ${{ github.sha }}
      report_name_prefix: run_models_gpu_cache_test
    secrets: inherit

