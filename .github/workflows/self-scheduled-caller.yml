name: Nvidia CI

on:
  repository_dispatch:
  schedule:
    - cron: "17 2 * * *"
  push:
    branches:
      - test-kernels-ci-full
  workflow_dispatch:
    inputs:
      prev_workflow_run_id:
        description: 'previous workflow run id to compare'
        type: string
        required: false
        default: ""
      other_workflow_run_id:
        description: 'other workflow run id to compare'
        type: string
        required: false
        default: ""


# Used for `push` to easily modify the target workflow runs to compare against
env:
    prev_workflow_run_id: "37876159550"
    other_workflow_run_id: ""


permissions:
  contents: read

jobs:
  setup:
    permissions: {}
    name: Setup
    runs-on: ubuntu-22.04
    steps:
      - name: Setup
        env:
          prev_workflow_run_id: ${{ inputs.prev_workflow_run_id || env.prev_workflow_run_id }}
          other_workflow_run_id: ${{ inputs.other_workflow_run_id || env.other_workflow_run_id }}
        run: |
          mkdir "setup_values"
          echo "$prev_workflow_run_id" > "setup_values/prev_workflow_run_id.txt"
          echo "$other_workflow_run_id" > "setup_values/other_workflow_run_id.txt"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: setup_values
          path: setup_values

  model-ci:
    name: Model CI
    uses: huggingface/transformers-ci/.github/workflows/daily-ci_reusable.yml@test-kernels-ci-full-bucket-cache
    with:
      job: run_models_gpu
      slack_report_channel: "#transformers-ci-dummy"
      docker: huggingface/transformers-all-latest-gpu
      ci_event: Daily CI
      runner_type: "a10"
      subdirs: "['models/auto', 'models/bert', 'models/gpt2', 'models/t5', 'models/modernbert', 'models/vit', 'models/clip', 'models/detr', 'models/table_transformer', 'models/got_ocr2', 'models/whisper', 'models/wav2vec2', 'models/qwen2_audio', 'models/speecht5', 'models/csm', 'models/llama', 'models/gemma3', 'models/qwen2', 'models/mistral3', 'models/qwen2_5_vl', 'models/llava', 'models/smolvlm', 'models/internvl', 'models/gemma3n', 'models/gpt_oss', 'models/qwen2_5_omni', 'models/pi0']"
      report_repo_id: hf-internal-testing/transformers_daily_ci
      commit_sha: ${{ github.sha }}
    secrets: inherit
