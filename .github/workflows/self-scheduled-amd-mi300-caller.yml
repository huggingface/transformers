name: Self-hosted runner scale set (AMD mi300 scheduled CI caller)

# Note: For every job in this workflow, the name of the runner scale set is finalized in the runner yaml i.e. huggingface/hf-workflows/.github/workflows/transformers_amd_ci_scheduled_arc_scale_set.yaml
# For example, 1gpu scale set: amd-mi300-ci-1gpu
#              2gpu scale set: amd-mi300-ci-2gpu
# Important: Do not pin the reusable workflow ref to a SHA. AMD runner groups only route jobs for
# workflows referenced at @main; a pinned SHA causes jobs to wait for a runner until the 24h timeout.

on:
  workflow_run:
    workflows: ["Self-hosted runner (AMD scheduled CI caller)"]
    branches: ["main"]
    types: [completed]
  push:
    branches:
      - run_amd_scheduled_ci_caller_rocm10
  workflow_dispatch:
    inputs:
      prev_workflow_run_id:
        description: 'previous workflow run id to compare'
        type: string
        required: false
        default: ""
      other_workflow_run_id:
        description: 'other workflow run id to compare'
        type: string
        required: false
        default: ""


# Used for `push` to easily modify the target workflow runs to compare against
env:
    prev_workflow_run_id: ""
    other_workflow_run_id: ""


permissions:
  contents: read

jobs:
  setup:
    permissions: {}
    name: Setup
    runs-on: ubuntu-22.04
    steps:
      - name: Setup
        env:
          prev_workflow_run_id: ${{ inputs.prev_workflow_run_id || env.prev_workflow_run_id }}
          other_workflow_run_id: ${{ inputs.other_workflow_run_id || env.other_workflow_run_id }}
        run: |
          mkdir "setup_values"
          echo "$prev_workflow_run_id" > "setup_values/prev_workflow_run_id.txt"
          echo "$other_workflow_run_id" > "setup_values/other_workflow_run_id.txt"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: setup_values
          path: setup_values

  model-ci:
    name: Model CI
    uses: huggingface/hf-workflows/.github/workflows/transformers_amd_ci_scheduled_arc_scale_set.yaml@main
    with:
      job: run_models_gpu
      # rocm10 image test: no Slack report / no report dataset upload (non-existent channel, empty repo id)
      slack_report_channel: "#no-report-rocm10-test"
      runner_group: amd-mi300
      docker: huggingface/transformers-pytorch-amd-gpu:rocm10-test
      ci_event: Scheduled CI (AMD) - mi300 rocm10 test
      report_repo_id: ""
      env_file: /etc/podinfo/gha-gpu-isolation-settings
      commit_sha: ${{ github.event.workflow_run.head_sha || github.sha }}
      subdirs: '["auto", "bert", "gpt2", "t5", "modernbert", "vit", "clip", "detr", "table_transformer", "got_ocr2", "whisper", "wav2vec2", "qwen2_audio", "speech_t5", "csm", "llama", "gemma3", "qwen2", "mistral3", "qwen2_5_vl", "llava", "smolvlm", "internvl", "gemma3n", "gpt_oss", "qwen2_5_omni", "pi0"]'
    secrets: inherit
