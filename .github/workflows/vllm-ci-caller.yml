name: vLLM Integration Tests

on:
  schedule:
    # Run every night at 3 AM UTC
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - vllm_ci*

env:
  VLLM_TARGET_DEVICE: cpu
  # KV cache size (GiB) for vLLM's CPU backend, read by vllm/platforms/cpu.py. Replaces patching the
  # gpu_memory_utilization default in vLLM's source with sed, which silently stopped matching when vLLM
  # changed that code (vllm-project/vllm#56492), so vLLM fell back to reserving 92% of the NUMA node.
  VLLM_CPU_KVCACHE_SPACE: 32
  HF_HOME: /mnt/cache


permissions: {}

jobs:
  # The vLLM commit tested by all the CPU jobs: the latest vLLM commit with a built CPU wheel (nightly), found once (each job
  # used to look it up when it started, so a wheel published during the run made jobs test different vLLM commits), and
  # its date. Both are shown in the report (`vllm-ci-report`).
  find-vllm-commit:
    name: Find the vLLM commit to test
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      vllm_commit: ${{ steps.find-vllm-commit.outputs.vllm_commit }}
      vllm_commit_date: ${{ steps.vllm-commit-date.outputs.vllm_commit_date }}
    steps:
      - name: Find latest vLLM commit with built CPU wheel
        id: find-vllm-commit
        run: |
          METADATA=$(curl -fsSL https://wheels.vllm.ai/nightly/cpu/vllm/metadata.json)
          # path field is like '../../../{full_commit_hash}/{wheel_filename}' relative to nightly/cpu/vllm/
          VLLM_COMMIT=$(echo "$METADATA" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          wheel = next(w for w in data if 'x86_64' in w['platform_tag'])
          print(wheel['path'].split('/')[3])
          ")
          if [[ ! "$VLLM_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: VLLM_COMMIT is not a valid 40-char hex commit hash: $VLLM_COMMIT" >&2
            exit 1
          fi
          echo "vllm_commit=$VLLM_COMMIT" >> "$GITHUB_OUTPUT"
          echo "vLLM commit: $VLLM_COMMIT"

      - name: Get vLLM commit date
        id: vllm-commit-date
        env:
          VLLM_COMMIT: ${{ steps.find-vllm-commit.outputs.vllm_commit }}
        run: |
          # Only the commit itself (no checkout): its date, shown in the report.
          git init -q vllm
          git -C vllm fetch -q --depth 1 https://github.com/vllm-project/vllm "$VLLM_COMMIT" || true
          VLLM_COMMIT_DATE=$(TZ=UTC git -C vllm log -1 --format=%cd --date=format-local:'%Y/%m/%d %H:%M:%S UTC' FETCH_HEAD || true)
          echo "vllm_commit_date=$VLLM_COMMIT_DATE" >> "$GITHUB_OUTPUT"
          echo "vLLM commit date: $VLLM_COMMIT_DATE"

  vllm-test-examples:
    permissions:
      contents: read
    name: Test vLLM examples and weight mapping
    needs: find-vllm-commit
    # aws-m8i-8xl-cache (128 GiB): needed for sufficient RAM and for the writable
    # shared cache mount (/mnt/cache). The 2xl runner has the same mount read-only.
    runs-on:
      group: aws-m8i-8xl-cache
    container:
      image: huggingface/transformers-torch-light
      options: "--shm-size=16gb -v /mnt/cache/.cache/huggingface:/mnt/cache/"
    env:
      HF_TOKEN: ${{ secrets.HF_HUB_READ_TOKEN }}

    steps:
      - name: Checkout Transformers
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: huggingface/transformers
          persist-credentials: false
          path: transformers

      - name: Set up vLLM, transformers and the test dependencies
        uses: ./transformers/.github/actions/vllm-ci-setup
        with:
          vllm-commit: ${{ needs.find-vllm-commit.outputs.vllm_commit }}
          extra-packages: open-clip-torch==2.32.0 albumentations==1.4.6

      - name: System info
        run: |
          echo "=== CPU ===" && lscpu | grep -E "^CPU\(s\)|^Model name|^Socket"
          echo "=== Memory ===" && free -h
          echo "=== Disk ===" && df -h
          echo "=== Top processes by memory ===" && ps aux --sort=-%mem | head -20

      - name: "Test: test_mapping"
        if: always()
        working-directory: vllm
        run: pytest -v -s tests/models/multimodal/test_mapping.py

      - name: "Example: chat"
        if: always()
        working-directory: vllm
        run: python3 examples/basic/offline_inference/chat.py

      - name: "Example: vision language"
        if: always()
        working-directory: vllm
        run: python3 examples/generate/multimodal/vision_language_offline.py --model-type qwen2_5_vl

      - name: "Example: audio language (whisper)"
        if: always()
        working-directory: vllm
        run: VLLM_WORKER_MULTIPROC_METHOD=spawn python3 examples/generate/multimodal/audio_language_offline.py --model-type whisper

  # Mirrors vLLM's Buildkite CI: test_can_initialize_small_subset only.
  # See .buildkite/test_areas/models_basic.yaml in vllm-project/vllm.
  vllm-test-init:
    permissions:
      contents: read
    # The 2xl runner might have sufficient RAM for this small subset (excluding Gemma3n),
    # but we use 8xl anyway in case we add a few larger tests in the future, and to avoid
    # the read-only shared cache mount issue on the 2xl runner.
    name: "Test vLLM initialization (small subset, shard ${{ matrix.shard }} / 4)"
    needs: find-vllm-commit
    runs-on:
      group: aws-m8i-8xl-cache
    container:
      image: huggingface/transformers-torch-light
      options: "--shm-size=16gb -v /mnt/cache/.cache/huggingface:/mnt/cache/"
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      HF_TOKEN: ${{ secrets.HF_HUB_READ_TOKEN }}
      SHARD_ID: ${{ matrix.shard }}

    steps:
      - name: Checkout Transformers
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: huggingface/transformers
          persist-credentials: false
          path: transformers

      - name: Set up vLLM, transformers and the test dependencies
        uses: ./transformers/.github/actions/vllm-ci-setup
        with:
          vllm-commit: ${{ needs.find-vllm-commit.outputs.vllm_commit }}
          extra-packages: pytest-shard open-clip-torch==2.32.0 albumentations==1.4.6

      - name: "Test: test_initialization (small subset, shard ${{ matrix.shard }} / 4)"
        working-directory: vllm
        run: |
          # Gemma3nForCausalLM hangs indefinitely waiting for shared memory broadcast:
          # "No available shared memory broadcast block found in 60 seconds" (shm_broadcast.py).
          pytest -v -s tests/models/test_initialization.py::test_can_initialize_small_subset \
            --num-shards=4 --shard-id=$SHARD_ID \
            --deselect 'tests/models/test_initialization.py::test_can_initialize_small_subset[Gemma3nForCausalLM]'

  vllm-test-transformers:
    permissions:
      contents: read
    # aws-m8i-8xl-cache: sufficient RAM + writable shared cache mount (2xl is read-only).
    name: "Test vLLM transformers backend (shard ${{ matrix.shard }} / 4)"
    needs: find-vllm-commit
    runs-on:
      group: aws-m8i-8xl-cache
    container:
      image: huggingface/transformers-torch-light
      options: "--shm-size=16gb -v /mnt/cache/.cache/huggingface:/mnt/cache/"
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      HF_TOKEN: ${{ secrets.HF_HUB_READ_TOKEN }}
      SHARD_ID: ${{ matrix.shard }}

    steps:
      - name: Checkout Transformers
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: huggingface/transformers
          persist-credentials: false
          path: transformers

      - name: Set up vLLM, transformers and the test dependencies
        uses: ./transformers/.github/actions/vllm-ci-setup
        with:
          vllm-commit: ${{ needs.find-vllm-commit.outputs.vllm_commit }}
          extra-packages: pytest-shard sentence-transformers open-clip-torch==2.32.0 albumentations==1.4.6

      - name: System info
        run: |
          echo "=== CPU ===" && lscpu | grep -E "^CPU\(s\)|^Model name|^Socket"
          echo "=== Memory ===" && free -h
          echo "=== Disk ===" && df -h

      - name: Prepare HF memory budget plugin
        # vLLM's test run doesn't load transformers' root conftest.py, so apply the same psutil cap here
        # (loaded below via `pytest -p hf_ci_memory`).
        run: |
          cat > /tmp/hf_ci_memory.py << 'EOF'
          import math

          import psutil

          from transformers.testing_utils import get_cpu_ram_total_gib, patch_psutil_cpu_memory


          before = psutil.virtual_memory().total / 1024**3
          limit = get_cpu_ram_total_gib()
          if not math.isinf(limit):
              patch_psutil_cpu_memory(int(limit * 1024**3))
          after = psutil.virtual_memory().total / 1024**3
          print(f"[HF memory patch] psutil total: {before:.1f} GiB -> {after:.1f} GiB", flush=True)
          EOF

      - name: "Test: test_transformers (shard ${{ matrix.shard }} / 4)"
        working-directory: vllm
        env:
          PYTHONPATH: /tmp
        run: |
          # test_mtp_draft_loads_mtp_weights and test_mtp_draft_for_multimodal_model need a GPU ("Cannot access accelerator
          # device when none is available"; vLLM runs test_backend.py on GPU only)
          pytest -p hf_ci_memory -v -s tests/models/transformers/ \
            --num-shards=4 --shard-id=$SHARD_ID \
            --deselect tests/models/transformers/test_backend.py::test_mtp_draft_loads_mtp_weights \
            --deselect tests/models/transformers/test_backend.py::test_mtp_draft_for_multimodal_model

  # NOTE: This job was created to verify that the two mamba_mixer CPU bugs patched in
  # vllm-test-init (conv1d weight 2D→3D, out_proj transpose non-contiguous) are indeed
  # CPU-specific and pass on GPU without any patches.
  # However, vLLM's compiled C extension `vllm._C_stable_libtorch` fails to load in the
  # huggingface/transformers-all-latest-gpu container (torch 2.13.0+cu130): the .so IS
  # present in the wheel but dlopen() fails due to an ABI/shared-library mismatch between
  # the torch version vllm was compiled against and the one in the container. Python then
  # surfaces this as ModuleNotFoundError, making vllm unimportable. We did not invest
  # further in resolving this (would need a dedicated vLLM GPU docker or pinned torch),
  # so the job is disabled for now. It only targeted FalconMambaForCausalLM for debugging;
  # it was never intended to run the full test suite like the CPU vllm-test-init job.
  vllm-test-init-gpu:
    permissions:
      contents: read
    if: false
    name: "Test vLLM initialization on GPU (FalconMambaForCausalLM only)"
    runs-on:
      group: aws-g5-4xlarge-cache
    container:
      image: huggingface/transformers-all-latest-gpu
      options: "--gpus all --shm-size=16gb --ipc host -v /mnt/cache/.cache/huggingface:/mnt/cache/"
    env:
      HF_HOME: /mnt/cache
      HF_TOKEN: ${{ secrets.HF_HUB_READ_TOKEN }}
      VLLM_TARGET_DEVICE: ""  # override workflow-level cpu setting

    steps:
      - name: Update transformers clone
        working-directory: /transformers
        env:
          commit_sha: ${{ github.sha }}
        run: |
          git fetch origin "$commit_sha" && git checkout "$commit_sha"

      - name: Reinstall transformers in edit mode
        working-directory: /transformers
        run: python3 -m pip uninstall -y transformers && python3 -m pip install -e .

      - name: Find latest vLLM commit with built CUDA 13.0 wheel
        shell: bash
        run: |
          VLLM_COMMIT=$(python3 -c "
          import json, urllib.request
          data = json.loads(urllib.request.urlopen('https://wheels.vllm.ai/nightly/cu130/vllm/metadata.json').read())
          wheel = next(w for w in data if 'x86_64' in w['platform_tag'])
          print(wheel['path'].split('/')[3])
          ")
          if [[ ! "$VLLM_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: VLLM_COMMIT is not a valid 40-char hex commit hash: $VLLM_COMMIT" >&2
            exit 1
          fi
          echo "VLLM_COMMIT=$VLLM_COMMIT" >> $GITHUB_ENV
          echo "vLLM commit: $VLLM_COMMIT"

      - name: Checkout vLLM at wheel commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: vllm-project/vllm
          ref: ${{ env.VLLM_COMMIT }}
          persist-credentials: false
          path: vllm

      - name: Install vLLM and test dependencies
        run: python3 -m pip install vllm pytest pytest-shard cloudpickle tblib

      - name: Pip freeze
        run: pip freeze

      - name: "Test: test_initialization (GPU, FalconMambaForCausalLM only)"
        shell: bash
        working-directory: vllm
        run: |
          pytest -v -s tests/models/test_initialization.py \
            -k FalconMambaForCausalLM \
            --num-shards=1 --shard-id=0

  # Multimodal processing tests split across 4 parallel shards (this test takes a long time).
  # Mirrors vLLM's Buildkite CI: parallelism: 4 + pytest-shard (see .buildkite/test_areas/models_multimodal.yaml).
  vllm-test-multimodal-processing:
    permissions:
      contents: read
    # aws-m8i-8xl-cache: sufficient RAM + writable shared cache mount (2xl is read-only).
    name: "Test vLLM multimodal processing (shard ${{ matrix.shard }} / 4)"
    needs: find-vllm-commit
    runs-on:
      group: aws-m8i-8xl-cache
    container:
      image: huggingface/transformers-torch-light
      options: "--shm-size=16gb -v /mnt/cache/.cache/huggingface:/mnt/cache/"
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      HF_TOKEN: ${{ secrets.HF_HUB_READ_TOKEN }}
      SHARD_ID: ${{ matrix.shard }}

    steps:
      - name: Checkout Transformers
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: huggingface/transformers
          persist-credentials: false
          path: transformers

      - name: Set up vLLM, transformers and the test dependencies
        uses: ./transformers/.github/actions/vllm-ci-setup
        with:
          vllm-commit: ${{ needs.find-vllm-commit.outputs.vllm_commit }}
          # kaldi-native-fbank: required by the FireRedASR2 processor tests (listed in vLLM's requirements/test/cpu.txt)
          extra-packages: pytest-shard open-clip-torch==2.32.0 albumentations==1.4.6 kaldi-native-fbank

      - name: "Test: multimodal processing (shard ${{ matrix.shard }} / 4)"
        working-directory: vllm
        run: |
          # test_tensor_schema.py is run separately on GPU in vLLM's CI
          pytest -v -s tests/models/multimodal/processing/ \
            --ignore tests/models/multimodal/processing/test_tensor_schema.py \
            --num-shards=4 --shard-id=$SHARD_ID

  # vLLM's layers on top of transformers that the other jobs don't exercise: importing every model module,
  # tokenizers, chat templates and config loading. Only the test files that use transformers objects (most are
  # pure Python: config / tokenizer downloads, no model forward). vLLM's own CI pins the latest transformers
  # release and doesn't run `tests/tokenizers_` / `tests/transformers_utils` at all (commented out in its
  # `.buildkite/test_areas/misc.yaml`).
  vllm-test-tokenizers-configs:
    permissions:
      contents: read
    # aws-m8i-8xl-cache: sufficient RAM + writable shared cache mount (2xl is read-only).
    name: "Test vLLM tokenizers, chat templates and configs"
    needs: find-vllm-commit
    runs-on:
      group: aws-m8i-8xl-cache
    container:
      image: huggingface/transformers-torch-light
      options: "--shm-size=16gb -v /mnt/cache/.cache/huggingface:/mnt/cache/"
    env:
      HF_TOKEN: ${{ secrets.HF_HUB_READ_TOKEN }}

    steps:
      - name: Checkout Transformers
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: huggingface/transformers
          persist-credentials: false
          path: transformers

      - name: Set up vLLM, transformers and the test dependencies
        uses: ./transformers/.github/actions/vllm-ci-setup
        with:
          vllm-commit: ${{ needs.find-vllm-commit.outputs.vllm_commit }}
          # pytest-asyncio: async tests in tests/renderers (listed in vLLM's requirements/test/cuda.in)
          extra-packages: pytest-asyncio

      # One pytest run per area, so that a collection error (e.g. an import error after a transformers change)
      # in one area doesn't stop the others. The report sums the test counts of all pytest runs in the job.
      - name: "Test: model imports"
        if: ${{ !cancelled() }}
        working-directory: vllm
        run: |
          # Imports every registered model module (most import transformers at module level).
          # MistralLarge4*: its module raises NotImplementedError on non-GPU platforms (vLLM runs this test on GPU only).
          pytest -v -s tests/models/test_registry.py::test_registry_imports \
            --deselect 'tests/models/test_registry.py::test_registry_imports[MistralLarge4ForCausalLM]' \
            --deselect 'tests/models/test_registry.py::test_registry_imports[MistralLarge4DSparkModel]'

      - name: "Test: tokenizers and chat templates"
        if: ${{ !cancelled() }}
        working-directory: vllm
        run: |
          # Not included: tokenizers_/test_deepseek_v4*.py and test_mistral.py (vLLM's own tokenizers / mistral_common),
          # and the renderers tests that don't use transformers objects.
          pytest -v -s \
            tests/tokenizers_/test_hf.py \
            tests/tokenizers_/test_basic.py \
            tests/tokenizers_/test_detokenize.py \
            tests/tokenizers_/test_registry.py \
            tests/renderers/test_hf.py \
            tests/renderers/test_kimi_k3.py \
            tests/renderers/test_token_offsets.py \
            tests/renderers/test_tokenizer_pool.py \
            tests/renderers/test_numpy_embedding_byteorder.py \
            tests/renderers/chat_utils/test_prompt_embeds.py

      - name: "Test: configs"
        if: ${{ !cancelled() }}
        working-directory: vllm
        run: |
          # Not included: transformers_utils/test_utils.py and test_repo_utils.py (Hub mocked), and the tests/config
          # files that don't use transformers objects. test_ray_runtime_env tests vLLM's Ray integration.
          pytest -v -s \
            tests/transformers_utils/ \
            --ignore tests/transformers_utils/test_utils.py \
            --ignore tests/transformers_utils/test_repo_utils.py \
            tests/config/test_model_arch_config.py \
            tests/config/test_config_generation.py \
            tests/config/test_bailing_mtp_config.py \
            tests/config/test_step5_mtp_config.py \
            tests/config/test_speculative_draft_*.py \
            --deselect tests/config/test_config_generation.py::test_ray_runtime_env

      - name: "Test: vLLM config from Hub configs"
        if: ${{ !cancelled() }}
        working-directory: vllm
        run: |
          # tests/test_config.py builds vLLM configs from real Hub configs, but it also tests vLLM's own parallelism /
          # scheduling / compilation settings, which don't involve transformers: those need Ray or expect GPU defaults
          # (vLLM runs this file on GPU only). Leave them out by name. In its own step, so that the `-k` filter
          # can't match tests in other files.
          pytest -v -s tests/test_config.py \
            -k "not (eplb or async_scheduling or all2all or vllm_config_defaults or ir_op_priority)"

  # vLLM vs transformers outputs: these tests run the same model in transformers (`hf_runner`) and in vLLM and compare
  # logprobs / embeddings / scores. Same selection as vLLM's own CPU CI (`.buildkite/hardware_tests/cpu.yaml`,
  # "CPU-Language Generation and Pooling Model Tests": the `cpu_model` tests), plus the CLIP / SigLIP pooling tests.
  vllm-test-hf-comparison:
    permissions:
      contents: read
    # aws-m8i-8xl-cache: sufficient RAM + writable shared cache mount (2xl is read-only).
    name: "Test vLLM vs transformers outputs (shard ${{ matrix.shard }} / 4)"
    needs: find-vllm-commit
    runs-on:
      group: aws-m8i-8xl-cache
    container:
      image: huggingface/transformers-torch-light
      options: "--shm-size=16gb -v /mnt/cache/.cache/huggingface:/mnt/cache/"
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      HF_TOKEN: ${{ secrets.HF_HUB_READ_TOKEN }}
      SHARD_ID: ${{ matrix.shard }}
      # Like vLLM's CPU CI (set by its run-cpu-test.sh): eager mode instead of inductor, no warmup.
      VLLM_CPU_CI_ENV: "1"
      # 16 GiB KV cache (like vLLM's CPU CI, run-cpu-test.sh) instead of the workflow's 32, for the 7-9B models of this job:
      # before starting, vLLM checks that the KV cache fits in the container's free memory (see `evict-page-cache` below).
      VLLM_CPU_KVCACHE_SPACE: 16

    steps:
      - name: Checkout Transformers
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: huggingface/transformers
          persist-credentials: false
          path: transformers

      - name: Set up vLLM, transformers and the test dependencies
        uses: ./transformers/.github/actions/vllm-ci-setup
        with:
          vllm-commit: ${{ needs.find-vllm-commit.outputs.vllm_commit }}
          # sentence-transformers: reference models of the pooling tests (tests/conftest.py)
          # mteb: the MTEB pooling test; peft: remote code of jina-embeddings-v5 (both listed in vLLM's requirements/test/cuda.in)
          # pytest-asyncio: the async tests of tests/entrypoints/pooling
          extra-packages: pytest-shard sentence-transformers mteb[bm25s]>=2,<3 peft pytest-asyncio
          # The 7-9B models of this job: drop the page cache of each test's model files after the test (vLLM's KV cache
          # memory check counts it as used memory)
          evict-page-cache: "true"

      - name: "Test: language models generation and pooling (shard ${{ matrix.shard }} / 4)"
        if: ${{ !cancelled() }}
        working-directory: vllm
        run: |
          # Not included from vLLM's CPU command: tests/v1/e2e/test_cpu_linear_attn_chunked_prefix.py (no transformers),
          # and test_prm_models_with_golden_outputs (vLLM's model vs stored golden values, no transformers reference;
          # its transformers comparison `test_prm_models` skips itself on CPU).
          pytest -v -s tests/models/language/generation tests/models/language/pooling \
            -m cpu_model --num-shards=4 --shard-id=$SHARD_ID \
            --deselect 'tests/models/language/pooling/test_reward.py::test_prm_models_with_golden_outputs'

      # Only ~5 tests: run them all in shard 0 (with `--num-shards`, a shard could get no test, and pytest fails then).
      - name: "Test: CLIP / SigLIP pooling"
        if: ${{ !cancelled() && matrix.shard == 0 }}
        working-directory: vllm
        run: |
          # siglip2-giant-opt: vLLM's CPU attention kernel doesn't support its head_dim (72)
          # ("Unsupported CPU attention configuration: head_dim=72").
          pytest -v -s tests/models/multimodal/pooling/test_clip.py tests/models/multimodal/pooling/test_siglip.py \
            --deselect 'tests/models/multimodal/pooling/test_siglip.py::test_models[float-google/siglip2-giant-opt-patch16-384]'

      # A few small language models that vLLM doesn't mark `cpu_model` (same transformers comparison as above). In one shard
      # (only 3 models). The other models of this file run in "Test: other language models generation".
      - name: "Test: more language models generation"
        if: ${{ !cancelled() && matrix.shard == 1 }}
        working-directory: vllm
        run: |
          pytest -v -s tests/models/language/generation/test_common.py \
            -k "opt-350m or phi-2 or stablelm-3b"

      # HF `generate(num_beams=...)` vs vLLM's beam search. In one shard (only 1 test). Not included: the tests without a
      # transformers reference (e.g. test_beam_search_with_concurrency_limit compares vLLM with vLLM), and
      # test_beam_search_passes_multimodal_data (7B audio model; vLLM's CI excludes it too).
      - name: "Test: beam search"
        if: ${{ !cancelled() && matrix.shard == 3 }}
        working-directory: vllm
        run: |
          pytest -v -s tests/samplers/test_beam_search.py::test_beam_search_single_input

      # The other models of tests/models/language/generation/test_common.py that vLLM doesn't mark `cpu_model` (up to 8B),
      # and Mistral-7B (test_mistral.py), on 2 shards. Not included: MiniCPM4.1-8B and HyperCLOVAX-SEED-Think-14B
      # (`large_gpu_mark`: skip on CPU), chatglm3-6b (skips with transformers main: `max_transformers_version="4.48"` in
      # vLLM's tests/models/registry.py).
      - name: "Test: other language models generation (shard ${{ matrix.shard }} / 4)"
        if: ${{ !cancelled() && (matrix.shard == 1 || matrix.shard == 2) }}
        working-directory: vllm
        run: |
          case "$SHARD_ID" in
            1)
              pytest -v -s tests/models/language/generation/test_common.py tests/models/language/generation/test_mistral.py::test_models \
                -k "gpt2 or Qwen3-8B or Mistral-7B"
              ;;
            2)
              pytest -v -s tests/models/language/generation/test_common.py \
                -k "slovak-gpt-j-405M or tiny_starcoder_py or pythia-70m or starcoder2-3b or tiny-mixtral-30m or Apertus-8B or Domyn-Edge-Base"
              ;;
          esac

      # State-space / hybrid models (Zamba2, Granite 4.0, Falcon-H1, LFM2) vs transformers. In one shard. Not included:
      # - the tests of test_hybrid.py without a transformers reference (vLLM vs vLLM).
      # - Mamba, Falcon-Mamba, Jamba ("IndexError: Dimension out of range" in vLLM's `mamba_mixer` on CPU), Qwen3-Next ("No
      #   Unquantized MoE backend supports the deployment configuration" on CPU), test_zaya_cca_state (vLLM's engine fails to
      #   start on CPU): vLLM runs test_hybrid.py on GPU only.
      # - test_models[Zamba2-1.2B-instruct]: ~26 min on CPU (too slow); Zamba2 is still compared with transformers in
      #   test_full_cuda_graph and test_fp32_cache_state.
      - name: "Test: hybrid and state-space models"
        if: ${{ !cancelled() && matrix.shard == 3 }}
        working-directory: vllm
        run: |
          pytest -v -s \
            "tests/models/language/generation/test_hybrid.py::test_models[5-64-ibm-granite/granite-4.0-tiny-preview]" \
            "tests/models/language/generation/test_hybrid.py::test_models[5-64-tiiuae/Falcon-H1-0.5B-Base]" \
            "tests/models/language/generation/test_hybrid.py::test_models[5-64-LiquidAI/LFM2-1.2B]" \
            "tests/models/language/generation/test_hybrid.py::test_full_cuda_graph[5-64-Zyphra/Zamba2-1.2B-instruct]" \
            "tests/models/language/generation/test_hybrid.py::test_fp32_cache_state[mamba_ssm_cache_dtype-5-64-Zyphra/Zamba2-1.2B-instruct]" \
            "tests/models/language/generation/test_hybrid.py::test_fp32_cache_state[mamba_cache_dtype-5-64-Zyphra/Zamba2-1.2B-instruct]"

      # vLLM's OpenAI-compatible server / `LLM` pooling APIs (embeddings, scores) vs transformers, and the logprobs of the
      # V1 sampler vs transformers. Only the tests that compare with the transformers reference (`hf_model` fixture). In one
      # shard.
      - name: "Test: pooling API and logprobs"
        if: ${{ !cancelled() && matrix.shard == 0 }}
        working-directory: vllm
        run: |
          pytest -v -s \
            tests/entrypoints/pooling/embed/test_online.py::test_completion_request \
            tests/entrypoints/pooling/embed/test_online.py::test_completion_request_batched \
            tests/entrypoints/pooling/embed/test_online.py::test_base64_embedding \
            tests/entrypoints/pooling/embed/test_online_dimensions.py::test_matryoshka \
            tests/entrypoints/pooling/scoring/test_cross_encoder_offline.py::test_1_to_1 \
            tests/entrypoints/pooling/scoring/test_cross_encoder_offline.py::test_1_to_n \
            tests/entrypoints/pooling/scoring/test_cross_encoder_offline.py::test_n_to_n \
            tests/entrypoints/pooling/scoring/test_cross_encoder_online.py::test_score_api_queries_str_1_documents_str_1 \
            tests/entrypoints/pooling/scoring/test_cross_encoder_online.py::test_score_api_queries_str_1_documents_str_n \
            tests/entrypoints/pooling/scoring/test_cross_encoder_online.py::test_score_api_queries_str_n_documents_str_n \
            tests/entrypoints/pooling/scoring/test_cross_encoder_online.py::test_score_api_queries_vs_items \
            tests/entrypoints/pooling/scoring/test_cross_encoder_online.py::test_score_api_text_1_vs_text_2 \
            tests/entrypoints/pooling/scoring/test_cross_encoder_online.py::test_score_api_data_1_vs_data_2 \
            tests/v1/sample/test_logprobs.py::test_get_logprobs_and_prompt_logprobs

      # More pooling models / features vs transformers (`hf_runner`): token classification, multi-label classification,
      # chunked prefill, prefix caching (models up to ~1.5B). In one shard.
      - name: "Test: more language pooling models"
        if: ${{ !cancelled() && matrix.shard == 0 }}
        working-directory: vllm
        run: |
          # Not included:
          # - tests without a transformers reference (vLLM vs vLLM, or vLLM config checks): test_extract_hidden_states.py,
          #   test_pooler_config_init_behaviour.py, test_last_pool_score_chunked_prefill_matches_unchunked and
          #   test_non_causal_models.
          # - test_openai_privacy_filter: bf16 on CPU, 2 / 429 probabilities just above the test's tolerance (0.117 for
          #   atol=0.1); vLLM runs it on GPU.
          pytest -v -s \
            tests/models/language/pooling/test_token_classification.py \
            tests/models/language/pooling/test_multilabel_classification_support.py \
            tests/models/language/pooling/test_head_dtype.py \
            tests/models/language/pooling/test_all_pooling_plus_chunked_prefill.py \
            tests/models/language/pooling/test_auto_prefix_cache_support.py \
            --deselect tests/models/language/pooling/test_all_pooling_plus_chunked_prefill.py::test_last_pool_score_chunked_prefill_matches_unchunked \
            --deselect tests/models/language/pooling/test_auto_prefix_cache_support.py::test_non_causal_models \
            --deselect tests/models/language/pooling/test_token_classification.py::test_openai_privacy_filter

      # The tests / models of test_embedding.py and test_classification.py that vLLM doesn't mark `cpu_model` (the
      # `cpu_model` ones run in the step above), and multi-vector retrieval (bge-m3). In one shard.
      - name: "Test: more language embedding and classification models"
        if: ${{ !cancelled() && matrix.shard == 2 }}
        working-directory: vllm
        run: |
          # Not included: the 2 LFM2 tests of test_embedding.py (vLLM's model only, no transformers reference).
          pytest -v -s \
            tests/models/language/pooling/test_embedding.py \
            tests/models/language/pooling/test_classification.py \
            tests/models/language/pooling/test_multi_vector_retrieval.py \
            -m "not cpu_model" \
            --deselect tests/models/language/pooling/test_embedding.py::test_lfm2_bidirectional_conv_respects_sequence_boundaries \
            --deselect tests/models/language/pooling/test_embedding.py::test_lfm2_bidirectional_embeddings_are_batch_independent

      # MTEB score of vLLM vs sentence-transformers (transformers). Only jina-embeddings-v5-text-nano: the other models of
      # tests/models/language/pooling_mteb_test compare with a score stored in the test file (no transformers reference).
      # `model_info2` = jina-embeddings-v5-text-nano (3rd entry of EMBEDDING_MODELS). In one shard.
      - name: "Test: MTEB pooling (jina-embeddings-v5-text-nano)"
        if: ${{ !cancelled() && matrix.shard == 3 }}
        working-directory: vllm
        run: |
          pytest -v -s 'tests/models/language/pooling_mteb_test/test_jina.py::test_embed_models_mteb[model_info2]'

  # Multimodal generation with vLLM's Transformers modeling backend, compared with transformers (`hf_runner`): the
  # generation counterpart of `tests/models/transformers/` (run in `vllm-test-transformers`). One matrix entry per test
  # file (only ~12 tests in total, so `--num-shards` could leave a shard without tests).
  vllm-test-multimodal-generation:
    permissions:
      contents: read
    # aws-m8i-8xl-cache: sufficient RAM + writable shared cache mount (2xl is read-only).
    name: "Test vLLM Transformers backend multimodal generation (${{ matrix.modality }})"
    needs: find-vllm-commit
    runs-on:
      group: aws-m8i-8xl-cache
    container:
      image: huggingface/transformers-torch-light
      options: "--shm-size=16gb -v /mnt/cache/.cache/huggingface:/mnt/cache/"
    strategy:
      fail-fast: false
      matrix:
        modality: [image, video, audio, omni]
    env:
      HF_TOKEN: ${{ secrets.HF_HUB_READ_TOKEN }}
      MODALITY: ${{ matrix.modality }}
      # Like vLLM's CPU CI (set by its run-cpu-test.sh): eager mode instead of inductor, no warmup.
      VLLM_CPU_CI_ENV: "1"

    steps:
      - name: Checkout Transformers
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: huggingface/transformers
          persist-credentials: false
          path: transformers

      - name: Set up vLLM, transformers and the test dependencies
        uses: ./transformers/.github/actions/vllm-ci-setup
        with:
          vllm-commit: ${{ needs.find-vllm-commit.outputs.vllm_commit }}
          # peft: the transformers reference model of granite-speech applies its audio LoRA (without peft, it runs
          # without the adapter and doesn't match vLLM)
          extra-packages: peft

      - name: "Test: Transformers backend multimodal generation (${{ matrix.modality }})"
        working-directory: vllm
        run: |
          # gemma-3n / gemma-4 (omni) and VibeVoice-ASR (audio; test_transformers_audio_mixed_lengths only uses it): their
          # audio encoder passes a transposed (non-contiguous) tensor to a linear layer, which vLLM's CPU linear kernels
          # reject ("Expected a.stride(-1) == 1" / "mat1 must be contiguous at last dimension"). vLLM CPU limitation;
          # vLLM runs these test files on GPU only.
          pytest -v -s "tests/models/multimodal/generation/test_transformers_${MODALITY}.py" \
            --deselect 'tests/models/multimodal/generation/test_transformers_audio.py::test_transformers_audio_generation[microsoft/VibeVoice-ASR-HF]' \
            --deselect 'tests/models/multimodal/generation/test_transformers_audio.py::test_transformers_audio_mixed_lengths' \
            --deselect 'tests/models/multimodal/generation/test_transformers_omni.py::test_transformers_omni_generation[google/gemma-3n-E2B-it]' \
            --deselect 'tests/models/multimodal/generation/test_transformers_omni.py::test_transformers_omni_generation[google/gemma-4-E2B-it]'

  # vLLM features built on transformers tokenizers / processors (the job above tests how vLLM loads them): structured
  # output (the grammar backends build their vocabulary from the HF tokenizer), detokenization, reasoning / tool-call
  # parsers (special tokens of the model's tokenizer) and video frame sampling (vs the HF video processors). Only the test
  # files that use transformers objects; all pure Python (tokenizer / processor downloads, no model forward).
  vllm-test-tokenizer-features:
    permissions:
      contents: read
    # aws-m8i-8xl-cache: sufficient RAM + writable shared cache mount (2xl is read-only).
    name: "Test vLLM structured output, detokenizer, parsers and video processing"
    needs: find-vllm-commit
    runs-on:
      group: aws-m8i-8xl-cache
    container:
      image: huggingface/transformers-torch-light
      options: "--shm-size=16gb -v /mnt/cache/.cache/huggingface:/mnt/cache/"
    env:
      HF_TOKEN: ${{ secrets.HF_HUB_READ_TOKEN }}

    steps:
      - name: Checkout Transformers
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: huggingface/transformers
          persist-credentials: false
          path: transformers

      - name: Set up vLLM, transformers and the test dependencies
        uses: ./transformers/.github/actions/vllm-ci-setup
        with:
          vllm-commit: ${{ needs.find-vllm-commit.outputs.vllm_commit }}

      # One pytest run per area, so that a collection error in one area doesn't stop the others.
      - name: "Test: structured output"
        if: ${{ !cancelled() }}
        working-directory: vllm
        run: |
          # The grammar backends (xgrammar, guidance) built from real HF tokenizers. Not included: the tests/v1/structured_output
          # files that don't use transformers objects.
          pytest -v -s \
            tests/v1/structured_output/test_backend_xgrammar.py \
            tests/v1/structured_output/test_backend_xgrammar_lark.py \
            tests/v1/structured_output/test_backend_xgrammar_stop_tokens.py \
            tests/v1/structured_output/test_backend_guidance.py \
            tests/v1/structured_output/test_grammar_backends.py \
            tests/v1/structured_output/test_structured_output_manager.py

      - name: "Test: detokenizer"
        if: ${{ !cancelled() }}
        working-directory: vllm
        run: |
          # Incremental detokenization vs the HF tokenizers' decode. Not included: the tests/detokenizer files about vLLM's
          # stop strings logic.
          pytest -v -s tests/detokenizer/test_decode_stream_seed.py tests/detokenizer/test_min_tokens.py

      - name: "Test: video processing"
        if: ${{ !cancelled() }}
        working-directory: vllm
        run: |
          # vLLM's video frame sampling vs the HF video processors (AutoVideoProcessor). The rest of tests/multimodal is vLLM's
          # media loading / hashing (no transformers).
          pytest -v -s tests/multimodal/test_video.py

      - name: "Test: reasoning and tool parsers"
        if: ${{ !cancelled() }}
        working-directory: vllm
        run: |
          # Only the parser tests that load the model's tokenizer (special tokens); the others parse text with vLLM's logic.
          pytest -v -s \
            tests/parser/test_harmony.py \
            tests/reasoning/test_base_thinking_reasoning_parser.py \
            tests/reasoning/test_deepseekr1_reasoning_parser.py \
            tests/reasoning/test_deepseekv3_reasoning_parser.py \
            tests/reasoning/test_ernie45_reasoning_parser.py \
            tests/reasoning/test_glm4_moe_reasoning_parser.py \
            tests/reasoning/test_granite_reasoning_parser.py \
            tests/reasoning/test_holo2_reasoning_parser.py \
            tests/reasoning/test_hunyuan_reasoning_parser.py \
            tests/reasoning/test_minimax_m2_append_reasoning_parser.py \
            tests/reasoning/test_minimax_m2_reasoning_parser.py \
            tests/reasoning/test_olmo3_reasoning_parser.py \
            tests/reasoning/test_qwen3_reasoning_parser.py \
            tests/tool_parsers/test_gigachat3_tool_parser.py \
            tests/tool_parsers/test_granite4_tool_parser.py \
            tests/tool_parsers/test_lfm2_tool_parser.py

      - name: "Test: engine output processing"
        if: ${{ !cancelled() }}
        working-directory: vllm
        run: |
          # The v1 engine's output processing (incremental detokenization, logprobs, stop tokens / strings) with a real HF
          # tokenizer (the `dummy_test_vectors` fixture). Not included: the tests of vLLM's request bookkeeping in the same
          # file, and test_logprobs_processor.py (no tokenizer).
          pytest -v -s \
            tests/v1/engine/test_fast_incdec_prefix_err.py \
            tests/v1/engine/test_output_processor.py::test_incremental_detokenization \
            tests/v1/engine/test_output_processor.py::test_request_stream_interval_raises_but_not_below_engine_default \
            tests/v1/engine/test_output_processor.py::test_logprobs_processor \
            tests/v1/engine/test_output_processor.py::test_stop_token \
            tests/v1/engine/test_output_processor.py::test_stop_string \
            tests/v1/engine/test_output_processor.py::test_iteration_stats \
            tests/v1/engine/test_output_processor.py::test_watermark_status_partitions_finished_requests \
            tests/v1/engine/test_output_processor.py::test_lora_request_tracking \
            tests/v1/engine/test_output_processor.py::test_abort_requests

  # vLLM's own multimodal models vs transformers (`hf_runner`): the `cpu_model` tests of
  # `tests/models/multimodal/generation` (vLLM's CPU CI: "CPU-Multi-Modal Model Tests"), the multimodal counterpart of
  # `vllm-test-hf-comparison`. Not included: test_ultravox.py (its `cpu_model` tests have no transformers reference).
  vllm-test-multimodal-hf-comparison:
    permissions:
      contents: read
    # aws-m8i-8xl-cache: sufficient RAM + writable shared cache mount (2xl is read-only).
    name: "Test vLLM vs transformers outputs, multimodal models (shard ${{ matrix.shard }} / 4)"
    needs: find-vllm-commit
    runs-on:
      group: aws-m8i-8xl-cache
    container:
      image: huggingface/transformers-torch-light
      options: "--shm-size=16gb -v /mnt/cache/.cache/huggingface:/mnt/cache/"
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      HF_TOKEN: ${{ secrets.HF_HUB_READ_TOKEN }}
      SHARD_ID: ${{ matrix.shard }}
      # Like vLLM's CPU CI (set by its run-cpu-test.sh): eager mode instead of inductor, no warmup.
      VLLM_CPU_CI_ENV: "1"

    steps:
      - name: Checkout Transformers
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: huggingface/transformers
          persist-credentials: false
          path: transformers

      - name: Set up vLLM, transformers and the test dependencies
        uses: ./transformers/.github/actions/vllm-ci-setup
        with:
          vllm-commit: ${{ needs.find-vllm-commit.outputs.vllm_commit }}
          # For "Test: more multimodal model files": peft (Granite Speech LoRA), open-clip-torch + albumentations (Nemotron Parse
          # remote code), mistral_common[audio] (Voxtral).
          extra-packages: pytest-shard peft open-clip-torch==2.32.0 albumentations==1.4.6 mistral_common[audio]

      - name: "Test: multimodal models generation (shard ${{ matrix.shard }} / 4)"
        if: ${{ !cancelled() }}
        working-directory: vllm
        run: |
          # Not included: test_whisper.py (its only `cpu_model` test skips itself on CPU: it uses enforce_eager=False).
          pytest -v -s tests/models/multimodal/generation/test_common.py -m cpu_model --num-shards=4 --shard-id=$SHARD_ID

      # Multimodal pooling models vs transformers (`hf_runner`), beyond CLIP / SigLIP (run in `vllm-test-hf-comparison`).
      # Only ~9 tests: one test file per shard (with `--num-shards`, a shard could get no test), shard 3 runs none.
      # Not included:
      # - test_intern_vit.py and test_radio.py: they build vLLM's model directly (`default_vllm_config` / `dist_init`
      #   fixtures), without the weight loading that sets up vLLM's CPU linear layers ("'QKVParallelLinear' object has no
      #   attribute 'cpu_linear'"); vLLM runs them on GPU only.
      # - the tests of test_llama_nemotron_vl.py without a transformers reference, test_prithvi_mae.py (skips itself:
      #   needs terratorch), test_llava_next.py (CUDA only) and test_models_image_special_tokens_processing of
      #   test_phi3v.py (vLLM only).
      - name: "Test: multimodal pooling models (shard ${{ matrix.shard }} / 4)"
        if: ${{ !cancelled() }}
        working-directory: vllm
        run: |
          case "$SHARD_ID" in
            0)
              pytest -v -s \
                tests/models/multimodal/pooling/test_llama_nemotron_vl.py::test_models \
                tests/models/multimodal/pooling/test_llama_nemotron_vl.py::test_reranker
              ;;
            1)
              # test_models_image skips itself on CPU (`@large_gpu_test(min_gb=48)`).
              pytest -v -s tests/models/multimodal/pooling/test_dse_qwen2_vl.py
              ;;
            2)
              pytest -v -s tests/models/multimodal/pooling/test_jinavl_reranker.py
              ;;
            3)
              # test_models_image skips itself on CPU (`@large_gpu_test(min_gb=48)`).
              pytest -v -s \
                tests/models/multimodal/pooling/test_phi3v.py::test_models_text \
                tests/models/multimodal/pooling/test_phi3v.py::test_models_image
              ;;
          esac

      # The per-model test files of tests/models/multimodal/generation that compare with transformers (`hf_runner`),
      # one per shard. Not included:
      # - the tests of these files without a transformers reference, test_whisper.py's test_models (already run with
      #   `cpu_model` above) and test_models_distributed (2 GPUs).
      # - test_mm_prefix_lm.py: vLLM's CPU attention backend doesn't support the multimodal prefix (bidirectional image
      #   attention, `supports_mm_prefix()`): hidden states far from transformers (cosine 0.64); vLLM runs it on GPU only.
      # - test_phi4mm.py: too slow on CPU (vLLM's `execute_model` call timed out); its test_multi_images_models needs a
      #   large GPU anyway.
      # - test_nemotron_parse.py with Nemotron-Parse-v1.2 (~35 min on CPU) and test_nemotron_parse_35.py (not done after
      #   15 min): too slow.
      - name: "Test: more multimodal model files (shard ${{ matrix.shard }} / 4)"
        if: ${{ !cancelled() }}
        working-directory: vllm
        run: |
          case "$SHARD_ID" in
            0)
              pytest -v -s tests/models/multimodal/generation/test_granite_speech.py::test_models
              ;;
            1)
              pytest -v -s tests/models/multimodal/generation/test_voxtral.py::test_hf_reference
              ;;
            2)
              pytest -v -s tests/models/multimodal/generation/test_whisper.py::test_beam_search_encoder_decoder
              ;;
            3)
              pytest -v -s "tests/models/multimodal/generation/test_nemotron_parse.py::test_models[5-bfloat16-nvidia/NVIDIA-Nemotron-Parse-2.0]"
              ;;
          esac

  # More of vLLM's multimodal models vs transformers (`hf_runner`): the models of
  # `tests/models/multimodal/generation/test_common.py` that vLLM doesn't mark `cpu_model` (vLLM runs them on GPU only;
  # the `cpu_model` ones run in `vllm-test-multimodal-hf-comparison`).
  # Not included (they all skip themselves on our runner):
  # - aria, glm4_1v(-video), kimi_vl, moondream3, ovis1_6-gemma2, qwen2_5_vl-transformers, skywork_r1v: skip on CPU
  #   (`large_gpu_mark(min_gb=...)`).
  # - llama4, llava-broadcast, llava_next-broadcast: skip on CPU (`multi_gpu_marks`); llama4 (109B) wouldn't fit anyway.
  # - deepseek_vl_v2, h2ovl, minicpmv_25, minicpmv_26, minicpmo_26, molmo, ovis2, ovis2_5, phi3v, smolvlm: skip with
  #   transformers main: their HF reference needs an older transformers (`max_transformers_version` in vLLM's
  #   tests/models/registry.py).
  # - granite4_vision: skips itself (`is_available_online=False` in vLLM's tests/models/registry.py).
  # - the entries vLLM marks `skip` (cosmos3, dots_ocr, glm4v, glm_ocr, intern_vl, intern_vl-video, isaac, pixtral_hf,
  #   intern_vl-diff-patches).
  vllm-test-multimodal-hf-comparison-more:
    permissions:
      contents: read
    # aws-m8i-8xl-cache: sufficient RAM + writable shared cache mount (2xl is read-only).
    name: "Test vLLM vs transformers outputs, more multimodal models (shard ${{ matrix.shard }} / 8)"
    needs: find-vllm-commit
    runs-on:
      group: aws-m8i-8xl-cache
    container:
      image: huggingface/transformers-torch-light
      options: "--shm-size=16gb -v /mnt/cache/.cache/huggingface:/mnt/cache/"
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      HF_TOKEN: ${{ secrets.HF_HUB_READ_TOKEN }}
      SHARD_ID: ${{ matrix.shard }}
      # Like vLLM's CPU CI (set by its run-cpu-test.sh): eager mode instead of inductor, no warmup.
      VLLM_CPU_CI_ENV: "1"

    steps:
      - name: Checkout Transformers
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: huggingface/transformers
          persist-credentials: false
          path: transformers

      - name: Set up vLLM, transformers and the test dependencies
        uses: ./transformers/.github/actions/vllm-ci-setup
        with:
          vllm-commit: ${{ needs.find-vllm-commit.outputs.vllm_commit }}
          extra-packages: pytest-shard

      - name: "Test: more multimodal models generation (shard ${{ matrix.shard }} / 8)"
        if: ${{ !cancelled() }}
        working-directory: vllm
        run: |
          # `-k "[<model_type>-"`: the test IDs are `<test>[<model_type>-test_case<N>]`.
          pytest -v -s tests/models/multimodal/generation/test_common.py \
            -m "not cpu_model" \
            -k "[blip2- or [gemma3- or [gemma4- or [granite_vision- or [idefics3- or [intern_vl-hf- or [llava_onevision- or [llava-onevision-transformers- or [llava_next-test or [llava_next_video- or [paddleocr_vl- or [paligemma- or [qianfan_ocr- or [qwen2_5_vl-windows-attention- or [qwen3_vl-" \
            --num-shards=8 --shard-id=$SHARD_ID

  # Other vLLM tests that compare vLLM with transformers (`hf_runner`), outside tests/models: basic correctness, the
  # OpenAI-compatible server with prompt embeddings computed by transformers, the tensorizer loader with a transformers
  # model and a compressed-tensors quantized model. One step per area.
  # Not included:
  # - the tests of these files without a transformers reference, the 2-GPU / large-GPU ones and
  #   tests/quantization/test_experts_int8.py (no transformers reference).
  # - tests/plugins_tests/bitsandbytes and tests/plugins_tests/gguf: they need out-of-tree plugins (`vllm_bnb_plugin`,
  #   vllm-gguf-plugin); vLLM's CI disables them ("until the ... plugin installation is locked").
  # - tests/v1/e2e/general/test_async_scheduling_accuracy.py: "preemption test had no preemptions" on CPU (the test
  #   relies on a small GPU KV cache to force preemptions); vLLM runs it on GPU only.
  vllm-test-hf-comparison-misc:
    permissions:
      contents: read
    # aws-m8i-8xl-cache: sufficient RAM + writable shared cache mount (2xl is read-only).
    name: "Test vLLM vs transformers outputs, other areas (basic correctness, prompt embeds, tensorizer, quantization)"
    needs: find-vllm-commit
    runs-on:
      group: aws-m8i-8xl-cache
    container:
      image: huggingface/transformers-torch-light
      options: "--shm-size=16gb -v /mnt/cache/.cache/huggingface:/mnt/cache/"
    env:
      HF_TOKEN: ${{ secrets.HF_HUB_READ_TOKEN }}
      # Like vLLM's CPU CI (set by its run-cpu-test.sh): eager mode instead of inductor, no warmup.
      VLLM_CPU_CI_ENV: "1"

    steps:
      - name: Checkout Transformers
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: huggingface/transformers
          persist-credentials: false
          path: transformers

      - name: Set up vLLM, transformers and the test dependencies
        uses: ./transformers/.github/actions/vllm-ci-setup
        with:
          vllm-commit: ${{ needs.find-vllm-commit.outputs.vllm_commit }}
          # pytest-asyncio: the async tests of tests/entrypoints/openai; tensorizer + ray: the tensorizer test (its teardown imports
          # ray). Versions of vLLM's requirements/test/cuda.in.
          extra-packages: pytest-asyncio tensorizer==2.12.1 ray>=2.56.0,<2.57

      - name: "Test: basic correctness"
        if: ${{ !cancelled() }}
        working-directory: vllm
        run: |
          pytest -v -s tests/basic_correctness/models/test_basic_correctness.py::test_models

      - name: "Test: prompt embeddings API"
        if: ${{ !cancelled() }}
        working-directory: vllm
        run: |
          # The prompt embeddings are computed with the transformers model (`hf_runner`).
          pytest -v -s \
            tests/entrypoints/openai/chat_completion/test_chat_completion_with_prompt_embeds.py::test_single_prompt_embeds_part \
            tests/entrypoints/openai/chat_completion/test_chat_completion_with_prompt_embeds.py::test_multiple_prompt_embeds_parts \
            tests/entrypoints/openai/chat_completion/test_chat_completion_with_prompt_embeds.py::test_multi_message_conversation \
            tests/entrypoints/openai/chat_completion/test_chat_completion_with_prompt_embeds.py::test_streaming \
            tests/entrypoints/openai/chat_completion/test_chat_completion_with_prompt_embeds.py::test_text_content_and_prompt_embeds_match \
            tests/entrypoints/openai/chat_completion/test_chat_completion_with_prompt_embeds.py::test_text_reasoning_and_prompt_embeds_match \
            tests/entrypoints/openai/completion/test_completion_with_prompt_embeds.py::test_completions_with_prompt_embeds \
            tests/entrypoints/openai/completion/test_completion_with_prompt_embeds.py::test_completions_with_logprobs_and_prompt_embeds \
            tests/entrypoints/openai/completion/test_completion_with_prompt_embeds.py::test_prompt_logprobs_raises_error

      - name: "Test: tensorizer loader"
        if: ${{ !cancelled() }}
        working-directory: vllm
        run: |
          # A transformers model serialized with tensorizer, loaded by vLLM: same outputs.
          pytest -v -s tests/model_executor/model_loader/tensorizer_loader/test_tensorizer.py::test_deserialized_hf_model_has_same_outputs

      - name: "Test: compressed-tensors quantized models"
        if: ${{ !cancelled() }}
        working-directory: vllm
        run: |
          pytest -v -s tests/quantization/test_compressed_tensors.py::test_compressed_tensors_w8a8_logprobs

  # Runs after all test jobs (even on failure) and produces structured JSON
  # reports of failing tests, new failures vs the previous main-branch run,
  # and a breakdown by error category. Reports are uploaded as an artifact.
  vllm-ci-report:
    name: "Generate vLLM CI failure report"
    runs-on:
      group: aws-m8i-8xl-cache
    container:
      image: huggingface/transformers-torch-light
    # Run when test jobs fail, but not when the run is cancelled (unlike `always()`).
    if: ${{ !cancelled() }}
    needs: [find-vllm-commit, vllm-test-examples, vllm-test-init, vllm-test-transformers, vllm-test-multimodal-processing, vllm-test-tokenizers-configs, vllm-test-hf-comparison, vllm-test-multimodal-generation, vllm-test-tokenizer-features, vllm-test-multimodal-hf-comparison, vllm-test-multimodal-hf-comparison-more, vllm-test-hf-comparison-misc]
    # Override workflow-level permissions to add actions:read (needed to fetch job logs).
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout Transformers
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: huggingface/transformers
          persist-credentials: false
          path: transformers

      - name: Generate failure report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 transformers/utils/analyze_ci_report.py \
            --run-id "$GITHUB_RUN_ID" \
            --workflow vllm-ci-caller.yml \
            --repo "$GITHUB_REPOSITORY" \
            --output-dir ./vllm-ci-reports \
            --plugin vllm

      - name: Show new failing tests
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'EOF'
          import glob, json, os, sys

          files = glob.glob("vllm-ci-reports/new_failing_tests_*.json")
          files = [f for f in files if "with_trace" not in f]
          if not files:
              print("No new_failing_tests_*.json found — report may have failed to generate.")
              sys.exit(0)

          with open(files[0]) as f:
              data = json.load(f)

          total = data.get("total_new_failing", 0)
          prev_url = data.get("previous_run_url") or "(none)"
          print(f"Previous run : {prev_url}")
          print(f"New failures : {total}")
          print()

          jobs = data.get("jobs", {})
          if not jobs:
              print("No new failing tests.")
          else:
              for job_name, job in jobs.items():
                  print(f"  [{job_name}]  ({job['num_failing']} new)")
                  print(f"    {job['job_url']}")
                  for t in job["tests"]:
                      print(f"    - {t}")
                  print()
          EOF

      - name: Upload failure reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vllm-ci-failure-reports
          path: vllm-ci-reports/
          if-no-files-found: warn

      - name: Upload reports to the Hub and post to Slack
        if: ${{ !cancelled() }}
        env:
          TRANSFORMERS_CI_RESULTS_UPLOAD_TOKEN: ${{ secrets.TRANSFORMERS_CI_RESULTS_UPLOAD_TOKEN }}
          CI_SLACK_BOT_TOKEN: ${{ secrets.CI_SLACK_BOT_TOKEN }}
          # Found by the `vllm-test-examples` job (see the TODO there).
          VLLM_COMMIT: ${{ needs.find-vllm-commit.outputs.vllm_commit }}
          VLLM_COMMIT_DATE: ${{ needs.find-vllm-commit.outputs.vllm_commit_date }}
        run: |
          # The transformers checkout of this job is at the run's commit, the one shown in the report.
          TRANSFORMERS_COMMIT_DATE=$(TZ=UTC git -c safe.directory='*' -C transformers log -1 --format=%cd --date=format-local:'%Y/%m/%d %H:%M:%S UTC' || true)
          python3 transformers/utils/ci_report_notify.py \
            --reports-dir ./vllm-ci-reports \
            --hub-repo hf-internal-testing/transformers_vllm_ci \
            --slack-channel "#transformers-ci-vllm" \
            --commit "vllm=vllm-project/vllm@$VLLM_COMMIT" \
            --commit-date "transformers=$TRANSFORMERS_COMMIT_DATE" \
            --commit-date "vllm=$VLLM_COMMIT_DATE"
