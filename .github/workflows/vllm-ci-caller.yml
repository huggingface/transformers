# [Temporary] bisect: which main commit between 8e094f8970 (nightly 45932608928, passes) and f6b7cbef76 (fails) breaks
# vLLM's tests/models/multimodal/processing/test_transformers_video.py::test_video_multiple_inputs[Qwen/Qwen3-VL-2B-Instruct].
# vLLM pinned to 5aea30579a (the nightly's commit), so only transformers changes between jobs.
name: vLLM Integration Tests

on:
  push:
    branches:
      - vllm_ci*

env:
  VLLM_TARGET_DEVICE: cpu
  VLLM_CPU_KVCACHE_SPACE: 32
  HF_HOME: /mnt/cache

permissions: {}

jobs:
  bisect:
    permissions:
      contents: read
    name: "Qwen3-VL video test @ ${{ matrix.commit }}"
    runs-on:
      group: aws-m8i-8xl-cache
    container:
      image: huggingface/transformers-torch-light
      options: "--shm-size=16gb -v /mnt/cache/.cache/huggingface:/mnt/cache/"
    strategy:
      fail-fast: false
      matrix:
        commit:
          - 8e094f8970a60ca83052e2c199783b247b8fc13e  # nightly's commit (expected: pass)
          - aeb1c0d619209624b8083d2bca851e4c413c38db  # #51307
          - e6f44c33fe6f817411c98aa5d3b0e567a6bb6bdb  # #51222
          - fc1adcd98cb4fb95c0939c3e2123a673982f9e0e  # #51223
          - adcc6878bd98d31ffe85f44b75ee1529a8f56259  # #51311
          - 44ee1da4158b5cdb5f836d2ddc489d191bf7d49c  # #51301
          - 5c9ca18ef807755d892671727ba9b55d2a757a9d  # #50706
          - 9acc6335d881fd46c5c4827c47d2d72e4c4b51c5  # #51365
          - ce66e565061a9cd8441f34c2cd922f56dff1f22d  # #51285
          - 04925af08a729b479998d6ad57886a748d51d878  # #51168
          - d5a6bfe462882c221ac35a06b920bd14530233a0  # #51188
          - a779a0d3598a868cc3f67e4f4794bfc39b109767  # #51229
          - 1c9278519d5e6fcc1d13044bed63e4ab3448be28  # #51363
          - f6b7cbef762d0b5997a2dcab0a6ea33f28f68753  # #50927 (C2 base, known: fail)
    env:
      HF_TOKEN: ${{ secrets.HF_HUB_READ_TOKEN }}

    steps:
      - name: Checkout Transformers at the bisect commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: huggingface/transformers
          ref: ${{ matrix.commit }}
          persist-credentials: false
          path: transformers

      - name: Show checkout
        env:
          EXPECTED: ${{ matrix.commit }}
        run: |
          HEAD_SHA=$(git -c safe.directory='*' -C transformers rev-parse HEAD)
          echo "[checkout] transformers HEAD: $HEAD_SHA (expected $EXPECTED)"
          git -c safe.directory='*' -C transformers log -1 --format='[checkout]   %h %s'
          if [ "$HEAD_SHA" != "$EXPECTED" ]; then echo "ERROR: wrong transformers commit" >&2; exit 1; fi

      - name: Set up vLLM, transformers and the test dependencies
        uses: ./transformers/.github/actions/vllm-ci-setup
        with:
          vllm-commit: 5aea30579ad672c3c35be43112b7a1f7b293a09e
          extra-packages: open-clip-torch==2.32.0 albumentations==1.4.6 kaldi-native-fbank

      - name: Show vLLM checkout
        run: |
          echo "[checkout] vLLM HEAD: $(git -c safe.directory='*' -C vllm rev-parse HEAD)"

      - name: "Test: Qwen3-VL video multiple inputs"
        working-directory: vllm
        run: |
          pytest -v -s "tests/models/multimodal/processing/test_transformers_video.py::test_video_multiple_inputs[Qwen/Qwen3-VL-2B-Instruct]"
