[rules.TRF058]
description = "Buffers must be declared as nn.Buffer attributes, not registered with register_buffer()."
default_enabled = true
allowlist_models = ["falcon_h1", "pp_doclayout_v2"]

[rules.TRF058.explanation]
what_it_does = "In modeling_*.py and modular_*.py, flags `register_buffer(\"<name>\", ...)` calls whose buffer name is a string literal, on any receiver (`self`, or another module such as `layer.mamba`). A computed name -- a variable or f-string, e.g. one buffer per layer inside a loop -- has no attribute-assignment equivalent and is exempt."
why_bad = "Since torch>=2.5 `nn.Buffer` registers a buffer through plain attribute assignment, like `nn.Parameter`. A buffer created by a method call only exists as a side effect of running `__init__`, so a modular file that wants to tweak one has to redefine the whole `__init__`. Assigned as an attribute, it can be inherited and overridden on its own."
diff = '''
-        self.register_buffer("inv_freq", inv_freq, persistent=False)
-        self.register_buffer(
-            "position_ids", torch.arange(config.max_position_embeddings).expand((1, -1)), persistent=False
-        )
+        self.inv_freq = nn.Buffer(inv_freq, persistent=False)
+        self.position_ids = nn.Buffer(torch.arange(config.max_position_embeddings).expand((1, -1)), persistent=False)
'''

[rules.TRF059]
description = "Routed Experts modules tagged with `moe_tp_experts` must take hidden states, top-k indices and top-k weights in that order."
default_enabled = true
allowlist_models = ["llama4"]

[rules.TRF059.explanation]
what_it_does = "For model directories whose tensor-parallel plan assigns `moe_tp_experts`, checks that routed `*Experts` classes take hidden states, top-k indices and top-k routing weights as the first three positional `forward` arguments. Aliases such as `selected_experts` and `routing_weights` are accepted."
why_bad = "`MoeExpertsParallel` applies a gradient transform to positional argument 3. A different signature silently applies it to the wrong tensor or skips it."
diff = '''
 class AcmeExperts(nn.Module):
-    def forward(self, hidden_states):
+    def forward(self, hidden_states, top_k_index, top_k_weights):
         ...
'''
